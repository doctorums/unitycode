<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UnityCode — живая сеть мыслей</title>
<meta name="description" content="Ты пишешь то, что тебя волнует. ИИ ищет в этом скрытые связи. Твоя мысль становится узлом живой сети.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Unbounded:wght@200;400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Unbounded:wght@200;400&display=swap" rel="stylesheet"></noscript>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;min-height:100%;}
body{
  font-family:'Share Tech Mono',monospace;
  background:radial-gradient(ellipse at 50% -10%, #0d2438 0%, #061120 55%, #040d1a 100%);
  color:rgba(255,255,255,0.85);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:8vh 1.5rem 4rem;
}
.page{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;}
.eyebrow{font-size:0.6rem;letter-spacing:0.3em;color:rgba(160,215,255,0.55);text-transform:uppercase;margin-bottom:2.2rem;text-align:center;}
.node{width:56px;height:56px;margin:0 auto 2.4rem;position:relative;flex-shrink:0;}
.node-core{width:8px;height:8px;background:rgba(255,255,255,0.8);border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);animation:pc 22s ease-in-out infinite;}
@keyframes pc{
0%{transform:translate(-50%,-50%) scale(0.20);box-shadow:0 0 4px rgba(255,255,255,0.2),0 0 10px rgba(180,210,255,0.15);}
50%{transform:translate(-50%,-50%) scale(1.09);box-shadow:0 0 10px rgba(255,255,255,0.5),0 0 28px rgba(160,200,255,0.35);}
100%{transform:translate(-50%,-50%) scale(0.20);box-shadow:0 0 4px rgba(255,255,255,0.2),0 0 10px rgba(180,210,255,0.15);}
}
h1{
  width:100%;
  font-family:'Unbounded',sans-serif;font-weight:400;
  font-size:clamp(1.1rem,3.4vw,1.7rem);line-height:1.7;
  color:rgba(255,255,255,0.92);text-align:center;
  text-shadow:0 2px 30px rgba(0,20,60,0.9);margin-bottom:3rem;
}
.steps{width:100%;margin-bottom:2.6rem;}
.step{display:flex;gap:1rem;align-items:flex-start;padding:0.9rem 0;border-top:1px solid rgba(255,255,255,0.08);}
.step:first-child{border-top:none;}
.step-n{flex-shrink:0;width:1.6rem;height:1.6rem;border:1px solid rgba(160,215,255,0.4);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:rgba(160,215,255,0.85);margin-top:0.1rem;}
.step-t{font-size:0.85rem;line-height:1.6;color:rgba(255,255,255,0.72);}
.live{width:100%;font-size:0.7rem;letter-spacing:0.05em;color:rgba(160,215,255,0.6);margin-bottom:2rem;min-height:1.2em;text-align:center;}
.cta{
  display:inline-block;padding:0.85rem 2.2rem;border:1px solid rgba(160,215,255,0.5);
  color:rgba(160,215,255,0.95);font-family:'Unbounded',sans-serif;font-size:clamp(0.85rem,2.2vw,1.05rem);
  text-decoration:none;background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);border-radius:6px;transition:all 0.3s;margin-bottom:1.6rem;
}
.cta:hover{background:rgba(255,255,255,0.1);border-color:rgba(160,215,255,0.85);}
.secondary{font-size:0.68rem;color:rgba(255,255,255,0.4);margin-bottom:5vh;text-align:center;}
.secondary a{color:rgba(160,215,255,0.6);text-decoration:underline;}
.disclaimer{width:100%;font-size:0.58rem;color:rgba(200,210,220,0.3);line-height:2.1;text-align:center;max-width:480px;margin:0 auto;}
</style>
</head>
<body>
<div class="page">

<div class="eyebrow" id="eyebrow">UNITYCODE</div>
<div class="node"><div class="node-core"></div></div>
<h1 id="lead"></h1>

<div class="steps">
  <div class="step"><div class="step-n">1</div><div class="step-t" id="step1"></div></div>
  <div class="step"><div class="step-n">2</div><div class="step-t" id="step2"></div></div>
  <div class="step"><div class="step-n">3</div><div class="step-t" id="step3"></div></div>
</div>

<div class="live" id="live"></div>

<a class="cta" id="cta" href="petlya.html"></a>
<div class="secondary" id="secondary"></div>
<p class="disclaimer" id="disc"></p>

</div>

<script src="js/uc-data.js"></script>
<script src="i18n.js"></script>
<script src="analytics.js" defer></script>
<script>
(function(){
  var t = UC_I18N.t.bind(UC_I18N);
  document.getElementById('eyebrow').textContent = t('vhod.eyebrow');
  document.getElementById('lead').textContent = t('vhod.lead');
  document.getElementById('step1').textContent = t('vhod.step1');
  document.getElementById('step2').textContent = t('vhod.step2');
  document.getElementById('step3').textContent = t('vhod.step3');
  document.getElementById('cta').textContent = t('vhod.cta');
  document.getElementById('disc').innerHTML = t('vhod.disc');
  document.getElementById('secondary').innerHTML =
    t('vhod.secondary') + '<a href="index.html">' + t('vhod.secondaryLink') + '</a>';

  var liveEl = document.getElementById('live');
  UCData.countNodes().then(function(n){
    if (n === null || n === undefined) { liveEl.textContent = t('vhod.liveFallback'); return; }
    liveEl.textContent = n + (n === 1 ? t('vhod.liveOne') : t('vhod.liveMany'));
  }).catch(function(){ liveEl.textContent = t('vhod.liveFallback'); });
})();
</script>
</body>
</html>
