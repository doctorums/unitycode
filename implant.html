<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="implant.title">UNITYCODE — Узор</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Unbounded:wght@200;400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Unbounded:wght@200;400;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="shared.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }

    main {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    .section {
      border: 1px solid var(--border);
      margin-bottom: 2rem;
      padding: 1.5rem;
      position: relative;
    }

    .section::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .section-tag {
      font-size: 0.55rem;
      color: var(--accent);
      letter-spacing: 0.2em;
      margin-bottom: 1.2rem;
      text-transform: uppercase;
    }

    .section-desc {
      font-size: 0.75rem;
      color: var(--dim);
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }

    /* Шумы пользователя */
    .noise-list {
      margin-bottom: 1.5rem;
    }

    .noise-item {
      border-left: 2px solid rgba(0,255,136,0.2);
      padding: 0.6rem 1rem;
      margin-bottom: 0.8rem;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.7);
      line-height: 1.6;
    }

    .noise-item .noise-time {
      font-size: 0.55rem;
      color: var(--dim);
      margin-top: 0.3rem;
    }

    .noise-empty {
      font-size: 0.75rem;
      color: var(--dim);
      text-align: center;
      padding: 2rem;
    }

    /* Кнопка анализа */
    .analyze-btn {
      display: inline-block;
      padding: 0.8rem 2rem;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      background: transparent;
      transition: background 0.2s, color 0.2s;
      width: 100%;
    }

    .analyze-btn:hover { background: var(--accent); color: var(--black); }
    .analyze-btn:disabled { opacity: 0.4; cursor: default; }

    /* Результат анализа */
    .analysis-result {
      margin-top: 1.5rem;
      display: none;
    }

    .analysis-result.visible { display: block; }

    .analysis-block {
      margin-bottom: 1.5rem;
    }

    .analysis-label {
      font-size: 0.55rem;
      color: var(--accent);
      letter-spacing: 0.2em;
      margin-bottom: 0.8rem;
    }

    .analysis-text {
      font-size: 0.8rem;
      line-height: 1.8;
      color: rgba(255,255,255,0.8);
      white-space: pre-wrap;
    }

    .analysis-divider {
      width: 40px;
      height: 1px;
      background: rgba(0,255,136,0.2);
      margin: 1.2rem 0;
    }

    /* Загрузка */
    .loading-dots {
      display: none;
      font-size: 0.7rem;
      color: var(--dim);
      letter-spacing: 0.2em;
      margin-top: 1rem;
      text-align: center;
    }
    .loading-dots.visible { display: block; }

    /* Статы */
    .stats-row {
      display: flex;
      gap: 2rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .stat-box .stat-label {
      font-size: 0.5rem;
      color: var(--dim);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .stat-box .stat-val {
      font-size: 1.2rem;
      color: var(--accent);
    }

    /* Нет токена */
    .no-token {
      text-align: center;
      padding: 3rem 1rem;
    }

    .no-token p {
      font-size: 0.8rem;
      color: var(--dim);
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }

    .no-token a {
      display: inline-block;
      padding: 0.7rem 1.5rem;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-decoration: none;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s;
    }

    .no-token a:hover { background: var(--accent); color: var(--black); }

    /* ═══ Вылетающее окно анализа ═══ */
    .oracle-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0);
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
      z-index: 9000;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
      opacity: 0; pointer-events: none;
      transition: opacity 0.5s ease, background 0.5s ease, backdrop-filter 0.5s ease;
    }
    .oracle-overlay.open {
      opacity: 1; pointer-events: auto;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .oracle-window {
      position: relative;
      max-width: 560px; width: 100%;
      max-height: 80vh; overflow-y: auto;
      border: 1px solid var(--accent);
      background: rgba(6,10,12,0.96);
      padding: 2.2rem 1.8rem 1.8rem;
      box-shadow: 0 0 40px rgba(0,255,136,0.08), inset 0 0 60px rgba(0,255,136,0.02);
      transform: scale(0.88);
      opacity: 0;
      transition: transform 0.5s cubic-bezier(0.16,1,0.3,1), opacity 0.5s ease;
    }
    .oracle-overlay.open .oracle-window {
      transform: scale(1);
      opacity: 1;
    }
    /* во время краула — окно становится «экраном»: фикс. высота, обрезка */
    .oracle-window.outro {
      overflow: hidden;
      height: 60vh;
      transition: height 0.6s ease;
    }
    .oracle-window::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .oracle-label {
      font-size: 0.55rem;
      color: var(--accent);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 1.4rem;
      opacity: 0.8;
    }

    .oracle-text {
      font-size: 0.95rem;
      line-height: 2;
      color: rgba(255,255,255,0.9);
      min-height: 3em;
      white-space: pre-wrap;
      font-family: 'Share Tech Mono', monospace;
    }
    .oracle-text.breathing {
      animation: oracleBreathe 5.5s ease-in-out infinite;
    }
    @keyframes oracleBreathe {
      0%, 100% { opacity: 0.82; }
      50%      { opacity: 1; }
    }
    /* фаза 2: текст плавно растворяется */
    .oracle-text.fading {
      animation: none;
      opacity: 0;
      transition: opacity 2.5s ease;
    }
    /* фаза 4: плоский краул — текст ползёт снизу вверх сплошным потоком.
       Окно (.outro) обрезает overflow, текст абсолютно позиционирован
       и едет от низа окна до полного ухода за верх. */
    .oracle-text.crawl {
      animation: none;
      position: absolute;
      left: 1.8rem; right: 1.8rem;       /* совпадает с padding окна */
      top: 100%;                          /* старт: сразу под нижним краем */
      opacity: 1;
      will-change: transform;
      animation: oracleCrawl var(--crawl-dur, 15s) linear forwards;
    }
    @keyframes oracleCrawl {
      from { transform: translateY(0); }
      to   { transform: translateY(calc(-100% - 80vh)); } /* уезжает целиком за верх */
    }

    .oracle-cursor {
      display: inline-block;
      width: 0.5em;
      color: var(--accent);
      animation: oracleCursor 1s steps(1,end) infinite;
    }
    @keyframes oracleCursor { 0%,50%{opacity:1;} 51%,100%{opacity:0;} }

    .oracle-close {
      margin-top: 1.8rem;
      display: block; width: 100%;
      padding: 0.7rem;
      border: 1px solid rgba(0,255,136,0.25);
      background: transparent;
      color: var(--dim);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      opacity: 0;
    }
    .oracle-close.show { opacity: 1; transition: opacity 0.4s ease, color 0.2s, border-color 0.2s; }
    .oracle-close:hover { color: var(--accent); border-color: var(--accent); }

    .oracle-waiting {
      font-size: 0.7rem; color: var(--dim);
      letter-spacing: 0.2em; text-align: center;
      animation: oracleBreathe 2.5s ease-in-out infinite;
    }
  </style>
</head>

<main>

<script>
const SUPABASE_URL = 'https://lukyyqabkxzrgdixzphs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_c94zOuVnId_NFhHZgRzQ2Q_h3tljPjf';

// Агент-Генератор (Спираль) — остаётся для совместимости, в анализе НЕ участвует
const WORKER_URL = 'https://unitycode-petlya.sv2txxznjm.workers.dev';

// Агент-Аналитик (Имплант)
const ANALYZE_URL = 'https://unitycode-analyze.sv2txxznjm.workers.dev';

// HTML-экранирование пользовательского текста (защита от XSS на выводе)
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const headers = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };

// ═══════════════════════════════════════════════════════
// ОРАКУЛ — вылетающее окно с печатью ответа по словам
// ═══════════════════════════════════════════════════════
let _oracleTimer = null;
let _oracleSeq = 0; // версия сессии печати: отменяет старую, если открыли заново
let _outroTimers = [];
function clearOutro() { _outroTimers.forEach(clearTimeout); _outroTimers = []; }

function resetOracleText(textEl) {
  textEl.classList.remove('breathing', 'fading', 'crawl');
  textEl.style.removeProperty('--crawl-dur');
  textEl.style.removeProperty('position');
}

function openOracle(label) {
  const ov = document.getElementById('oracle');
  const textEl = document.getElementById('oracle-text');
  const closeBtn = document.getElementById('oracle-close');
  const labelEl = document.getElementById('oracle-label');
  clearOutro();
  resetOracleText(textEl);
  if (label) labelEl.textContent = label;
  textEl.innerHTML = '<span class="oracle-waiting">// Сеть слушает<span class="oracle-cursor">▋</span></span>';
  closeBtn.classList.remove('show');
  ov.classList.add('open');
}

// Печать по словам. Скорость колеблется в диапазоне — «дыхание».
// Это ритм-хук: позже сюда подставится темп музыки вместо breatheFactor.
function typeOracle(text) {
  const textEl = document.getElementById('oracle-text');
  const closeBtn = document.getElementById('oracle-close');
  const mySeq = ++_oracleSeq;
  if (_oracleTimer) { clearTimeout(_oracleTimer); _oracleTimer = null; }
  clearOutro();
  resetOracleText(textEl);

  const words = String(text || '').trim().split(/(\s+)/); // сохраняем пробелы/переносы
  let i = 0;
  textEl.classList.remove('breathing');
  textEl.textContent = '';

  // базовая задержка на слово + лёгкая случайность; пауза дольше после точки/?/!
  const BASE = 150, JITTER = 90;
  let phase = 0;

  function step() {
    if (mySeq !== _oracleSeq) return; // открыли заново — эта печать устарела
    if (i >= words.length) {
      textEl.classList.add('breathing'); // допечатали — текст «задышал»
      closeBtn.classList.add('show');
      _oracleTimer = null;
      startOracleOutro(mySeq, text); // запускаем ритуал завершения
      return;
    }
    const chunk = words[i];
    textEl.textContent += chunk;
    i++;

    // «дыхание» темпа: синусоида в диапазоне 0.7..1.3 от базы
    phase += 0.5;
    const breatheFactor = 1 + 0.3 * Math.sin(phase);
    let delay = (BASE + Math.random() * JITTER) * breatheFactor;
    // дольше дышим после конца предложения
    if (/[.!?…]$/.test(chunk.trim())) delay += 420;

    // пробелы проскакиваем мгновенно (это «склейка» между словами)
    if (/^\s+$/.test(chunk)) delay = 20;

    _oracleTimer = setTimeout(step, delay);
  }
  step();
}

// Ритуал завершения (один проход): постоял 30с → фейд → пауза 3с →
// текст проплывает вверх и тает → окно схлопывается в центр.
// Любое закрытие/новый анализ (рост _oracleSeq) отменяет цепочку.
function startOracleOutro(mySeq, fullText) {
  const textEl = document.getElementById('oracle-text');
  clearOutro();
  const alive = () => mySeq === _oracleSeq && document.getElementById('oracle').classList.contains('open');

  // 1) постоял 30с → фейд-аут текста (2.5с)
  _outroTimers.push(setTimeout(() => {
    if (!alive()) return;
    textEl.classList.remove('breathing');
    textEl.classList.add('fading');
  }, 30000));

  // 2) фейд завершился (~2.5с) + пауза 3с → текст ползёт снизу вверх (краул)
  // Длительность краула зависит от длины текста: дольше для длинного,
  // чтобы успеть прочитать ползущее. Диапазон ~12..20с.
  const crawlDur = Math.min(20, Math.max(12, Math.round(String(fullText).length / 18)));
  _outroTimers.push(setTimeout(() => {
    if (!alive()) return;
    const win = document.querySelector('.oracle-window');
    if (win) win.classList.add('outro');
    textEl.classList.remove('fading', 'breathing');
    textEl.textContent = fullText;
    textEl.style.setProperty('--crawl-dur', crawlDur + 's');
    void textEl.offsetHeight;          // форс reflow перед стартом анимации
    textEl.classList.add('crawl');     // поехал снизу вверх сплошным потоком
  }, 30000 + 2500 + 3000));

  // 3) краул закончился (текст ушёл за верх) → окно схлопывается в центр
  _outroTimers.push(setTimeout(() => {
    if (!alive()) return;
    closeOracle();
  }, 30000 + 2500 + 3000 + crawlDur * 1000 + 500));
}

function showOracleError(msg) {
  const textEl = document.getElementById('oracle-text');
  const closeBtn = document.getElementById('oracle-close');
  if (_oracleTimer) { clearTimeout(_oracleTimer); _oracleTimer = null; }
  _oracleSeq++;
  textEl.classList.remove('breathing');
  textEl.textContent = msg;
  closeBtn.classList.add('show');
}

function closeOracle() {
  const ov = document.getElementById('oracle');
  const textEl = document.getElementById('oracle-text');
  if (_oracleTimer) { clearTimeout(_oracleTimer); _oracleTimer = null; }
  clearOutro();
  _oracleSeq++;
  ov.classList.remove('open');
  const win = document.querySelector('.oracle-window');
  if (win) win.classList.remove('outro');
  // сброс классов фаз после закрытия (когда окно уже скрылось)
  setTimeout(() => resetOracleText(textEl), 600);
}

// Esc закрывает окно
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOracle(); });


function timeAgo(iso) {
  const diff = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (diff < 60)    return UC_I18N.t('set.tNow');
  if (diff < 3600)  return Math.floor(diff / 60) + UC_I18N.t('set.tMin');
  if (diff < 86400) return Math.floor(diff / 3600) + UC_I18N.t('set.tHour');
  return Math.floor(diff / 86400) + UC_I18N.t('set.tDay');
}

// ═══════════════════════════════════════════════════════
// ЛИЧНЫЙ БЛОК
// ═══════════════════════════════════════════════════════
async function loadPersonal() {
  const myToken = localStorage.getItem('uc_token');
  const container = document.getElementById('personal-content');

  if (!myToken) {
    container.innerHTML = `
      <div class="no-token">
        <p>${UC_I18N.t('implant.noToken')}</p>
        <a href="petlya.html">${UC_I18N.t('implant.toSpiral')}</a>
      </div>`;
    return;
  }

  // Сначала — свои узлы
  const nodesRes = await fetch(
    `${SUPABASE_URL}/rest/v1/nodes?user_token=eq.${myToken}&select=id,created_at,raw_noise&order=created_at.desc`,
    { headers }
  );
  const myNodes = await nodesRes.json();

  if (!Array.isArray(myNodes) || !myNodes.length) {
    container.innerHTML = `
      <div class="no-token">
        <p>${UC_I18N.t('implant.noNodes')}</p>
        <a href="petlya.html">${UC_I18N.t('implant.toSpiral')}</a>
      </div>`;
    return;
  }

  // Теперь — связи по ID этих узлов. Supabase REST хочет явный список id,
  // а не SQL-подзапрос. Собираем список и спрашиваем связи в обе стороны.
  // Берём концы пар (from/to) — они нужны и для счётчика, и для анализа.
  const myIds = myNodes.map(n => n.id);
  const idList = `(${myIds.join(',')})`;

  let totalConnections = 0;
  window._myConns = [];
  try {
    const [connsFromRes, connsToRes] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/connections?from_node_id=in.${idList}&status=eq.accepted&select=from_node_id,to_node_id`, { headers }),
      fetch(`${SUPABASE_URL}/rest/v1/connections?to_node_id=in.${idList}&status=eq.accepted&select=from_node_id,to_node_id`, { headers }),
    ]);
    const connsFrom = await connsFromRes.json();
    const connsTo = await connsToRes.json();
    const a = Array.isArray(connsFrom) ? connsFrom : [];
    const b = Array.isArray(connsTo) ? connsTo : [];
    // Дедуп: связь могла попасть в оба запроса (оба конца мои)
    const seen = new Set();
    [...a, ...b].forEach(c => {
      const key = c.from_node_id + '|' + c.to_node_id;
      if (!seen.has(key)) { seen.add(key); window._myConns.push(c); }
    });
    totalConnections = window._myConns.length;
  } catch (e) {
    console.warn('Ошибка подсчёта связей:', e);
    totalConnections = 0;
  }

  container.innerHTML = `
    <div class="stats-row">
      <div class="stat-box">
        <span class="stat-label">${UC_I18N.t('implant.statYourNoises')}</span>
        <span class="stat-val">${myNodes.length}</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">${UC_I18N.t('implant.statConns')}</span>
        <span class="stat-val">${totalConnections}</span>
      </div>
    </div>
    <div class="noise-list" id="my-noises"></div>
    <button class="analyze-btn" id="personal-btn" onclick="runPersonalAnalysis()">${UC_I18N.t('implant.btnPersonal')}</button>
    <div class="loading-dots" id="personal-loading">${UC_I18N.t('implant.loading')}</div>
    <div class="analysis-result" id="personal-result">
      <div class="analysis-divider"></div>
      <div class="analysis-block">
        <div class="analysis-label">${UC_I18N.t('implant.labelYourPattern')}</div>
        <div class="analysis-text" id="personal-text"></div>
      </div>
    </div>`;

  const list = document.getElementById('my-noises');
  myNodes.forEach(node => {
    list.innerHTML += `
      <div class="noise-item">
        ${esc(node.raw_noise)}
        <div class="noise-time">${timeAgo(node.created_at)}</div>
      </div>`;
  });

  // Сохраняем шумы для анализа
  window._myNodes = myNodes; // [{id, created_at, raw_noise}] — для анализа
}

// ═══════════════════════════════════════════════════════
// АНАЛИЗ ЛИЧНОГО УЗЛА
// ═══════════════════════════════════════════════════════
async function runPersonalAnalysis() {
  const btn = document.getElementById('personal-btn');

  btn.disabled = true;
  openOracle(UC_I18N.t('implant.labelYourPattern'));

  const myNodes = window._myNodes || [];
  if (!myNodes.length) { closeOracle(); btn.disabled = false; return; }

  try {
    // Шлём граф Агенту-Аналитику: узлы с id + пары связей,
    // чтобы аналитик видел, ЧТО с ЧЕМ соединено.
    const res = await fetch(ANALYZE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        scope: 'personal',
        lang: (window.UC_I18N ? UC_I18N.lang : 'ru'),
        nodes: myNodes.map(n => ({ id: n.id, raw_noise: n.raw_noise })),
        connections: window._myConns || [],
      }),
    });
    const data = await res.json();
    typeOracle(data.interpretation || UC_I18N.t('petlya.signalUnrecognized'));
  } catch(e) {
    showOracleError(UC_I18N.t('implant.analyzeError'));
  } finally {
    btn.disabled = false;
  }
}

// ═══════════════════════════════════════════════════════
// КОЛЛЕКТИВНЫЙ АНАЛИЗ
// ═══════════════════════════════════════════════════════
async function loadStats() {
  try {
    const [nodesRes, connsRes] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/nodes?select=id,user_token`, { headers }),
      fetch(`${SUPABASE_URL}/rest/v1/connections?select=id&status=eq.accepted`, { headers }),
    ]);
    const [nodes, conns] = await Promise.all([nodesRes.json(), connsRes.json()]);

    const uniqueUsers = new Set(nodes.filter(n => n.user_token).map(n => n.user_token)).size;

    document.getElementById('total-nodes').textContent = nodes.length;
    document.getElementById('total-connections').textContent = conns.length;
    document.getElementById('total-users').textContent = uniqueUsers;

    // Сохраняем для анализа + полные счётчики для триггера кэша
    window._allNodeIds = nodes.map(n => n.id);
    window._graphCounts = { nodes: nodes.length, conns: conns.length };
  } catch(e) { console.warn('Stats error', e); }
}

async function runCollectiveAnalysis() {
  const btn = document.getElementById('collective-btn');

  btn.disabled = true;
  openOracle(UC_I18N.t('implant.labelNetPattern'));

  try {
    // Берём последние 30 шумов (с id) + пары связей для анализа мостов
    const [nodesRes, connsRes] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/nodes?select=id,raw_noise&order=created_at.desc&limit=30`, { headers }),
      fetch(`${SUPABASE_URL}/rest/v1/connections?select=from_node_id,to_node_id&status=eq.accepted`, { headers }),
    ]);
    const nodes = await nodesRes.json();
    const conns = await connsRes.json();

    if (!nodes.length) {
      typeOracle(UC_I18N.t('implant.netEmpty'));
      return;
    }

    // Шлём граф Агенту-Аналитику в режиме коллективного среза.
    // graph_counts — полные счётчики всей Сети (не обрезанные 30),
    // по ним worker решает: отдать кэш или пересчитать.
    const gc = window._graphCounts || { nodes: nodes.length, conns: (Array.isArray(conns) ? conns.length : 0) };
    const aiRes = await fetch(ANALYZE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        scope: 'collective',
        lang: (window.UC_I18N ? UC_I18N.lang : 'ru'),
        nodes: nodes,
        connections: Array.isArray(conns) ? conns : [],
        graph_counts: gc,
      }),
    });
    const data = await aiRes.json();
    typeOracle(data.interpretation || UC_I18N.t('petlya.signalUnrecognized'));

  } catch(e) {
    showOracleError(UC_I18N.t('implant.analyzeError'));
  } finally {
    btn.disabled = false;
  }
}

// Инициализация
loadPersonal();
loadStats();
</script>
</body>
</html>
