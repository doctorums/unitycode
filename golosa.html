<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="voice.title">UNITYCODE — Голоса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Unbounded:wght@200;400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Unbounded:wght@200;400&display=swap" rel="stylesheet"></noscript>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;min-height:100%;}
body{
  font-family:'Share Tech Mono',monospace;
  background:radial-gradient(ellipse at 50% -10%, #0d2438 0%, #061120 55%, #040d1a 100%);
  color:rgba(255,255,255,0.85);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  /* переключатель языка (i18n.js) — fixed, top:safe-area+12px, свои ~38px
     высоты, справа. На невысоких экранах 8vh не хватает, чтобы «ВТОРЫЕ
     ВОРОТА» не заехали под него; на них с чёлкой та же беда от safe-area.
     max() берёт что больше — вниз не просядет ни там, ни там. */
  padding:max(8vh, calc(env(safe-area-inset-top,0px) + 64px)) 1.5rem 4rem;
}
.page{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;}
.eyebrow{font-size:0.6rem;letter-spacing:0.3em;color:rgba(160,215,255,0.55);text-transform:uppercase;margin-bottom:2.2rem;text-align:center;}
.node{width:56px;height:56px;margin:0 auto 2.4rem;position:relative;flex-shrink:0;}
.node-core{width:8px;height:8px;background:rgba(255,255,255,0.8);border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);animation:pc 22s ease-in-out infinite;}
@keyframes pc{
0%{transform:translate(-50%,-50%) scale(0.20);box-shadow:0 0 4px rgba(255,255,255,0.2),0 0 10px rgba(180,210,255,0.15);}
50%{transform:translate(-50%,-50%) scale(1.09);box-shadow:0 0 10px rgba(255,255,255,0.5),0 0 28px rgba(160,200,255,0.35);}
100%{transform:translate(-50%,-50%) scale(0.20);box-shadow:0 0 4px rgba(255,255,255,0.2),0 0 10px rgba(180,210,255,0.15);}
}
h1{
  width:100%;
  font-family:'Unbounded',sans-serif;font-weight:400;
  font-size:clamp(1.1rem,3.4vw,1.7rem);line-height:1.7;
  color:rgba(255,255,255,0.92);text-align:center;
  text-shadow:0 2px 30px rgba(0,20,60,0.9);margin-bottom:2.6rem;
}
#state{width:100%;display:flex;flex-direction:column;align-items:center;}
.note{font-size:0.85rem;line-height:1.75;color:rgba(255,255,255,0.62);text-align:center;max-width:460px;margin-bottom:1.2rem;}
.link-back{display:inline-block;margin-top:0.6rem;padding:0.6rem;margin-bottom:-0.6rem;font-size:0.68rem;letter-spacing:0.1em;color:rgba(160,215,255,0.75);text-decoration:underline;}
.voice-form{width:100%;display:flex;flex-direction:column;align-items:center;}
.voice-textarea{
  width:100%;min-height:220px;resize:vertical;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.18);border-radius:8px;
  color:rgba(255,255,255,0.9);font-family:'Share Tech Mono',monospace;font-size:0.88rem;line-height:1.7;
  padding:1rem;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.voice-textarea:focus{outline:none;border-color:rgba(160,215,255,0.5);}
.voice-row{width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:0.6rem;margin-bottom:0.5rem;}
.voice-counter{font-size:0.65rem;letter-spacing:0.05em;color:rgba(255,255,255,0.35);}
.voice-counter.over,.voice-counter.under{color:rgba(255,140,140,0.85);}
.voice-hint{width:100%;font-size:0.62rem;color:rgba(255,150,150,0.75);text-align:left;margin-bottom:0.9rem;min-height:1.2em;}
.voice-btn{
  padding:0.7rem 2rem;min-height:44px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid rgba(160,215,255,0.5);
  color:rgba(160,215,255,0.95);font-family:'Share Tech Mono',monospace;font-size:0.7rem;letter-spacing:0.15em;
  text-transform:uppercase;background:rgba(255,255,255,0.05);cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:6px;transition:all 0.3s;
}
.voice-btn:hover:not(:disabled){background:rgba(255,255,255,0.1);border-color:rgba(160,215,255,0.85);}
.voice-btn:disabled{opacity:0.55;cursor:default;}
.voice-note{font-size:0.6rem;color:rgba(200,210,220,0.35);line-height:1.8;text-align:center;max-width:460px;margin-top:1.4rem;}
.voice-draft{font-size:0.6rem;color:rgba(160,215,255,0.5);letter-spacing:0.05em;text-align:center;margin-bottom:0.8rem;}

/* ═══ РЕЖИМ ВОДЫ (Apple Pencil) — слияние с прежним прототипом water_test.html.
   Тот же текст, что в обычной textarea выше: вход/выход просто синхронизируют
   значения, гейт/Turnstile/отправка остаются едиными. Кнопка перехода скрыта,
   пока не увидели перо (прогрессивное усиление, как было в прототипе). ═══ */
#toWater{display:none;margin-bottom:0.8rem;}
#toWater.avail{display:inline-flex;}
#loadFile{margin-bottom:0.8rem;}
#water{position:fixed;inset:0;z-index:900;display:none;background:#00040a;}
#water.on{display:block;}
#waterCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
#waterInput{
  position:absolute;inset:0;width:100%;height:100%;
  background:transparent;border:none;outline:none;resize:none;
  color:rgba(200,225,255,0.92);font-family:'Share Tech Mono',monospace;
  font-size:clamp(20px,3.4vw,34px);line-height:1.75;letter-spacing:0.02em;
  text-align:center;padding:22vh 8vw calc(18vh + env(safe-area-inset-bottom,0px));
  caret-color:rgba(160,215,255,0.95);
  text-shadow:0 0 18px rgba(90,170,255,0.35),0 0 4px rgba(200,230,255,0.25);
}
#waterInput::placeholder{color:rgba(150,190,230,0.28);}
.wbar{position:absolute;top:0;left:0;right:0;z-index:2;
  padding:calc(0.9rem + env(safe-area-inset-top,0px)) 1.2rem 0.9rem;
  display:flex;justify-content:space-between;align-items:center;gap:0.8rem;pointer-events:none;}
.wbar > *{pointer-events:auto;}
.wcount{font-size:0.55rem;color:rgba(255,255,255,0.35);letter-spacing:0.1em;}
.wsend{position:absolute;left:50%;transform:translateX(-50%);z-index:2;
  bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));}
</style>
</head>
<body>
<div class="page">

<div class="eyebrow" data-i18n="voice.eyebrow">ВТОРЫЕ ВОРОТА</div>
<div class="node"><div class="node-core"></div></div>
<h1 data-i18n="voice.lead"></h1>

<div id="state"></div>

</div>

<div id="ts-box" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4000;"></div>

<div id="water">
  <canvas id="waterCanvas"></canvas>
  <textarea id="waterInput" maxlength="4000"></textarea>
  <div class="wbar">
    <button class="voice-btn" id="exitWater" type="button" data-i18n="voice.waterExit">← выйти</button>
    <span class="wcount"><span id="wCount">0</span> / <span id="wCountMax">4000</span></span>
  </div>
  <button class="voice-btn wsend" id="wSend" type="button" data-i18n="voice.waterDone">[ ГОТОВО ]</button>
</div>

<script src="js/uc-data.js"></script>
<script src="i18n.js"></script>
<script src="analytics.js" defer></script>
<script>
(function(){
  var t = UC_I18N.t.bind(UC_I18N), tn = UC_I18N.tn.bind(UC_I18N);
  var TOKEN_RE = /^[0-9a-f]{64}$/i;
  var VOICE_MIN = 50;   // синхронизировано с CHECK в voices и VOICE_TEXT_MIN воркера
  var VOICE_MAX = 4000;
  var DRAFT_KEY = 'uc_voice_draft';
  var WRITE_WORKER_URL = 'https://unitycode-write.sv2txxznjm.workers.dev/';
  var TURNSTILE_SITEKEY = '0x4AAAAAADipuIhRBHuABO1Z';

  var stateEl = document.getElementById('state');
  var myToken = UCData.token();

  // ── Turnstile: тот же виджет и режим, что в petlya.html, без прогрева —
  // здесь нет тесной петли «жест → отправка», торопиться некуда.
  var _tsId = null, _tsResolve = null;
  function setTsVisible(on){
    var box = document.getElementById('ts-box');
    if (box) box.style.visibility = on ? 'visible' : 'hidden';
  }
  window.onloadTurnstileCallback = function(){
    try {
      _tsId = turnstile.render('#ts-box', {
        sitekey: TURNSTILE_SITEKEY, appearance: 'interaction-only', execution: 'execute',
        callback: function(tok){ setTsVisible(false); if(_tsResolve){ _tsResolve(tok); _tsResolve=null; } },
        'error-callback': function(){ setTsVisible(false); if(_tsResolve){ _tsResolve(''); _tsResolve=null; } }
      });
    } catch(e){}
    setTsVisible(false);
  };
  function getTurnstileToken(){
    return new Promise(function(resolve){
      if (!window.turnstile || _tsId === null) { resolve(''); return; }
      var done = false;
      function finish(v){ if(done) return; done = true; setTsVisible(false); resolve(v); }
      _tsResolve = finish;
      setTsVisible(true);
      try { turnstile.reset(_tsId); } catch(e){}
      try { turnstile.execute(_tsId); } catch(e){ finish(''); }
      setTimeout(function(){ if(!done){ _tsResolve = null; finish(''); } }, 12000);
    });
  }
  // Худший канал: скрипт Turnstile мог не догрузиться вовсе — не ждём вечно.
  function waitTsReady(maxMs){
    return new Promise(function(resolve){
      var start = Date.now();
      (function poll(){
        if (_tsId !== null) { resolve(); return; }
        if (Date.now() - start > maxMs) { resolve(); return; }
        setTimeout(poll, 150);
      })();
    });
  }
  async function safeTurnstileToken(){
    await waitTsReady(4000);
    return getTurnstileToken();
  }

  function genIdem(){
    try { return crypto.randomUUID(); } catch(e){ return Date.now().toString(36) + Math.random().toString(36).slice(2); }
  }

  function readDraft(){
    try {
      var raw = localStorage.getItem(DRAFT_KEY);
      if (!raw) return '';
      var d = JSON.parse(raw);
      return (d && typeof d.text === 'string') ? d.text : '';
    } catch(e){ return ''; }
  }
  function writeDraft(text){
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ text: text, at: Date.now() })); } catch(e){}
  }
  function clearDraft(){
    try { localStorage.removeItem(DRAFT_KEY); } catch(e){}
  }

  // ── Состояния ───────────────────────────────────────────────────────────
  function renderNote(key){
    var p = document.createElement('p');
    p.className = 'note';
    p.textContent = t(key);
    stateEl.innerHTML = '';
    stateEl.appendChild(p);
  }
  function renderGuest(){
    renderNote('voice.lockedGuest');
    var a = document.createElement('a');
    a.className = 'link-back';
    a.href = 'petlya.html';
    a.textContent = t('nav.spiral');
    stateEl.appendChild(a);
  }
  function renderChecking(){ renderNote('voice.checking'); }
  function renderLocked(count, threshold){
    stateEl.innerHTML = '';
    var p = document.createElement('p');
    p.className = 'note';
    p.textContent = tn('voice.lockedProgress', count, { threshold: threshold });
    stateEl.appendChild(p);
    var a = document.createElement('a');
    a.className = 'link-back';
    a.href = 'petlya.html';
    a.textContent = t('nav.spiral');
    stateEl.appendChild(a);
  }

  function renderForm(){
    stateEl.innerHTML = '';

    // Заголовок объяснял условие входа («если вплёл достаточно шума…») —
    // как только форма открыта, это уже прошедший факт, а не условие, и
    // voice.unlockedLead ниже говорит по сути то же самое настоящим
    // временем. Оставляем заголовок только для locked/checking.
    var h1 = document.querySelector('h1');
    if (h1) h1.style.display = 'none';

    var draft = readDraft();
    if (draft) {
      var dn = document.createElement('div');
      dn.className = 'voice-draft';
      dn.textContent = t('voice.draftRestored');
      stateEl.appendChild(dn);
    }

    var lead = document.createElement('p');
    lead.className = 'note';
    lead.textContent = t('voice.unlockedLead');
    stateEl.appendChild(lead);

    var form = document.createElement('div');
    form.className = 'voice-form';

    var ta = document.createElement('textarea');
    ta.className = 'voice-textarea';
    ta.maxLength = VOICE_MAX;
    ta.placeholder = t('voice.placeholder');
    ta.value = draft;
    form.appendChild(ta);

    var row = document.createElement('div');
    row.className = 'voice-row';
    var counter = document.createElement('span');
    counter.className = 'voice-counter';
    row.appendChild(counter);
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'voice-btn';
    btn.textContent = t('voice.send');
    row.appendChild(btn);
    form.appendChild(row);

    var hint = document.createElement('p');
    hint.className = 'voice-hint';
    form.appendChild(hint);

    var note = document.createElement('p');
    note.className = 'voice-note';
    note.textContent = t('voice.networkNote');
    form.appendChild(note);

    stateEl.appendChild(form);

    function updateCounter(){
      var n = ta.value.length;
      counter.textContent = t('voice.charCount', { n: n, max: VOICE_MAX });
      var under = n > 0 && n < VOICE_MIN, over = n > VOICE_MAX;
      counter.classList.toggle('under', under);
      counter.classList.toggle('over', over);
      hint.textContent = under ? t('voice.tooShort', { min: VOICE_MIN }) : over ? t('voice.tooLong') : '';
      btn.disabled = (n < VOICE_MIN || n > VOICE_MAX);
    }
    updateCounter();

    var draftTimer = null;
    ta.addEventListener('input', function(){
      updateCounter();
      clearTimeout(draftTimer);
      draftTimer = setTimeout(function(){ writeDraft(ta.value); }, 400);
    });

    var idem = genIdem();
    var sending = false;

    async function send(){
      if (sending) return;
      var text = ta.value.trim();
      if (text.length < VOICE_MIN || text.length > VOICE_MAX) return;
      sending = true;
      btn.disabled = true;
      btn.textContent = t('voice.sending');
      writeDraft(ta.value); // на случай обрыва прямо во время отправки

      try {
        var ts = await safeTurnstileToken();
        var res = await UCData.fetchRetry(WRITE_WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'voice_write',
            token: myToken,
            turnstile: ts,
            user_token: myToken,
            text: text,
            lang: UC_I18N.lang,
            client_id: idem,
          }),
        });
        var data = await res.json();
        if (!data || data.ok !== true) throw new Error('voice_write: ' + (data && data.error));

        clearDraft();
        ta.value = '';
        updateCounter();
        btn.textContent = t('voice.sent');
        idem = genIdem(); // готовим отдельный голос к следующей отправке
        // Голос ушёл — писать больше нечего, и это единственный момент, когда
        // про перо можно судить наверняка, а не по тишине событий. Гасим
        // кнопку сразу; захочешь писать пером ещё раз — касание её вернёт.
        if (toWater) { penSeen = false; toWater.classList.remove('avail'); clearTimeout(penIdleTimer); }
        setTimeout(function(){ btn.textContent = t('voice.send'); sending = false; updateCounter(); }, 2400);
      } catch(e) {
        // Текст остаётся в textarea и в черновике — обрыв связи ничего не стирает.
        btn.textContent = t('voice.retry');
        sending = false;
        btn.disabled = false;
      }
    }
    btn.addEventListener('click', send);

    // ═══════════════════════════════════════════════
    // ЗАГРУЗКА ГОТОВОГО ФАЙЛА
    // Голос — длинный текст, а набрать 4000 символов пальцем на телефоне
    // нереально; у человека он уже написан в заметках. Читаем локально,
    // ничего никуда не отправляя: содержимое просто ложится в поле, дальше
    // обычный путь — счётчик, проверка, отправка. Доступно всегда и всем,
    // в отличие от воды (той нужно перо).
    // ═══════════════════════════════════════════════
    var fileBtn = document.createElement('button');
    fileBtn.type = 'button';
    fileBtn.id = 'loadFile';
    fileBtn.className = 'voice-btn';
    fileBtn.textContent = t('voice.fileLoad');
    form.insertBefore(fileBtn, ta);

    var fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = '.txt,.md,.markdown,text/plain,text/markdown';
    fileInput.style.display = 'none';
    form.appendChild(fileInput);

    fileBtn.addEventListener('click', function(){
      fileInput.value = '';   // иначе повторный выбор того же файла молчит
      fileInput.click();
    });
    fileInput.addEventListener('change', function(){
      var f = fileInput.files && fileInput.files[0];
      if (!f) return;
      // .docx и прочее readAsText превратит в кашу — лучше сказать сразу.
      var okType = /^text\//.test(f.type || '') || /\.(txt|md|markdown)$/i.test(f.name || '');
      if (!okType) { hint.textContent = t('voice.fileWrongType'); return; }
      // Уже написанное не затираем без спроса — черновик тоже чей-то труд.
      if (ta.value.trim() && !window.confirm(t('voice.fileReplace'))) return;

      var reader = new FileReader();
      reader.onload = function(){
        var text = String(reader.result || '').replace(/\r\n/g, '\n').trim();
        if (!text) { hint.textContent = t('voice.fileEmpty'); return; }
        // Длиннее лимита не режем молча: покажем «слишком длинно» и дадим
        // решить самому, что убрать — обрезка потеряла бы чужие слова.
        ta.value = text;
        updateCounter();
        writeDraft(ta.value);
      };
      reader.onerror = function(){ hint.textContent = t('voice.fileError'); };
      reader.readAsText(f);
    });

    // ═══════════════════════════════════════════════
    // РЕЖИМ ВОДЫ (Apple Pencil) — тот же ta.value, только форма ввода
    // меняется под перо. Никакого сниффинга устройств: ждём фактический
    // pointerType==='pen'.
    //
    // ФИКС 18.08: прототип запоминал перо в localStorage навсегда («второй
    // раз кнопка доступна сразу»). На деле это значило, что кнопка сообщает
    // не «перо в руке», а «у этого устройства когда-то было перо»: на iPad
    // флаг вставал при первом же касании и потом висел всегда — при
    // разряженном, неспаренном или просто лежащем на столе Pencil. Человек
    // видит предложение писать по воде и не понимает, чем. Память убрана:
    // кнопка появляется, когда перо коснулось экрана в ЭТОТ заход, и
    // исчезать ей не нужно — раз коснулось, перо в руке.
    // ═══════════════════════════════════════════════
    var toWater = document.createElement('button');
    toWater.type = 'button';
    toWater.id = 'toWater';
    toWater.className = 'voice-btn';
    toWater.textContent = t('voice.waterToggle');
    form.insertBefore(toWater, ta);

    // Чистим флаг прежнего прототипа — иначе он молча живёт в браузерах,
    // где уже успел встать, и ничего не значит.
    try { localStorage.removeItem('uc_pen_seen'); } catch(e){}

    var penSeen = false;
    var lastPen = { x: 0, y: 0, t: -1e9 };
    function notePen(e){
      if (!e || e.pointerType !== 'pen') return;
      lastPen.x = e.clientX; lastPen.y = e.clientY; lastPen.t = performance.now();
      penIdleReset();
      if (penSeen) return;
      penSeen = true;
      toWater.classList.add('avail');
    }
    document.addEventListener('pointerdown', notePen, { passive: true });
    document.addEventListener('pointermove', notePen, { passive: true });

    // Перо убрали (легло на базу, разрядилось, просто отложили) — предлагать
    // писать по воде больше нечем. Отследить сам факт «легло на базу» нельзя:
    // в вебе такого события нет, видно только что события пера перестали
    // приходить. Поэтому гасим кнопку по простою, а любое касание пером
    // возвращает её мгновенно. В самой воде не гасим: там человек пером и
    // пишет, а вычислять простой во время письма — прятать нужное.
    var PEN_IDLE_MS = 60000;
    var penIdleTimer = null;
    function penIdleReset(){
      clearTimeout(penIdleTimer);
      penIdleTimer = setTimeout(function(){
        if (water.classList.contains('on')) { penIdleReset(); return; }
        penSeen = false;
        toWater.classList.remove('avail');
      }, PEN_IDLE_MS);
    }

    var water = document.getElementById('water');
    var waterCanvas = document.getElementById('waterCanvas');
    var wCtx = waterCanvas.getContext('2d');
    var wInput = document.getElementById('waterInput');
    var wCount = document.getElementById('wCount');
    document.getElementById('wCountMax').textContent = VOICE_MAX;
    wInput.placeholder = t('voice.placeholder');
    var W = 0, H = 0, DPR = 1;
    var ripples = [];
    var RIPPLE_MAX = 26;
    var running = false;
    var t0 = 0, idleTimer = null;

    function sizeCanvas(){
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = document.body.clientWidth; H = document.body.clientHeight;
      waterCanvas.width = Math.round(W * DPR); waterCanvas.height = Math.round(H * DPR);
      wCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
      wCtx.fillStyle = '#00040a'; wCtx.fillRect(0, 0, W, H);
    }
    var rzT = null;
    window.addEventListener('resize', function(){ clearTimeout(rzT); rzT = setTimeout(sizeCanvas, 250); });

    function addRipple(x, y, strength){
      if (ripples.length >= RIPPLE_MAX) ripples.shift();
      ripples.push({ x: x, y: y, r: 2, max: 60 + Math.random()*90,
        v: 0.55 + Math.random()*0.5, a: strength || 0.5, rings: 2 + (Math.random()*2|0) });
    }
    function inkPoint(){
      if (performance.now() - lastPen.t < 1600) return { x: lastPen.x, y: lastPen.y };
      return { x: W*(0.35+Math.random()*0.3), y: H*(0.42+Math.random()*0.16) };
    }
    function frame(ts){
      if (!running) return;
      if (!t0) t0 = ts;
      var tt = (ts - t0) / 1000;
      wCtx.fillStyle = 'rgba(0,4,10,0.13)';
      wCtx.fillRect(0, 0, W, H);
      wCtx.lineWidth = 1;
      for (var b = 0; b < 3; b++) {
        var yb = H*(0.3+b*0.2);
        wCtx.strokeStyle = 'rgba(70,140,210,0.05)';
        wCtx.beginPath();
        for (var x = 0; x <= W; x += 14) {
          var y = yb + Math.sin(x*0.006 + tt*0.35 + b*1.7)*(10+b*5);
          if (x === 0) wCtx.moveTo(x, y); else wCtx.lineTo(x, y);
        }
        wCtx.stroke();
      }
      for (var i = ripples.length - 1; i >= 0; i--) {
        var r = ripples[i];
        r.r += r.v; r.v *= 0.995;
        var p = r.r / r.max;
        if (p >= 1) { ripples.splice(i, 1); continue; }
        var a = r.a * (1-p) * (1-p);
        for (var k = 0; k < r.rings; k++) {
          var rr = r.r - k*9;
          if (rr <= 0) continue;
          wCtx.strokeStyle = 'rgba(140,205,255,' + (a*(1-k*0.32)).toFixed(3) + ')';
          wCtx.lineWidth = 1.3 - k*0.3;
          wCtx.beginPath(); wCtx.arc(r.x, r.y, rr, 0, 6.2832); wCtx.stroke();
        }
      }
      requestAnimationFrame(frame);
    }
    function idleLoop(){
      if (!running) return;
      addRipple(Math.random()*W, H*(0.2+Math.random()*0.6), 0.13);
      idleTimer = setTimeout(idleLoop, 2600 + Math.random()*3500);
    }

    function enterWater(){
      wInput.value = ta.value;
      wCount.textContent = wInput.value.length;
      water.classList.add('on');
      sizeCanvas();
      running = true; t0 = 0;
      requestAnimationFrame(frame);
      idleLoop();
      setTimeout(function(){ try { wInput.focus(); } catch(e){} }, 60);
    }
    function exitWater(){
      running = false;
      clearTimeout(idleTimer);
      ripples.length = 0;
      ta.value = wInput.value;
      water.classList.remove('on');
      try { wInput.blur(); } catch(e){}
      updateCounter();
      writeDraft(ta.value);
    }
    toWater.addEventListener('click', enterWater);
    document.getElementById('exitWater').addEventListener('click', exitWater);

    var prevLen = 0;
    wInput.addEventListener('input', function(){
      var len = wInput.value.length;
      var delta = len - prevLen;
      prevLen = len;
      wCount.textContent = len;
      ta.value = wInput.value; // единый источник правды для draft/counter/send
      var p = inkPoint();
      var s = Math.min(0.85, 0.28 + Math.abs(delta)*0.06);
      addRipple(p.x, p.y, s);
      if (Math.abs(delta) > 3) {
        setTimeout(function(){ addRipple(p.x+(Math.random()*40-20), p.y+(Math.random()*30-15), s*0.5); }, 90);
      }
    });

    // «Готово» — не отправка, а возвращение текста в окно (с всплеском).
    // На сервер уходит только из обычного поля: там видно счётчик, минимум
    // и подсказку, а в воде их нет. Раньше здесь звалось send(), и текст
    // короче минимума молча не уходил никуда — вода закрывалась, и человек
    // не узнавал почему.
    document.getElementById('wSend').addEventListener('click', function(){
      for (var i = 0; i < 7; i++) {
        setTimeout(function(){ addRipple(W/2+(Math.random()*160-80), H*0.5+(Math.random()*120-60), 0.7); }, i*70);
      }
      setTimeout(exitWater, 700);
    });
  }

  // ── Вход ────────────────────────────────────────────────────────────────
  if (!TOKEN_RE.test(myToken)) { renderGuest(); return; }

  // ВРЕМЕННО: ?preview=1 — визуальный обход порога, только на этом экране.
  // Ничего в базе не трогает: voice_write у воркера всё равно пересчитывает
  // eligibility сам (см. countUserNodes в unitycode-write.js), так что
  // реальная отправка текста при непройденном пороге будет отклонена
  // сервером как и раньше — обход показывает форму и воду, не открывает
  // запись. Убрать эту ветку, когда порог перестанет быть нужен для теста.
  if (location.search.indexOf('preview=1') !== -1) { renderForm(); return; }

  renderChecking();

  (async function(){
    try {
      var ts = await safeTurnstileToken();
      var res = await UCData.fetchRetry(WRITE_WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'voice_check', token: myToken, turnstile: ts, user_token: myToken }),
      });
      var data = await res.json();
      if (data && data.eligible) renderForm();
      else renderLocked((data && data.count) || 0, (data && data.threshold) || 50);
    } catch(e) {
      // Сеть не ответила — тихий откат к «пока рано», без пугающей ошибки.
      renderLocked(0, 50);
    }
  })();
})();
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onloadTurnstileCallback&render=explicit" async defer></script>
</body>
