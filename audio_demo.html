<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UnityCode — Аудио демо</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #080810;
    color: #c8c8e0;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: 40px 20px;
  }

  h1 {
    font-size: 13px;
    letter-spacing: 4px;
    color: #5555aa;
    text-transform: uppercase;
  }

  .section-title {
    font-size: 10px;
    letter-spacing: 3px;
    color: #444466;
    text-transform: uppercase;
    margin-bottom: 16px;
    text-align: center;
  }

  /* Кнопка mute — фиксированная */
  #mute-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(30,30,60,0.9);
    border: 1px solid #333366;
    color: #8888cc;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.3s, color 0.3s;
    z-index: 999;
  }
  #mute-btn:hover { border-color: #6666cc; color: #aaaaff; }
  #mute-btn.muted { color: #444466; border-color: #222244; }

  /* Статус ambient */
  #ambient-status {
    font-size: 10px;
    letter-spacing: 2px;
    color: #333355;
    text-align: center;
    transition: color 0.5s;
  }
  #ambient-status.active { color: #5555aa; }

  /* Визуализатор */
  #visualizer {
    width: 200px;
    height: 40px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 3px;
  }
  .bar {
    width: 4px;
    background: #333366;
    border-radius: 2px 2px 0 0;
    transition: height 0.1s;
    min-height: 2px;
  }

  /* Кнопки эффектов */
  .effects-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    max-width: 340px;
  }
  .fx-btn {
    padding: 16px 12px;
    background: rgba(20,20,40,0.8);
    border: 1px solid #222244;
    border-radius: 10px;
    color: #8888cc;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    line-height: 1.6;
  }
  .fx-btn:hover { border-color: #5555aa; color: #aaaaff; background: rgba(30,30,60,0.9); }
  .fx-btn:active { transform: scale(0.97); }
  .fx-btn .icon { font-size: 20px; display: block; margin-bottom: 6px; }

  /* Лог */
  #log {
    width: 100%;
    max-width: 340px;
    height: 80px;
    overflow-y: auto;
    font-size: 10px;
    letter-spacing: 1px;
    color: #333355;
    text-align: left;
    padding: 8px;
    border: 1px solid #1a1a33;
    border-radius: 6px;
  }
  #log div { margin-bottom: 3px; }
  #log div.new { color: #5555aa; }

  .start-hint {
    font-size: 11px;
    letter-spacing: 2px;
    color: #333355;
    text-align: center;
  }
</style>
</head>
<body>

<h1>UnityCode · Audio System</h1>

<div>
  <div class="section-title">Ambient</div>
  <div id="visualizer">
    <!-- bars генерируются JS -->
  </div>
  <div id="ambient-status" style="margin-top:10px;">ожидание первого касания...</div>
</div>

<div>
  <div class="section-title">Звуковые эффекты</div>
  <div class="effects-grid">
    <button class="fx-btn" onclick="UC_Audio.fx('submit')">
      <span class="icon">↑</span>отправить шум
    </button>
    <button class="fx-btn" onclick="UC_Audio.fx('node')">
      <span class="icon">◉</span>узел создан
    </button>
    <button class="fx-btn" onclick="UC_Audio.fx('connect')">
      <span class="icon">⟡</span>связь вплетена
    </button>
    <button class="fx-btn" onclick="UC_Audio.fx('page')">
      <span class="icon">→</span>переход
    </button>
    <button class="fx-btn" onclick="UC_Audio.fx('ping')">
      <span class="icon">·</span>пинг карты
    </button>
    <button class="fx-btn" onclick="UC_Audio.fx('error')">
      <span class="icon">✕</span>ошибка
    </button>
  </div>
</div>

<div id="log"><div style="color:#222244;">// лог событий</div></div>

<div class="start-hint">нажми любую кнопку — ambient запустится</div>

<button id="mute-btn" title="Звук">♪</button>

<script>
const UC_Audio = (() => {
  let ctx = null;
  let masterGain = null;
  let ambientNodes = [];
  let muted = false;
  let started = false;
  let vizBars = [];
  let vizInterval = null;

  // --- Инициализация ---
  function init() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = ctx.createGain();
    masterGain.gain.setValueAtTime(0.7, ctx.currentTime);
    masterGain.connect(ctx.destination);
    log('AudioContext инициализирован');
  }

  // --- Ambient ---
  function startAmbient() {
    if (started) return;
    started = true;
    init();

    // Слой 1: низкий дрон (основа)
    createDrone(55, 0.06, 0);       // A1
    createDrone(82.4, 0.04, 3.7);   // E2
    createDrone(110, 0.035, 7.1);   // A2

    // Слой 2: верхние паузы
    createPulse(440, 0.015, 5);
    createPulse(528, 0.012, 11);
    createPulse(396, 0.010, 17);

    // Слой 3: тихий шум пространства
    createSpaceNoise(0.025);

    document.getElementById('ambient-status').textContent = 'ambient · активен';
    document.getElementById('ambient-status').classList.add('active');
    startVisualizer();
    log('ambient запущен');
  }

  function createDrone(freq, vol, detune) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const lfo = ctx.createOscillator();
    const lfoGain = ctx.createGain();

    osc.type = 'sine';
    osc.frequency.value = freq;
    osc.detune.value = detune;

    // LFO для живого дыхания
    lfo.frequency.value = 0.05 + Math.random() * 0.08;
    lfoGain.gain.value = vol * 0.3;
    lfo.connect(lfoGain);
    lfoGain.connect(gain.gain);

    gain.gain.value = vol;
    osc.connect(gain);
    gain.connect(masterGain);

    osc.start();
    lfo.start();
    ambientNodes.push(osc, lfo);
  }

  function createPulse(freq, vol, interval) {
    const scheduleNext = () => {
      if (!started || muted) { setTimeout(scheduleNext, interval * 1000); return; }
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq + (Math.random() * 4 - 2);
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + 1.5);
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 4);
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start();
      osc.stop(ctx.currentTime + 5);
      setTimeout(scheduleNext, (interval + Math.random() * interval) * 1000);
    };
    setTimeout(scheduleNext, interval * 1000);
  }

  function createSpaceNoise(vol) {
    const bufSize = ctx.sampleRate * 2;
    const buffer = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.loop = true;

    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 300;

    const gain = ctx.createGain();
    gain.gain.value = vol;

    source.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);
    source.start();
    ambientNodes.push(source);
  }

  // --- Эффекты ---
  function fx(type) {
    if (!ctx) init();
    if (!started) startAmbient();
    if (muted) return;

    switch(type) {
      case 'submit':  fxSubmit(); log('↑ отправить шум'); break;
      case 'node':    fxNode();   log('◉ узел создан'); break;
      case 'connect': fxConnect();log('⟡ связь вплетена'); break;
      case 'page':    fxPage();   log('→ переход страницы'); break;
      case 'ping':    fxPing();   log('· пинг карты'); break;
      case 'error':   fxError();  log('✕ ошибка'); break;
    }
  }

  function fxSubmit() {
    // Мягкий восходящий тон — "шум уходит"
    [220, 330, 440].forEach((f, i) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      g.gain.setValueAtTime(0, ctx.currentTime + i * 0.08);
      g.gain.linearRampToValueAtTime(0.08, ctx.currentTime + i * 0.08 + 0.1);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 1.2);
      osc.connect(g); g.connect(masterGain);
      osc.start(ctx.currentTime + i * 0.08);
      osc.stop(ctx.currentTime + i * 0.08 + 1.3);
    });
  }

  function fxNode() {
    // Мягкий "пинг" с реверберацией
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(528, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(264, ctx.currentTime + 1.5);
    g.gain.setValueAtTime(0.12, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 2);
    osc.connect(g); g.connect(masterGain);
    osc.start(); osc.stop(ctx.currentTime + 2.1);
  }

  function fxConnect() {
    // Два тона сливаются
    [396, 528].forEach((f, i) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      g.gain.setValueAtTime(0, ctx.currentTime);
      g.gain.linearRampToValueAtTime(0.07, ctx.currentTime + 0.3 + i * 0.15);
      g.gain.linearRampToValueAtTime(0.07, ctx.currentTime + 1.2);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 2.5);
      osc.connect(g); g.connect(masterGain);
      osc.start(); osc.stop(ctx.currentTime + 2.6);
    });
  }

  function fxPage() {
    // Whoosh — фильтрованный шум
    const bufSize = ctx.sampleRate * 0.5;
    const buffer = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(200, ctx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(2000, ctx.currentTime + 0.4);
    filter.Q.value = 0.5;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    src.connect(filter); filter.connect(g); g.connect(masterGain);
    src.start(); src.stop(ctx.currentTime + 0.6);
  }

  function fxPing() {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = 880;
    g.gain.setValueAtTime(0.06, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
    osc.connect(g); g.connect(masterGain);
    osc.start(); osc.stop(ctx.currentTime + 0.9);
  }

  function fxError() {
    [200, 180].forEach((f, i) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = f;
      g.gain.setValueAtTime(0, ctx.currentTime + i * 0.12);
      g.gain.linearRampToValueAtTime(0.06, ctx.currentTime + i * 0.12 + 0.05);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.3);
      osc.connect(g); g.connect(masterGain);
      osc.start(ctx.currentTime + i * 0.12);
      osc.stop(ctx.currentTime + i * 0.12 + 0.4);
    });
  }

  // --- Mute ---
  function toggleMute() {
    if (!ctx) init();
    muted = !muted;
    masterGain.gain.linearRampToValueAtTime(muted ? 0 : 0.7, ctx.currentTime + 0.3);
    const btn = document.getElementById('mute-btn');
    btn.textContent = muted ? '♪' : '♪';
    btn.classList.toggle('muted', muted);
    btn.title = muted ? 'Включить звук' : 'Выключить звук';
    log(muted ? '— mute' : '+ unmute');
  }

  // --- Визуализатор ---
  function startVisualizer() {
    const container = document.getElementById('visualizer');
    container.innerHTML = '';
    for (let i = 0; i < 20; i++) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = '2px';
      container.appendChild(bar);
      vizBars.push(bar);
    }
    vizInterval = setInterval(() => {
      vizBars.forEach((bar, i) => {
        const h = muted ? 2 : 2 + Math.random() * (i % 3 === 0 ? 28 : 16);
        bar.style.height = h + 'px';
        bar.style.background = h > 20 ? '#5555aa' : '#333366';
      });
    }, 120);
  }

  // --- Лог ---
  function log(msg) {
    const el = document.getElementById('log');
    const div = document.createElement('div');
    div.className = 'new';
    div.textContent = '> ' + msg;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
    setTimeout(() => div.classList.remove('new'), 1000);
  }

  // Публичный API
  return { fx, toggleMute, startAmbient };
})();

// Mute кнопка
document.getElementById('mute-btn').addEventListener('click', UC_Audio.toggleMute);

// Первое касание для iOS
document.addEventListener('touchstart', () => UC_Audio.startAmbient(), { once: true });
</script>
</body>
</html>
