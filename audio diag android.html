<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Диагностика звука — Android</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background:#06060c; color:#a8a8c8; font-family:monospace;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:20px; gap:16px;
  }
  h1 { font-size:14px; color:#5555aa; text-align:center; }
  button {
    padding:20px; background:#1a1a40; border:2px solid #5555aa;
    border-radius:12px; color:#aaaaff; font-size:16px; width:100%; max-width:320px;
  }
  #log {
    width:100%; max-width:320px; background:#000; color:#0f8;
    font-size:11px; padding:10px; border-radius:8px; white-space:pre-wrap;
    line-height:1.5; min-height:300px; overflow-y:auto;
  }
</style>
</head>
<body>
<h1 style="font-size:16px; line-height:1.6;">Нажми кнопку,<br>подожди 5 секунд,<br>сделай скриншот экрана</h1>
<button id="btn" style="font-size:22px; padding:30px;">▶ НАЖАТЬ ЗДЕСЬ</button>
<div id="log">...</div>

<script>
const logEl = document.getElementById('log');
logEl.style.fontSize = '15px';
logEl.style.lineHeight = '2';
function log(msg){
  console.log(msg);
  logEl.textContent += msg + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}

log('Готов к проверке.');

let ctx = null;
let master = null;
let carrier = null;

document.getElementById('btn').addEventListener('click', function(){
  logEl.textContent = '';
  log('Проверяю...');

  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    log('✅ Звук включается');
  } catch(e) {
    log('❌ ОШИБКА 1: ' + e.message);
    return;
  }

  try {
    master = ctx.createGain();
    master.gain.value = 0.6;
    master.connect(ctx.destination);
  } catch(e) {
    log('❌ ОШИБКА 2: ' + e.message);
    return;
  }

  try {
    ctx.resume().then(() => {
      log('✅ Контекст активен: ' + ctx.state);
    }).catch(e => {
      log('❌ ОШИБКА 3: ' + e.message);
    });
  } catch(e) {
    log('❌ ОШИБКА 4: ' + e.message);
  }

  try {
    const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
    carrier = new Audio(SILENT_WAV);
    carrier.loop = true;
    carrier.volume = 0.0001;
    const p = carrier.play();
    if (p && p.then) {
      p.then(() => log('✅ Носитель звука работает')).catch(e => log('❌ ОШИБКА 5: ' + e.message));
    }
  } catch(e) {
    log('❌ ОШИБКА 6: ' + e.message);
  }

  try {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 440;
    g.gain.value = 0.3;
    osc.connect(g);
    g.connect(master);
    osc.start();
    osc.stop(ctx.currentTime + 3);
    log('🔊 СЕЙЧАС ДОЛЖЕН ИГРАТЬ ЗВУК 3 СЕКУНДЫ');
    log('Слышишь его?');
  } catch(e) {
    log('❌ ОШИБКА 7: ' + e.message);
  }

  setTimeout(() => {
    log('--- Готово ---');
  }, 3500);
});

window.addEventListener('error', function(e){
  log('❌ ОШИБКА СТРАНИЦЫ: ' + e.message);
});
</script>
</body>
</html>
