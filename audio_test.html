<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Test</title>
<style>
  body { background:#080810; color:#c8c8e0; font-family:monospace; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:20px; padding:20px; }
  button { padding:20px 40px; background:#1a1a40; border:1px solid #5555aa; color:#aaaaff; font-family:monospace; font-size:16px; border-radius:10px; cursor:pointer; }
  #log { font-size:12px; color:#5555aa; text-align:center; line-height:1.8; }
</style>
</head>
<body>
<div id="log">нажми кнопку</div>
<button id="btn">▶ ТЕСТ ЗВУКА</button>
<script>
document.getElementById('btn').addEventListener('click', async () => {
  const log = document.getElementById('log');
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    log.textContent = 'ctx создан: ' + ctx.state;

    await ctx.resume();
    log.textContent += '\nпосле resume: ' + ctx.state;

    // Простейший тон напрямую в destination
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = 440;
    osc.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 1);

    log.textContent += '\nосциллятор запущен — слышишь 440hz?';

    osc.onended = () => {
      log.textContent += '\nосциллятор завершён';
    };
  } catch(e) {
    log.textContent = 'ОШИБКА: ' + e.message;
  }
});
</script>
</body>
</html>
