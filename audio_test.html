<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Test</title>
<style>
  body { background:#080810; color:#c8c8e0; font-family:monospace; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:20px; padding:20px; }
  button { padding:20px 40px; background:#1a1a40; border:1px solid #5555aa; color:#aaaaff; font-family:monospace; font-size:16px; border-radius:10px; cursor:pointer; }
  #log { font-size:12px; color:#5555aa; text-align:center; line-height:1.8; white-space:pre; }
</style>
</head>
<body>
<div id="log">нажми кнопку</div>
<button id="btn">▶ ТЕСТ ЗВУКА</button>
<script>
document.getElementById('btn').addEventListener('click', function() {
  const log = document.getElementById('log');
  // Синхронно — без async/await
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  log.textContent = 'ctx: ' + ctx.state;

  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = 440;
  osc.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 2);
  log.textContent += '\nоsc запущен';

  // resume после старта
  ctx.resume().then(() => {
    log.textContent += '\nresume: ' + ctx.state;
  });

  osc.onended = () => { log.textContent += '\nготово'; };
});
</script>
</body>
</html>
