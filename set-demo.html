<!DOCTYPE html>
<!-- ════════════════════════════════════════════════════════════════════════
     UNITYCODE · СЕТЬ БЕЗ КООРДИНАТ — ДЕМО, НЕ БОЕВАЯ СТРАНИЦА

     Показывает предложение Артёма (17.09): Сеть рисуется как граф, а не
     как карта мира. Ни на что не ссылается и из меню не открывается.

     ЧИТАЕТ напрямую из Supabase публичным ключом, как set.html.
     ПИШЕТ только одно и только через unitycode-write: связь, которую
     человек проложил сам. Браузер в базу не пишет — правило не нарушено.

     Живёт отдельным файлом ровно для того, чтобы её можно было удалить
     одной командой, если решение не примут. set.html не тронут.
════════════════════════════════════════════════════════════════════════ -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>UNITYCODE — Сеть без координат (демо)</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Unbounded:wght@200;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="leaflet.min.css">
<style>
  html,body { height:100%; }
  body { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
         overflow:hidden; overscroll-behavior:none; background:#04100e; }
  body::before { display:none; }

  header { flex-shrink:0; position:fixed !important; top:0; left:0; right:0;
           z-index:1001 !important; background:rgba(0,0,0,0.98); }
  .status-bar { margin-top:57px; display:flex; gap:2rem; padding:0.6rem 2rem;
                border-bottom:1px solid var(--border); background:rgba(0,0,0,0.95);
                flex-shrink:0; position:relative; z-index:1000; align-items:center; }
  .stat { display:flex; align-items:center; gap:0.5rem; white-space:nowrap; }
  .stat-label { font-size:0.55rem; color:var(--dim); letter-spacing:0.15em; text-transform:uppercase; }
  .stat-val { font-size:0.7rem; color:var(--accent); }
  .demo-flag { margin-left:auto; font-size:0.5rem; letter-spacing:0.18em;
               color:#ffb43c; border:1px solid rgba(255,180,60,0.35);
               padding:0.2rem 0.5rem; text-transform:uppercase; white-space:nowrap; }

  #net { flex:1; position:relative; z-index:1; background:#05080b; touch-action:none; }

  /* ── КАРТА — ОБЩАЯ КАМЕРА ────────────────────────────────────────
     Карта не фон и не раскладка, а система координат для всех слоёв
     сразу. Тяга и приближение — её работа: она это умеет лучше любого
     моего кода, и главное — двигает ОДНОВРЕМЕННО мир, эхо и Сеть.
     Раньше камер было две (Сеть ездила сама, мир стоял), и это не
     сходилось ни при каком масштабе. */
  #mapbg { position:absolute; inset:0; z-index:0; background:#05080b; }
  #mapbg .leaflet-container { cursor:grab; }
  #mapbg .leaflet-container:active { cursor:grabbing; }
  #mapbg .leaflet-container { background:#05080b !important; }
  /* Страны приглушены до текстуры (17.09, по замечанию Вити): узел не
     должен читаться как «стоящий на США». Материки остаются формой, но
     не атласом — при этом эхо сохраняет настоящую географию относительно
     себя: европейская гроздь остаётся гроздью, африканская африканской. */
  /* hue-rotate убран: он крутил оттенок ПОСЛЕ обесцвечивания, то есть не
     делал ничего полезного, но оставался поводом думать, что карта
     зелёная. Серое остаётся серым. */
  #mapbg .leaflet-tile-pane { filter:brightness(0.17) saturate(0) contrast(0.75); }

  /* Вуаль поверх карты. Две работы сразу: гасит серый город, чтобы нити
     не тонули, и притемняет края, чтобы мир не резался рамкой.
     Плотность — переменная: её можно покрутить адресом ?veil=0..1, не
     дожидаясь новой выкладки (см. комментарий у VEIL в скрипте). */
  #veil { position:absolute; inset:0; z-index:1; pointer-events:none;
          --v:0.52;
          background:
            /* Зелёного подсвета в углу больше нет, а сама вуаль уведена
               из зелёного в нейтральный тёмный (Витя, 18.09: «много зелени
               в бэкграунде»). Зелень остаётся там, где она что-то значит,
               — в узлах и нитях. */
            radial-gradient(ellipse at 50% 46%, rgba(6,10,13,0) 30%, rgba(6,10,13,calc(var(--v) * 0.55)) 100%),
            linear-gradient(180deg,
              rgba(6,10,13,calc(var(--v) * 1.10)) 0%,
              rgba(6,10,13,var(--v)) 42%,
              rgba(6,10,13,calc(var(--v) * 1.25)) 100%); }

  /* Канвас — стекло поверх карты: рисует, но событий не берёт. Все
     жесты уходят карте под ним, тап ловится её же обработчиком. */
  #netCanvas { position:absolute; inset:0; z-index:2; pointer-events:none;
               width:100%; height:100%; display:block; }

  /* Легенда показывается при заходе и медленно гаснет (Витя, 17.09:
     «может она появляется после открытия или обновления страницы и потом
     гаснет медленно»). Прочитать раз — достаточно; висеть на экране
     постоянно ей незачем, полотно дальше говорит само. */
  .net-legend { position:absolute; left:1rem; bottom:1rem; z-index:5; pointer-events:none;
                font-size:0.55rem; letter-spacing:0.08em; line-height:2; color:var(--dim);
                opacity:1; transition:opacity 2.5s ease; }
  .net-legend.faded { opacity:0; }
  .net-legend span { display:block; }
  .net-legend span::before { content:'—'; margin-right:0.5em; font-weight:bold; }
  .lg-human { color:#4fd6ff; } .lg-human::before { color:#4fd6ff; }
  .lg-linker { color:var(--accent); } .lg-linker::before { color:var(--accent); }
  .lg-alone { color:#8fa89c; } .lg-alone::before { color:#8fa89c; }

  /* карточка узла — та же, что на карте сейчас */
  /* Скругление «до упора»: 999px браузер сам зажимает до половины
     высоты, а высота карточки задаётся длиной шума — значит короткая
     реплика станет капсулой, длинная скруглится мягче, и подбирать
     ничего не нужно. Когда внутри открыт список своих шумов, радиус
     умеряем: в капсуле строки списка упирались бы в дугу. */
  .popup { position:absolute; z-index:20; background:rgba(0,0,0,0.95);
           border:1px solid rgba(0,255,136,0.3); box-shadow:0 0 20px rgba(0,255,136,0.1);
           border-radius:999px; transition:border-radius 0.25s ease; }
  .popup.picking { border-radius:22px; }
  /* по бокам просторнее: у сильной дуги текст иначе цепляет край */
  .popup-content { padding:1.2rem 1.7rem; min-width:240px; max-width:300px; text-align:center; }
  /* Подпись над шумом — метка, а не заголовок: мельче и без «//»
     (Витя, 17.09). Главный в карточке шум, остальное ему уступает. */
  .popup-tag { font-size:0.45rem; color:rgba(0,255,136,0.75); letter-spacing:0.22em;
               margin-bottom:0.7rem; }
  .popup-text { font-size:0.75rem; line-height:1.6; color:rgba(255,255,255,0.7);
                margin-bottom:0.8rem; max-height:140px; overflow-y:auto; }
  .popup-time { font-size:0.55rem; color:#555; }
  /* Крестика нет (Витя, 17.09). Карточка закрывается тем же жестом, что
     возвращает общий вид, — тапом по пустому месту. Отдельная кнопка для
     того же действия была лишней, и она единственная нарушала симметрию
     скруглённой карточки. */
  /* кнопки в карточке — те же, что на карте */
  .popup-btns { display:flex; gap:0.5rem; margin-top:0.8rem; flex-wrap:wrap; justify-content:center; }
  .popup-btn { display:inline-block; padding:0.45rem 1.1rem; border:1px solid rgba(0,255,136,0.3);
               color:#00ff88; font-size:0.6rem; letter-spacing:0.1em; cursor:pointer;
               background:transparent; text-transform:uppercase; text-decoration:none;
               border-radius:999px;
               font-family:'Share Tech Mono',monospace; transition:background 0.2s, color 0.2s; }
  .popup-btn:hover { background:#00ff88; color:#000; }
  .popup-btn.connect { border-color:rgba(0,200,255,0.4); color:#00c8ff; }
  .popup-btn.connect:hover { background:#00c8ff; color:#000; }
  .popup-btn.muted { border-color:rgba(255,255,255,0.1); color:#555; cursor:default; }
  .popup-btn.muted:hover { background:transparent; color:#555; }
  /* Кнопка ключа — служебная: в карточке главный шум, а не она.
     Мельче, тише и без заливки при наведении (Витя, 17.09). */
  .popup-btn.tiny { font-size:0.48rem; padding:0.25rem 0.7rem; letter-spacing:0.08em;
                    border-color:rgba(0,255,136,0.18); color:rgba(0,255,136,0.5); }
  .popup-btn.tiny:hover { background:transparent; color:var(--accent);
                          border-color:rgba(0,255,136,0.45); }
  .connect-picker { margin-top:0.8rem; border-top:1px solid rgba(0,200,255,0.2);
                    padding-top:0.8rem; max-height:150px; overflow-y:auto; }
  .picker-head { font-size:0.55rem; color:#00c8ff; letter-spacing:0.15em; margin-bottom:0.5rem; }
  .pick-row { font-size:0.65rem; color:#00c8ff; padding:0.4rem 0.2rem; cursor:pointer;
              border-bottom:1px solid rgba(0,200,255,0.08); text-align:center; }
  .pick-row.done { color:#555; cursor:default; border-bottom:none; }

  /* окно ключа — тот же язык, что у карточек */
  .key-over { position:fixed; inset:0; z-index:3000; background:rgba(0,0,0,0.92);
              display:flex; align-items:center; justify-content:center; padding:1rem; }
  .key-box { width:100%; max-width:420px; border:1px solid rgba(0,255,136,0.3);
             background:#050a08; padding:1.8rem; }
  .key-tag { font-size:0.6rem; color:var(--accent); letter-spacing:0.2em; margin-bottom:1rem; }
  .key-desc { font-size:0.75rem; line-height:1.7; color:rgba(255,255,255,0.7); margin-bottom:1.3rem; }
  #key-input { width:100%; background:rgba(255,255,255,0.03);
               border:1px solid rgba(0,255,136,0.2); color:#fff;
               font-family:'Share Tech Mono',monospace; font-size:16px;
               padding:0.6rem 0.8rem; outline:none; margin-bottom:1rem; }
  #key-input:focus { border-color:rgba(0,255,136,0.5); }
  .key-btns { display:flex; gap:0.8rem; }
  .key-btns .popup-btn { flex:1; text-align:center; padding:0.6rem; }
  .key-note { font-size:0.6rem; color:var(--dim); margin-top:0.8rem; min-height:1em; }

  /* ── ПЛАВАЮЩИЕ КНОПКИ ───────────────────────────────────────────
     Обе в одной стопке, а не по отдельности. Раньше каждая считала свой
     отступ от низа, и выходило два зла сразу: зазор между ними был
     великоват, а при включении ленты они дёргались порознь и рывком —
     «сильно шевелятся» (Витя, 17.09). Теперь двигается контейнер, зазор
     между кнопками не меняется никогда, и ход у него тот же, что у самой
     ленты, так что они уезжают вместе с ней. */
  #fabs { position:fixed; z-index:1000;
          right:calc(env(safe-area-inset-right,0px) + 0.8rem);
          bottom:calc(env(safe-area-inset-bottom,0px) + 1.2rem);
          /* stretch, а не flex-end: кнопки берут ширину самой длинной из
             них и становятся одинаковыми. По правому краю они и так
             выровнены — контейнер прижат к нему. */
          display:flex; flex-direction:column; align-items:stretch; gap:0.45rem;
          transition:bottom 0.25s ease; }
  body.ticker #fabs { bottom:calc(env(safe-area-inset-bottom,0px) + 3.3rem); }

  /* Общая высота: значок ⌖ выше строчных букв и тянул «всю сеть» на два
     пикселя вверх — рядом это читалось как разнобой. */
  /* Скругление «как у окна выбора шумов» — то есть мягкое, а не капсулой
     (Витя, 17.09). У той карточки радиус 22px при высоте под 280, здесь
     высота 28, и те же 22 дали бы капсулу. Берём 8: на глаз та же мера
     мягкости, что там. */
  .fab { background:rgba(0,0,0,0.85); font-family:'Share Tech Mono',monospace; cursor:pointer;
         min-height:1.75rem; box-sizing:border-box; border-radius:8px; }
  /* Возврат — подписанная кнопка, а не значок в углу. Значок терялся
     ровно тогда, когда нужнее всего: после приближения экран почти пуст,
     и глазу не за что зацепиться (Витя, 17.09). Когда вид уже общий,
     кнопка гаснет до полутона — не мозолит глаза, но остаётся на месте. */
  #netReset { padding:0.4rem 0.7rem; display:flex; align-items:center;
              justify-content:center; gap:0.45rem;
              border:1px solid rgba(0,255,136,0.55); color:var(--accent);
              font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase;
              box-shadow:0 0 14px rgba(0,255,136,0.15);
              transition:opacity 0.3s, border-color 0.3s, box-shadow 0.3s; }
  #netReset span { font-size:0.85rem; line-height:1; }
  #netReset, #echoToggle { padding-top:0; padding-bottom:0; }
  #netReset:active { background:rgba(0,255,136,0.15); }
  #netReset.idle { opacity:0.45; border-color:rgba(0,255,136,0.25); box-shadow:none; }
  /* Единственная кнопка-переключатель: мир под Сетью либо молчит, либо
     говорит. Отдельного экрана карты больше нет — она и так фон, поэтому
     эху не нужно никуда уводить, оно ложится на свои же места прямо тут. */
  #echoToggle { padding:0.4rem 0.7rem; border:1px solid rgba(255,180,60,0.3);
                color:rgba(255,180,60,0.6);
                font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase;
                display:flex; align-items:center; justify-content:center; gap:0.45rem; }
  #echoToggle::before { content:''; width:7px; height:7px; background:rgba(255,180,60,0.25);
                        transform:rotate(45deg); transition:background 0.2s, box-shadow 0.2s; }
  #echoToggle[aria-pressed="true"] { color:#ffb43c; border-color:rgba(255,180,60,0.6); }
  #echoToggle[aria-pressed="true"]::before { background:#ffb43c; box-shadow:0 0 8px #ffb43c; }

  /* Лента безместных эхо: у трети новостей нет города, на карте их
     показать нечем, а терять не хочется. Живёт вместе со слоем эха. */
  #echoTicker { position:absolute; left:0; right:0; bottom:0; z-index:6; height:0;
                overflow:hidden; background:rgba(0,0,0,0.82);
                border-top:1px solid rgba(255,180,60,0.22); transition:height 0.25s ease; }
  #echoTicker.show { height:1.9rem; }
  #echoTickerTrack { display:flex; align-items:center; height:1.9rem; white-space:nowrap;
                     will-change:transform; animation:echoScroll linear infinite; }
  .echo-ticker-item { color:#ffb43c; font-size:0.62rem; letter-spacing:0.03em;
                      padding:0 1.4rem; flex-shrink:0; }
  .echo-ticker-item::before { content:'◆'; margin-right:1.4rem; opacity:0.5; font-size:0.5rem; }
  @keyframes echoScroll { from { transform:translateX(0); } to { transform:translateX(-50%); } }

  /* карточка эха — янтарная, чтобы не путалась с карточкой узла */
  .popup.echo { border-color:rgba(255,180,60,0.4); box-shadow:0 0 20px rgba(255,180,60,0.08); }
  .popup.echo .popup-tag { color:#ffb43c; }
  .popup.echo a { color:#ffb43c; text-decoration:none; border-bottom:1px solid rgba(255,180,60,0.3); }

  #hint { position:absolute; left:50%; transform:translateX(-50%); bottom:1.2rem; z-index:6;
          font-size:0.55rem; letter-spacing:0.14em; color:rgba(255,255,255,0.3);
          pointer-events:none; text-align:center; white-space:nowrap;
          transition:bottom 0.25s ease, opacity 0.25s ease; }
  /* лента занимает низ — подсказка и легенда уступают ей место */
  #net.with-ticker #hint { bottom:2.8rem; }
  /* Переход перечисляем ЦЕЛИКОМ: это правило идёт позже базового и
     переписывает свойство, а не дополняет его. Из-за одной забытой
     половины легенда гасла мгновенно вместо двух с половиной секунд. */
  .net-legend { transition:opacity 2.5s ease, bottom 0.25s ease; }
  #net.with-ticker .net-legend { bottom:2.6rem; }
  #loading { position:fixed; bottom:1.2rem; left:50%; transform:translateX(-50%); z-index:1000;
             font-family:'Share Tech Mono',monospace; font-size:0.6rem; letter-spacing:0.2em;
             color:var(--accent); background:rgba(0,0,0,0.85); padding:0.4rem 1rem;
             border:1px solid rgba(0,255,136,0.2); opacity:0; transition:opacity 0.3s;
             pointer-events:none; }
  #loading.visible { opacity:1; }

  @media (max-width:640px) {
    /* Три счётчика и флажок в 390px не влезают — строка разъезжалась на
       три ряда, а флажок уходил за край (поймано снимком 17.09). На узком
       экране флажок прячем, подписи ужимаем: строка снова в один ряд. */
    .status-bar { padding:0.5rem 0.8rem; gap:0.9rem; overflow:hidden; }
    .stat { gap:0.35rem; }
    .stat-label { font-size:0.48rem; letter-spacing:0.08em; }
    .stat-val { font-size:0.65rem; }
    .demo-flag { display:none; }
    .net-legend { left:0.7rem; bottom:1rem; top:auto; font-size:0.5rem; line-height:1.9; }
    /* Стопка кнопок внизу, под большим пальцем. Правил на отдельные
       кнопки здесь больше нет: они давно живут в одном контейнере, а
       старые строки просто не срабатывали — из-за них кнопки и оказались
       поверх карточки на айфоне (снимок Вити 17.09). */
    #fabs { bottom:calc(env(safe-area-inset-bottom,0px) + 1rem); }
    body.ticker #fabs { bottom:calc(env(safe-area-inset-bottom,0px) + 3.1rem); }
    /* Подсказка наверх: внизу её место занимает легенда, и два текста
       ложились друг на друга (снимок 17.09). */
    #hint { bottom:auto; top:0.6rem; font-size:0.5rem; white-space:normal;
            padding:0 1rem; line-height:1.7; max-width:92vw; }
    #net.with-ticker #hint { bottom:auto; }
    /* Шторки снизу больше нет (Витя, 17.09: «окно с шумом не на точке
       появляется, а внизу и слипается с кнопками»). Карточка везде
       появляется У ТОЧКИ — так же, как на мониторе. На узком экране ей
       только даём поместиться: минимальную ширину снимаем, предельную
       считаем от экрана. */
    .popup-content { min-width:0; max-width:min(300px, calc(100vw - 2rem)); }
  }
</style>
</head>

<div class="status-bar">
  <div class="stat"><span class="stat-label">Узлов в сети:</span><span class="stat-val" id="statNodes">—</span></div>
  <div class="stat"><span class="stat-label">Нитей:</span><span class="stat-val" id="statLinks">—</span></div>
  <div class="stat"><span class="stat-label">Не сплелись:</span><span class="stat-val" id="statAlone">—</span></div>
  <div class="demo-flag">демо · Сеть без координат</div>
</div>

<div id="net">
  <div id="mapbg"></div>
  <div id="veil"></div>

async function fetchRetry(url, tries){
  const headers = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY };
  let wait = 600;
  for (let i = 0; i < (tries || 3); i++){
    try {
      const r = await fetch(url, { headers });
      if (r.ok) return await r.json();
    } catch (e) { /* молчим, пробуем ещё */ }
    await new Promise(res => setTimeout(res, wait));
    wait *= 2;
  }
  return null;
}

function build(nodes, links){
  byId = {}; NODES = nodes; E = [];
  NODES.forEach(n => { byId[n.id] = n; n.deg = 0; });
  // человек и Связующий могли проложить одну и ту же нить — рисуем одну,
  // человеческая сильнее: она говорит, что связь выбрал живой.
  const seen = {};
  for (const l of links){
    if (!byId[l.a] || !byId[l.b] || l.a === l.b) continue;
    const k = [l.a, l.b].sort().join('|');
    if (seen[k]){ if (l.by === 'human') seen[k].by = 'human'; continue; }
    const e = { a:l.a, b:l.b, by:l.by };
    seen[k] = e; E.push(e);
    byId[l.a].deg++; byId[l.b].deg++;
  }
  document.getElementById('statNodes').textContent = NODES.length;
  document.getElementById('statLinks').textContent = E.length;
  document.getElementById('statAlone').textContent = NODES.filter(n => n.deg === 0).length;
}

// кэшировать её проекцию бессмысленно. Девяносто точек на кадр — ничто.
// Сгустки эха. На дальнем плане десяток новостей из одной страны
// ложится в одну кашу — раньше это разбирал кластеризатор карты, тапом
// по кружку с числом. Здесь то же самое: считаем по экранным расстояниям
// на текущем масштабе, поэтому сгустки распадаются сами, когда
// приближаешь, и собираются обратно, когда отдаляешь.
let CLUSTERS = [];
const CLUSTER_PX = 26;

function clusterEchoes(){
  CLUSTERS = [];
  const cell = CLUSTER_PX, grid = new Map();
  for (const e of ECHO){
    if (e.ex == null) continue;
    const key = Math.round(e.ex/cell) + ':' + Math.round(e.ey/cell);
    if (!grid.has(key)) grid.set(key, []);
    grid.get(key).push(e);
  }
  for (const list of grid.values()){
    let sx = 0, sy = 0;
    for (const e of list){ sx += e.ex; sy += e.ey; }
    CLUSTERS.push({ x: sx/list.length, y: sy/list.length, items: list });
  }
}

// ── раскладка ─────────────────────────────────────────────────────
// Связная часть считается силами: узлы отталкиваются, нити стягивают.
// Одинокие в расчёт не входят — им не за что держаться, их вынесло бы
// на края и остальной граф ужался бы в угол. У них своя полка внизу.
function layout(){
  CORE  = NODES.filter(n => n.deg > 0);
  ALONE = NODES.filter(n => n.deg === 0);
  if (!CORE.length) return;

  _seed = 1337;  // раскладка одна и та же при каждом заходе
  const R = Math.min(W, H) * 0.32;
  CORE.forEach(n => {
    const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * R;
    n.x = W/2 + Math.cos(a)*r; n.y = H/2 + Math.sin(a)*r; n.vx = 0; n.vy = 0;
  });

  const K = Math.sqrt(W*H / CORE.length) * 0.46;
  const IT = 800;
  for (let it = 0; it < IT; it++){
    const cool = 1 - it/IT;
    for (let i = 0; i < CORE.length; i++){
      const p = CORE[i];
      for (let j = i+1; j < CORE.length; j++){
        const q = CORE[j];
        let dx = p.x-q.x, dy = p.y-q.y;
        let d2 = dx*dx + dy*dy;
        if (d2 < 1){ d2 = 1; dx = rnd()-0.5; dy = rnd()-0.5; }
        const f = (K*K)/d2, d = Math.sqrt(d2);
        p.vx += dx/d*f; p.vy += dy/d*f; q.vx -= dx/d*f; q.vy -= dy/d*f;
      }
    }
    for (const e of E){
      const p = byId[e.a], q = byId[e.b];
      if (!p || !q || p.deg === 0 || q.deg === 0) continue;
      const dx = p.x-q.x, dy = p.y-q.y;
      const d = Math.max(1, Math.hypot(dx, dy));
      const f = (d*d)/K * 0.5;
      p.vx -= dx/d*f; p.vy -= dy/d*f; q.vx += dx/d*f; q.vy += dy/d*f;
    }
    for (const p of CORE){
      p.vx += (W/2 - p.x) * 0.02; p.vy += (H/2 - p.y) * 0.02;
      const sp = Math.hypot(p.vx, p.vy), lim = K * 0.3 * cool;
      const s = sp > lim ? lim/sp : 1;
      p.x += p.vx*s; p.y += p.vy*s; p.vx *= 0.82; p.vy *= 0.82;
    }
  }

  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  CORE.forEach(n => { x0=Math.min(x0,n.x); y0=Math.min(y0,n.y); x1=Math.max(x1,n.x); y1=Math.max(y1,n.y); });
  const narrow = W < 640;
  const bx = W*0.16, bw = W - 2*bx;          // поле шире: кольцу одиноких нужно место
  const by = H*0.16, bh = H*0.58;
  const sc = Math.min(bw/Math.max(1,x1-x0), bh/Math.max(1,y1-y0));
  const ox = bx + (bw - (x1-x0)*sc)/2, oy = by + (bh - (y1-y0)*sc)/2;
  CORE.forEach(n => { n.x = ox + (n.x-x0)*sc; n.y = oy + (n.y-y0)*sc; });
  let x0c=1e9,y0c=1e9,x1c=-1e9,y1c=-1e9;
  CORE.forEach(n => { x0c=Math.min(x0c,n.x); y0c=Math.min(y0c,n.y); x1c=Math.max(x1c,n.x); y1c=Math.max(y1c,n.y); });

  // Одинокие — кольцом вокруг связной части, а не полкой внизу. Полка
  // была привязана к экрану, а теперь всё живёт в пространстве карты и
  // едет вместе с ней; экранной полке там места нет. Кольцо держится на
  // хеше id, то есть у каждого узла своё постоянное место.
  const rcx = (x0c + x1c)/2, rcy = (y0c + y1c)/2;
  const rad = Math.max(x1c - x0c, y1c - y0c) * 0.78 + Math.min(W,H) * 0.06;
  // Кольцо прижимаем к кадру: без этого пара одиноких узлов уезжала за
  // край и на обзорном виде их было не видно совсем — 28 из 31 в кадре
  // вместо всех (замер 17.09). Они и так на отшибе, но отшиб должен быть
  // виден, иначе счётчик «не сплелись: 6» не с чем сверить.
  const mx = W*0.05, my = H*0.07;
  ALONE.forEach(n => {
    const h = ucHash(n.id);
    const a = (h % 6283) / 1000;
    const rr = rad * (0.92 + ((h >>> 12) % 200) / 1000);
    n.x = Math.min(W - mx, Math.max(mx, rcx + Math.cos(a) * rr));
    n.y = Math.min(H - my, Math.max(my, rcy + Math.sin(a) * rr * 0.72));
  });

  pinToMap();
}

// Раскладка считается в пикселях экрана — так проще и так она и была.
// Дальше каждый узел получает точку в пространстве КАРТЫ и живёт уже в
// ней: карту двигают — узлы едут вместе с миром и эхом, сами собой.
// Это не «узел находится в Африке»: место в раскладке, не место человека.
function pinToMap(){
  if (!mapbg) return;
  for (const n of NODES){
    try { n.ll = mapbg.containerPointToLatLng([n.x, n.y]); } catch (e) { n.ll = null; }
  }
}

// ── кадр ──────────────────────────────────────────────────────────
// Язык Паттерна: глубокое полотно, свечение, дыхание нитей, лёгкое
// покачивание узлов «на воде» — фаза у каждого своя, но от хеша id,
// то есть одна и та же при каждом заходе.
// Экранное место узла: спрашиваем у карты, потом добавляем покачивание.
// Покачивание — в пикселях экрана и не зависит от масштаба: это дыхание
// живого, а не размер объекта.
function screenOf(n, t){
  let x = n.x, y = n.y;
  if (mapbg && n.ll){
    try { const p = mapbg.latLngToContainerPoint(n.ll); x = p.x; y = p.y; } catch (e) {}
  }
  const h = ucHash(n.id);
  const A = 2.2;
  return { x: x + A*Math.sin(t*0.55 + (h % 628)/100),
           y: y + A*Math.cos(t*0.47 + ((h >> 8) % 628)/100) };
}
function screenOfEcho(e){
  if (!mapbg) return null;
  try { const p = mapbg.latLngToContainerPoint([e.lat, e.lon]); return { x:p.x, y:p.y }; }
  catch (err) { return null; }
}

let POS = {};

function draw(t){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // Полотно прозрачное: фон рисует карта под канвасом, глубину даёт вуаль.
  // Своего градиента здесь больше нет — он спорил бы с картой за задний план.
  ctx.clearRect(0,0,W,H);

  // Камера одна на всех, поэтому порядок слоёв — только про глубину:
  // мир внизу, Сеть поверх. Приближение двигает их вместе, и это
  // единственное, что здесь важно.
  if (echoOn){
    projectEchoes();
    clusterEchoes();
    for (const c of CLUSTERS){
      const many = c.items.length > 1;
      const puls = 0.85 + 0.15*Math.sin(t*1.1 + (c.x + c.y)*0.05);
      const r = (many ? 6.4 : 4.2) * puls;

      const g = ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,r*4);
      g.addColorStop(0,'rgba(255,180,60,' + (many ? 0.42 : 0.35) + ')');
      g.addColorStop(1,'rgba(255,180,60,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(c.x,c.y,r*4,0,Math.PI*2); ctx.fill();

      const lit = !many && openEcho === c.items[0].id;
      ctx.save();
      ctx.translate(c.x, c.y); ctx.rotate(Math.PI/4);
      ctx.fillStyle = lit ? '#fff2d8' : 'rgba(255,180,60,0.92)';
      ctx.fillRect(-r/1.4, -r/1.4, r*1.42, r*1.42);
      ctx.restore();

      if (many){
        ctx.fillStyle = 'rgba(10,8,2,0.92)';
        ctx.font = '600 9px \'Share Tech Mono\', monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(c.items.length), c.x, c.y + 0.5);
        ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      }
    }
  }

  POS = {};
  for (const n of NODES) POS[n.id] = screenOf(n, t);

  const breathe = 0.72 + 0.28*Math.sin(t*0.8);

  ctx.lineCap = 'round';
  for (const e of E){
    const p = POS[e.a], q = POS[e.b];
    if (!p || !q) continue;
    const human = e.by === 'human';
    // над картой нити держим чуть плотнее, чем на пустом фоне: иначе
    // тонкая зелёная линия тонет в сером городе под ней
    ctx.strokeStyle = human ? 'rgba(79,214,255,'+(0.14*breathe).toFixed(3)+')'
                            : 'rgba(0,255,136,'+(0.11*breathe).toFixed(3)+')';
    ctx.lineWidth = human ? 5 : 3.5;
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();

    ctx.strokeStyle = human ? 'rgba(120,225,255,'+(0.50+0.18*breathe).toFixed(3)+')'
                            : 'rgba(0,255,136,'+(0.30+0.14*breathe).toFixed(3)+')';
    ctx.lineWidth = human ? 1.2 : 0.8;
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();
  }
  ctx.lineCap = 'butt';

  for (const n of NODES){
    const p = POS[n.id];
    const alone = n.deg === 0;
    // Свет убавлен (Витя, 18.09: «кажется как засветка»). Три места
    // складывались и давали пересвет, особенно на хабе: сам узел больше,
    // гало пропорционально больше, и поверх ещё белое ядро.
    //   • рост радиуса с числом нитей приторможен: 0.52 → 0.34 на нить,
    //     потолок 4.6 → 2.8. Хаб остаётся крупнее всех, но не вдвое;
    //   • гало скромнее по силе (0.42 → 0.28) и уже по охвату (5.2r → 4.4r);
    //   • белое ядро у самых сплетённых больше не белое и не мигает так
    //     заметно — оно и создавало ощущение прожектора.
    const base = alone ? 2.4 : 3.2 + Math.min(2.8, n.deg*0.34);
    const puls = 0.9 + 0.1*Math.sin(t*1.5 + (ucHash(n.id) % 628)/100);
    const r = base*puls;
    const col = alone ? '150,170,160' : '0,255,136';

    const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*4.4);
    g.addColorStop(0,   'rgba('+col+','+(alone?0.15:0.28)+')');
    g.addColorStop(0.35,'rgba('+col+','+(alone?0.06:0.11)+')');
    g.addColorStop(1,   'rgba('+col+',0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x,p.y,r*4.4,0,Math.PI*2); ctx.fill();

    ctx.fillStyle = alone ? 'rgba(165,185,175,0.8)' : 'rgba(0,255,136,0.88)';
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fill();

    if (n.deg >= 5){
      ctx.fillStyle = 'rgba(200,255,225,'+(0.3+0.1*breathe).toFixed(3)+')';
      ctx.beginPath(); ctx.arc(p.x,p.y,r*0.4,0,Math.PI*2); ctx.fill();
    }
    if (n.id === openId){
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(p.x,p.y,r*2.6,0,Math.PI*2); ctx.stroke();
    }
  }
}

// ── карта как фон ─────────────────────────────────────────────────
// Событий не принимает вообще: ни тяги, ни колеса, ни клавиш. Граф
// сверху двигается сам по себе — если бы карта ездила вместе с ним,
// пришлось бы отвечать на вопрос «где на карте этот узел», а ответа
// нет: в том и смысл, что Сеть больше не привязана к месту.
// Плотность вуали. Значение по умолчанию подобрано на стенде с заглушкой
// тайлов — настоящую карту я отсюда не вижу, её тайлы до песочницы не
// доезжают. Поэтому ручка в адресе: ?veil=0 — карта во всю силу,
// ?veil=1 — почти чёрный фон. Подберёте на живом экране — скажете число,
// я впишу его в файл и ручку уберу.
(function(){
  try {
    const v = parseFloat(new URLSearchParams(location.search).get('veil'));
    if (Number.isFinite(v) && v >= 0 && v <= 1)
      document.getElementById('veil').style.setProperty('--v', v);
  } catch (e) {}
})();

let mapbg = null;
function initMapBg(){
  if (mapbg || typeof L === 'undefined') return;
  try {
    mapbg = L.map('mapbg', {
      zoomControl:false, attributionControl:false,
      // Дробный масштаб и нижний предел 0: на узком экране мир целиком не
      // влезал даже на минимуме — 512 пикселей карты против 390 экрана,
      // и два эха оставались за краем. zoomSnap:0 разрешает встать ровно
      // так, как нужно, а не ступенями по двойке.
      minZoom:0, maxZoom:9, zoomSnap:0, zoomDelta:0.6,
      // Двойное касание карты выключено (17.09): приближение у нас своё,
      // по тапу в объект. А так два тапа подряд рядом друг с другом —
      // обычное дело для пальца — карта считала двойным касанием и
      // прыгала масштабом вместо того, чтобы показать шум.
      doubleClickZoom:false,
      // Держим только по широте: за полюсами ничего нет, а по долготе
      // мир замкнут и должен заполнять кадр целиком. Жёсткие границы по
      // долготе давали чёрные поля слева и справа, когда мир уже кончился,
      // а экран ещё нет (видно на снимке Вити 17.09).
      maxBounds: L.latLngBounds([[-85, -Infinity],[85, Infinity]]),
      maxBoundsViscosity: 0.6,
      worldCopyJump: true
    });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                { maxZoom:9 }).addTo(mapbg);
    // Карта — камера, поэтому она же и рассказывает, куда всё уехало.
    mapbg.on('move zoom', repositionPopup);
    mapbg.on('moveend zoomend', syncHome);
    bindTap(mapbg.getContainer());
    fitWorld();
  } catch (e) { mapbg = null; }   // карта не поднялась — Сеть рисуется на пустом фоне
}
// Кнопка возврата горит ровно тогда, когда возвращаться есть куда.
let HOME = null;
function syncHome(){
  const b = document.getElementById('netReset');
  if (!b || !mapbg) return;
  let дома = true;
  try {
    // Масштаб теперь дробный, и сравнивать его на точное равенство нельзя:
    // после перелёта он отличается в последних знаках (0.6079716540761936
    // против ...34), и кнопка не гасла, хотя мы дома. Сравниваем с допуском.
    // Сравниваем в ПИКСЕЛЯХ, а не в километрах: масштаб теперь дробный и
    // на телефоне бывает меньше единицы, где полста километров — доли
    // пикселя, и карта не совпадала с домом никогда. И сам масштаб
    // сверяем с допуском: после перелёта он отличается в последних знаках.
    const z = mapbg.getZoom();
    дома = HOME !== null && Math.abs(z - HOME.z) < 0.01 &&
           mapbg.project(mapbg.getCenter(), z).distanceTo(mapbg.project(HOME.c, z)) < 24;
  } catch (e) {}
  b.classList.toggle('idle', дома);
}

// Возврат к общему рисунку. С плавностью, когда его попросил человек
// (тап по пустому месту или кнопка), и без — когда это просто пересчёт
// после смены размера окна: там анимировать нечего.
function fitWorld(плавно){
  if (!mapbg) return;
  try {
    mapbg.invalidateSize(false);
    // Обитаемая часть мира, без полярных пустошей: они заняли бы треть
    // кадра и ничего не сообщают. Границы одни и те же на любом экране,
    // масштаб под них подбирает сам Leaflet.
    // ВМЕЩАЕМ, а не закрываем кадр. Закрывать пробовали — тогда на
    // высоком экране мир обрезается по бокам, и это не мелочь: замер
    // 17.09 показал, что в книжной ориентации видно 69° долготы из 360,
    // то есть 32 эха из 59 оказывались за кадром, а на планшете
    // вертикально — 45 из 59. «Нажатие Эхо мира не размещает всё эхо»
    // (Витя) — ровно это.
    //
    // Полосы по краям, из-за которых я когда-то и перешёл на «закрыть»,
    // с тех пор перестали быть заметны: карта приглушена до текстуры, и
    // пустое поле от неё почти не отличается.
    // Границы считаем по СОДЕРЖИМОМУ, а не по красивой рамке мира: тогда
    // «вся Сеть» и «всё эхо» — не пожелание, а свойство. Обитаемая рамка
    // остаётся отправной точкой, чтобы на пустой Сети кадр не схлопнулся.
    const B = L.latLngBounds([[-54,-168],[72,178]]);
    for (const n of NODES) if (n.ll) B.extend(n.ll);
    if (echoOn) for (const e of ECHO)
      if (Number.isFinite(e.lat) && Number.isFinite(e.lon)) B.extend([e.lat, e.lon]);
    const z = mapbg.getBoundsZoom(B.pad(0.02), false);
    // Домашнее положение запоминаем по ЦЕЛИ, а не по текущему состоянию
    // карты: при плавном возврате в этот момент перелёт ещё не начался, и
    // в HOME попадали старые масштаб и центр — кнопка потом не гасла,
    // хотя мы уже дома (поймано тестом 17.09).
    HOME = { z: z, c: B.getCenter() };
    if (плавно) mapbg.flyTo(B.getCenter(), z, { duration: 0.8 });
    else        mapbg.setView(B.getCenter(), z, { animate:false });
    syncHome();
  } catch (e) {}
}

// ── размеры ───────────────────────────────────────────────────────
function resize(){
  const box = document.getElementById('net').getBoundingClientRect();
  W = box.width; H = box.height;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  closePopup();
  fitWorld();      // сначала камера встаёт на мир…
  layout();        // …и только потом раскладка прикалывается к нему
  projectEchoes();
}
function resetView(){ closePopup(); fitWorld(true); }

// ── карточка узла ─────────────────────────────────────────────────
let openId = null, openEcho = null;
function closePopup(){
  openId = null; openEcho = null;
  const p = document.querySelector('.popup');
  if (p) p.remove();
}
function openPopup(n){
  closePopup();
  openId = n.id;
  const net = document.getElementById('net');
  const pop = document.createElement('div');
  pop.className = 'popup';
  pop.innerHTML =
    '<div class="popup-content">' +
      '<div class="popup-tag">' + (MY.ids.has(n.id) ? 'ТВОЙ УЗЕЛ' : 'УЗЕЛ СЕТИ') + '</div>' +
      '<div class="popup-text"></div>' +
      // Ни числа нитей, ни даты (Витя, 17.09): в карточке узла важен сам
      // шум, остальное — служебные подробности, которые её утяжеляют.
      // Сколько у узла нитей, и так видно по размеру точки и по нитям,
      // которые от неё идут.
      '<div class="popup-btns"></div>' +
      '<div class="connect-picker" style="display:none"></div>' +
    '</div>';
  pop.querySelector('.popup-text').textContent = n.noise || '—';
  fillConnectBtn(pop, n);
  net.appendChild(pop);

  placeCard(pop, toScreen(n));
}

// Карточка всегда у своей точки — и на мониторе, и на телефоне. Ставим
// над ней, не хватило места сверху — под ней, и в обоих случаях не даём
// заехать ни за край экрана, ни под стопку кнопок: на айфоне карточка
// ложилась ровно под них и текст было не прочитать (снимок Вити 17.09).
function placeCard(pop, точка){
  if (!pop || !точка) return;
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  const поле = 8;
  let низ = H - поле;
  const fabs = document.getElementById('fabs');
  if (fabs){
    const f = fabs.getBoundingClientRect();
    const сетка = document.getElementById('net').getBoundingClientRect();
    // кнопки прикреплены к окну, карточка — к полотну: приводим к одному
    const верх_кнопок = f.top - сетка.top;
    if (верх_кнопок > 0) низ = Math.min(низ, верх_кнопок - 10);
  }
  let px = точка.x - pw/2;
  let py = точка.y - ph - 18;
  px = Math.max(поле, Math.min(W - pw - поле, px));
  if (py < поле) py = точка.y + 20;                 // сверху не влезло — снизу
  py = Math.max(поле, Math.min(низ - ph, py));      // и никогда под кнопками
  pop.style.left = px + 'px'; pop.style.top = py + 'px';
}
// Все слои теперь в одних координатах — тех, что даёт карта. Поэтому и
// попадание считается одинаково для узла и для ромба, без пересчётов.
// ── КЛЮЧ УЗЛА ─────────────────────────────────────────────────────
// Токен — SHA-256 ключевой фразы, слово в слово как в Спирали и на
// боевой Сети. Меняться ему нельзя: та же фраза обязана давать тот же
// токен, иначе человек перестанет быть собой.
async function phraseToToken(phrase){
  try {
    const enc = new TextEncoder().encode(phrase.trim().toLowerCase());
    const hash = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
  } catch (e) {
    let h = 0;
    for (const c of phrase.trim().toLowerCase()) h = (Math.imul(31, h) + c.charCodeAt(0)) | 0;
    return Math.abs(h).toString(16).padStart(8,'0') + phrase.length.toString(16) +
           Date.now().toString(16).slice(-8);
  }
}

function askKey(nодin){
  const over = document.createElement('div');
  over.className = 'key-over';
  over.innerHTML =
    '<div class="key-box">' +
      '<div class="key-tag">КЛЮЧ УЗЛА</div>' +
      '<p class="key-desc">Введи ключевую фразу, и Сеть узнает твои узлы. ' +
         'Та же фраза, что в Спирали — она нигде не хранится, из неё считается отпечаток.</p>' +
      '<input id="key-input" type="text" placeholder="твоя фраза…" autocomplete="off">' +
      '<div class="key-btns">' +
        '<button class="popup-btn" id="key-ok">войти</button>' +
        '<button class="popup-btn muted" id="key-no">отмена</button>' +
      '</div>' +
      '<div class="key-note" id="key-note"></div>' +
    '</div>';
  document.body.appendChild(over);
  const input = over.querySelector('#key-input');
  const note  = over.querySelector('#key-note');
  setTimeout(() => { try { input.focus(); } catch (e) {} }, 50);

  const close = () => { try { document.body.removeChild(over); } catch (e) {} };
  over.onclick = ev => { if (ev.target === over) close(); };
  over.querySelector('#key-no').onclick = close;

  async function войти(){
    const phrase = input.value.trim();
    if (!phrase) { close(); return; }        // пустое поле — тот же отказ
    note.textContent = 'узнаю…';
    const token = await phraseToToken(phrase);
    try { localStorage.setItem('uc_token', token); } catch (e) {}
    MY.token = token;
    await preloadMine();                     // свои узлы приезжают сразу
    close();
    // Карточка перерисовывается на месте: тот же узел, но теперь про него
    // известно, твой он или чужой, и чем его можно связать.
    if (nодin) { closePopup(); openPopup(nодin); }
  }
  over.querySelector('#key-ok').onclick = войти;
  input.onkeydown = ev => { if (ev.key === 'Enter') войти(); };
}

// ── СВЯЗЫВАНИЕ ────────────────────────────────────────────────────
// Перенесено с боевой Сети как есть: открываешь чужой узел, выбираешь,
// каким СВОИМ шумом с ним связаться. Ничего не упрощаю на этом заходе —
// сначала смотрим, как оно живёт на графе, потом будем убирать лишнее.
function fillConnectBtn(pop, n){
  const box = pop.querySelector('.popup-btns');
  if (!box) return;
  const b = document.createElement('button');
  b.className = 'popup-btn connect';

  if (!MY.token){
    // Кнопка теперь не табличка, а дверь: спрашивает ключевую фразу,
    // считает из неё тот же токен, что и везде, и перерисовывает карточку
    // на месте — без перезагрузки страницы (Витя, 17.09: «должна работать
    // и после ввода слова видимо обновлять данные»).
    b.className = 'popup-btn tiny';
    b.textContent = 'ввести ключ узла';
    b.onclick = () => askKey(n);
    box.appendChild(b);
    return;
  }
  if (MY.ids.has(n.id)){
    // Своему узлу кнопка не нужна: связать его с собой нельзя, а надпись
    // «твой узел» внизу повторяла бы заголовок карточки. Снимаем и саму
    // полосу кнопок, иначе она оставит пустой отступ (Витя, 17.09).
    box.remove();
    return;
  }
  if (!MY.nodes.length){
    b.textContent = 'сначала вплети шум';
    b.onclick = () => { window.location.href = 'petlya.html'; };
    box.appendChild(b);
    return;
  }
  b.textContent = 'предложить связь';
  b.onclick = () => togglePicker(pop, n, b);
  box.appendChild(b);
}

function togglePicker(pop, target, btn){
  const picker = pop.querySelector('.connect-picker');
  if (!picker) return;
  if (picker.style.display === 'block'){
    picker.style.display = 'none';
    pop.classList.remove('picking');
    btn.textContent = 'предложить связь';
    return;
  }
  btn.textContent = 'выбери свой шум';
  pop.classList.add('picking');
  picker.innerHTML = '<div class="picker-head">КАКИМ СВОИМ ШУМОМ СВЯЗАТЬ</div>' +
    MY.nodes.map(m => {
      const было = MY.pairs.has(m.id + '|' + target.id);
      const кратко = esc((m.raw_noise || '').slice(0, 40) +
                         ((m.raw_noise || '').length > 40 ? '…' : ''));
      return было
        ? '<div class="pick-row done">✓ ' + кратко + '</div>'
        : '<div class="pick-row" data-from="' + m.id + '">→ ' + кратко + '</div>';
    }).join('');
  picker.querySelectorAll('.pick-row[data-from]').forEach(row => {
    row.onclick = () => createConnection(row.dataset.from, target, row);
  });
  picker.style.display = 'block';
}

async function createConnection(fromId, target, row){
  if (fromId === target.id) return;           // самосвязывание не бывает
  row.style.pointerEvents = 'none';
  const было = row.textContent;
  row.textContent = 'вплетаю…';
  try {
    const ts = await getTurnstileToken();
    const res = await fetch(WRITE_WORKER_URL, {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ action:'connection', token: MY.token || '', turnstile: ts,
                             from_node_id: fromId, to_node_id: target.id })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    MY.pairs.add(fromId + '|' + target.id);
    MY.pairs.add(target.id + '|' + fromId);
    addThread(fromId, target.id);             // нить появляется сразу, без перезагрузки
    row.className = 'pick-row done';
    row.style.color = '#00ff88';
    row.textContent = '✓ связь вплетена';
  } catch (e){
    row.style.pointerEvents = 'auto';
    row.style.color = '#f55';
    row.textContent = 'не ушло, попробуй ещё';
    setTimeout(() => { row.textContent = было; row.style.color = '#00c8ff'; }, 2000);
  }
}

// Новая нить рисуется сразу: раскладка приколота к карте и не едет,
// поэтому достаточно добавить ребро и поправить счётчики. Перекладывать
// граф под одну связь нельзя — у человека уехало бы всё, на что он смотрит.
function addThread(a, b){
  if (!byId[a] || !byId[b]) return;
  if (E.some(e => (e.a===a && e.b===b) || (e.a===b && e.b===a))) return;
  E.push({ a, b, by:'human' });
  byId[a].deg++; byId[b].deg++;
  const links = document.getElementById('statLinks');
  const alone = document.getElementById('statAlone');
  if (links) links.textContent = E.length;
  if (alone) alone.textContent = NODES.filter(n => n.deg === 0).length;
}

function toScreen(n){
  if (mapbg && n.ll){
    try { const p = mapbg.latLngToContainerPoint(n.ll); return { x:p.x, y:p.y }; } catch (e) {}
  }
  return { x:n.x, y:n.y };
}
function pickAt(sx, sy){
  let best = null, bestD = Infinity;
  for (const n of NODES){
    const p = toScreen(n);
    const d = Math.hypot(p.x - sx, p.y - sy);
    if (d < bestD){ bestD = d; best = n; }
  }
  return (best && bestD < 22) ? best : null;
}
function openEchoPopup(e){
  closePopup();
  openEcho = e.id;
  const pop = document.createElement('div');
  pop.className = 'popup echo';
  pop.innerHTML =
    '<div class="popup-content">' +
      '<div class="popup-tag">ЭХО МИРА</div>' +
      '<div class="popup-text"></div>' +
      // Без даты (Витя, 17.09): место у новости остаётся — оно объясняет,
      // почему ромб лежит именно здесь. Дата не объясняет ничего: эхо и так
      // свежее, старое до карты не доезжает.
      '<div class="popup-time"><span class="echo-place"></span></div>' +
      '<div class="popup-time" style="margin-top:0.5rem"><a target="_blank" rel="noopener"></a></div>' +
    '</div>';
  pop.querySelector('.popup-text').textContent = e.text || '—';
  pop.querySelector('.echo-place').textContent = e.place || 'место не указано';
  const a = pop.querySelector('a');
  if (e.source_url){ a.href = e.source_url; a.textContent = e.source_name || 'источник'; }
  else { a.parentNode.remove(); }
  document.getElementById('net').appendChild(pop);

  placeCard(pop, screenOfEcho(e));
}

// ── тап ───────────────────────────────────────────────────────────
// Тяга, приближение и щипок — работа карты, своего кода для них больше
// нет: две камеры на одном экране не сходились ни при каком масштабе.
// Остаётся только тап: карта говорит, куда попали, мы ищем, что там.
// ── ТАП ───────────────────────────────────────────────────────────
// Считаем его сами, а не берём click у карты. Причина замерена 17.09:
// палец при касании всегда чуть ведёт, и карта считает это перетаскиванием
// — клика не приходит вовсе. Тап со сдвигом всего в 6 пикселей уже не
// открывал карточку: «тап на шум очень редко срабатывает» (Витя, айпад).
//
// Наш допуск: сдвиг до 22px и время до 600мс при одном пальце. Всё, что
// длиннее или дальше, — честное перетаскивание, его забирает карта.
// Двадцать два, а не четырнадцать: палец ведёт по диагонали, и «дрожание
// на 12 пикселей» по каждой оси — это уже 17 по прямой (замер 17.09).
const TAP_MOVE = 22, TAP_MS = 600;
function bindTap(el){
  let начало = null, живых = 0;
  el.addEventListener('pointerdown', e => {
    живых++;
    начало = (живых === 1) ? { x:e.clientX, y:e.clientY, t:Date.now() } : null;
  }, true);
  const конец = e => {
    живых = Math.max(0, живых - 1);
    if (!начало) return;
    const сдвиг = Math.hypot(e.clientX - начало.x, e.clientY - начало.y);
    const прошло = Date.now() - начало.t;
    начало = null;
    if (живых === 0 && сдвиг <= TAP_MOVE && прошло <= TAP_MS){
      const r = el.getBoundingClientRect();
      onTap({ x: e.clientX - r.left, y: e.clientY - r.top });
    }
  };
  el.addEventListener('pointerup', конец, true);
  el.addEventListener('pointercancel', () => { живых = Math.max(0, живых - 1); начало = null; }, true);
}

function onTap(pt){

  // Слоя два, и «Сеть всегда выше» тут не годится: сгусток эха под узлом
  // стал бы недоступен навсегда. Выигрывает то, что БЛИЖЕ к пальцу —
  // человек целился именно туда.
  const near = nodesNear(pt.x, pt.y, TAP_RADIUS);
  let dNode = Infinity, node = null;
  for (const n of near){
    const p = toScreen(n);
    const d = Math.hypot(p.x - pt.x, p.y - pt.y);
    if (d < dNode){ dNode = d; node = n; }
  }
  const c = echoOn ? pickCluster(pt.x, pt.y) : null;
  const dEcho = c ? Math.hypot(c.x - pt.x, c.y - pt.y) : Infinity;

  // ПРАВИЛО ЦЕЛИКОМ (17.09, сформулировал Витя):
  //   попал в узел, ромб или сгусток — приближаемся, неважно шум это или эхо;
  //   попал в пустое место — возвращаемся к общему рисунку.
  // Приближение стало безопасным именно потому, что у него появился
  // парный жест: раньше улететь было можно, а вернуться — нечем.
  if (dEcho < dNode){
    if (c.items.length > 1) { zoomToCluster(c); return; }
    openEchoPopup(c.items[0]);
    zoomTo(L.latLng(c.items[0].lat, c.items[0].lon));
    return;
  }
  if (node){
    // Раньше, если под пальцем оказывалось несколько узлов, я вместо
    // карточки приближал — «давлю на соседний, зумит, а должен показать
    // содержание» (Витя). Теперь всегда показываем ближайший: тап и так
    // подтягивает камеру, и соседи расходятся сами.
    openPopup(node);
    zoomTo(node.ll);
    return;
  }
  closePopup();
  fitWorld(true);
}

// Шаг приближения к одиночному объекту. Потолок ниже общего: дальше
// смысла нет — вокруг одна текстура, а Сеть уже вся за кадром.
// Палец толще указателя: под касанием даём больше места, иначе целиться
// в точку диаметром в несколько пикселей приходится как в игре.
const TAP_RADIUS = (function(){
  try { return window.matchMedia('(pointer: coarse)').matches ? 30 : 22; }
  catch (e) { return 22; }
})();
const TAP_ZOOM_MAX = 6;
function zoomTo(ll){
  if (!mapbg || !ll) return;
  try {
    const z = mapbg.getZoom();
    if (z >= TAP_ZOOM_MAX) return;
    mapbg.flyTo(ll, Math.min(TAP_ZOOM_MAX, z + 2), { duration: 0.7 });
  } catch (e) {}
}

function nodesNear(sx, sy, rad){
  const out = [];
  for (const n of NODES){
    const p = toScreen(n);
    if (Math.hypot(p.x - sx, p.y - sy) < rad) out.push(n);
  }
  return out;
}
function zoomToNodes(list){
  if (!mapbg) return;
  try {
    const lls = list.filter(n => n.ll).map(n => n.ll);
    if (lls.length > 1) mapbg.fitBounds(L.latLngBounds(lls).pad(0.6),
                                        { maxZoom: Math.min(9, mapbg.getZoom() + 3) });
    else mapbg.setZoom(Math.min(9, mapbg.getZoom() + 2));
  } catch (e) {}
}
function pickCluster(sx, sy){
  let best = null, bestD = Infinity;
  for (const c of CLUSTERS){
    const d = Math.hypot(c.x - sx, c.y - sy);
    if (d < bestD){ bestD = d; best = c; }
  }
  return (best && bestD < 20) ? best : null;
}

// Карточка едет вместе со своим узлом или ромбом: карта двигается, и
// оставлять карточку висеть на прежнем месте было бы враньём.
function repositionPopup(){
  const pop = document.querySelector('.popup');
  if (!pop) return;
  let sp = null;
  if (openId && byId[openId]) sp = toScreen(byId[openId]);
  else if (openEcho){
    const e = ECHO.find(x => x.id === openEcho);
    if (e) sp = screenOfEcho(e);
  }
  placeCard(pop, sp);
}

// Легенда гаснет через шесть секунд после захода — успеть прочитать три
// строки хватает с запасом, а дальше она только отнимает угол.
setTimeout(() => {
  const l = document.querySelector('.net-legend');
  if (l) l.classList.add('faded');
}, 6000);

document.getElementById('netReset').onclick = resetView;
document.getElementById('echoToggle').onclick = () => setEcho(!echoOn);
window.addEventListener('resize', resize);

// ── запуск ────────────────────────────────────────────────────────
initMapBg();                                                          // мир под Сетью
build(SNAPSHOT.nodes.map(n => Object.assign({}, n)), SNAPSHOT.links);  // мгновенная картинка
resize();
let t0 = 0;
function loop(now){ if (!t0) t0 = now; draw((now-t0)/1000); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
load();   // и следом — живые данные
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onloadTurnstileCallback&render=explicit" async defer></script>
