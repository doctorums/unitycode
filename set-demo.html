function ucHash(s){

  for (let i = 0; i < s.length; i++){ x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); }

// ── данные ────────────────────────────────────────────────────────
async function fetchRetry(url, tries){
  const headers = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY };
  let wait = 600;
  for (let i = 0; i < (tries || 3); i++){
    try {
      const r = await fetch(url, { headers });
      if (r.ok) return await r.json();
    } catch (e) { /* молчим, пробуем ещё */ }
    await new Promise(res => setTimeout(res, wait));
    wait *= 2;
  }
  return null;
}

function build(nodes, links){
  byId = {}; NODES = nodes; E = [];
  NODES.forEach(n => { byId[n.id] = n; n.deg = 0; });
  // человек и Связующий могли проложить одну и ту же нить — рисуем одну,
  // человеческая сильнее: она говорит, что связь выбрал живой.
  const seen = {};
  for (const l of links){
    if (!byId[l.a] || !byId[l.b] || l.a === l.b) continue;
    const k = [l.a, l.b].sort().join('|');
    if (seen[k]){ if (l.by === 'human') seen[k].by = 'human'; continue; }
    const e = { a:l.a, b:l.b, by:l.by };
    seen[k] = e; E.push(e);
    byId[l.a].deg++; byId[l.b].deg++;
  }
  document.getElementById('statNodes').textContent = NODES.length;
  document.getElementById('statLinks').textContent = E.length;
  document.getElementById('statAlone').textContent = NODES.filter(n => n.deg === 0).length;
}

let ECHO = [], ECHO_LOOSE = [], echoOn = false, echoLoaded = false;

async function loadEchoes(){
  if (echoLoaded) return;
  const rows = await fetchRetry(SUPABASE_URL +
    '/rest/v1/echoes?select=id,text,place,lat,lon,source_name,source_url,created_at' +
    '&order=created_at.desc&limit=500');
  if (!Array.isArray(rows)) return;          // не приехало — просто нет слоя
  echoLoaded = true;
  ECHO = rows.filter(r => Number.isFinite(r.lat) && Number.isFinite(r.lon));
  ECHO_LOOSE = rows.filter(r => !Number.isFinite(r.lat) || !Number.isFinite(r.lon));
  projectEchoes();
  buildTicker();
  syncTicker();          // эхо приехало уже после нажатия — лента включается тут
}

function syncTicker(){
  const on = echoOn && ECHO_LOOSE.length > 0;
  document.getElementById('echoTicker').classList.toggle('show', on);
  document.getElementById('net').classList.toggle('with-ticker', on);
}

function projectEchoes(){
  if (!mapbg) return;
  for (const e of ECHO){
    const p = screenOfEcho(e);
    e.ex = p ? p.x : null; e.ey = p ? p.y : null;
  }
}

function buildTicker(){
  const track = document.getElementById('echoTickerTrack');
  if (!track || !ECHO_LOOSE.length) return;
  const items = ECHO_LOOSE.slice(0, 24);
  const one = items.map(e => {
    const s = document.createElement('span');
    s.className = 'echo-ticker-item';
    s.textContent = e.text || '';
    return s.outerHTML;
  }).join('');
  track.innerHTML = one + one;                       // два прохода — для бесшовной прокрутки
  track.style.animationDuration = Math.max(40, items.length * 6) + 's';
}

function setEcho(on){
  echoOn = on;
  const b = document.getElementById('echoToggle');
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  syncTicker();
  if (on) loadEchoes();
  if (!on && openEcho) closePopup();
}

async function load(){
  const L = document.getElementById('loading');
  const slow = setTimeout(() => L.classList.add('visible'), 1200);
  const [rawNodes, rawConns] = await Promise.all([
    fetchRetry(SUPABASE_URL + '/rest/v1/nodes?select=id,raw_noise,created_at&order=created_at.asc'),
    fetchRetry(SUPABASE_URL + '/rest/v1/connections?select=from_node_id,to_node_id,created_by&status=eq.accepted')
  ]);
  clearTimeout(slow); L.classList.remove('visible');

  if (Array.isArray(rawNodes) && rawNodes.length && Array.isArray(rawConns)){
    build(
      rawNodes.map(n => ({ id:n.id, noise:n.raw_noise || '', created_at:(n.created_at||'').slice(0,10) })),
      rawConns.map(c => ({ a:c.from_node_id, b:c.to_node_id, by:c.created_by }))
    );
  } else {
    // сеть не ответила — показываем снимок, а не пустой экран
    build(SNAPSHOT.nodes.map(n => Object.assign({}, n)), SNAPSHOT.links);
    document.getElementById('hint').textContent = 'связь не отвечает — показан снимок Сети на 17.09';
  }
  resize();
}

// ── раскладка ─────────────────────────────────────────────────────
// Связная часть считается силами: узлы отталкиваются, нити стягивают.
// Одинокие в расчёт не входят — им не за что держаться, их вынесло бы
// на края и остальной граф ужался бы в угол. У них своя полка внизу.
function layout(){
  CORE  = NODES.filter(n => n.deg > 0);
  ALONE = NODES.filter(n => n.deg === 0);
  if (!CORE.length) return;

  _seed = 1337;  // раскладка одна и та же при каждом заходе
  const R = Math.min(W, H) * 0.32;
  CORE.forEach(n => {
    const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * R;
    n.x = W/2 + Math.cos(a)*r; n.y = H/2 + Math.sin(a)*r; n.vx = 0; n.vy = 0;
  });

  const K = Math.sqrt(W*H / CORE.length) * 0.46;
  const IT = 800;
  for (let it = 0; it < IT; it++){
    const cool = 1 - it/IT;
    for (let i = 0; i < CORE.length; i++){
      const p = CORE[i];
      for (let j = i+1; j < CORE.length; j++){
        const q = CORE[j];
        let dx = p.x-q.x, dy = p.y-q.y;
        let d2 = dx*dx + dy*dy;
        if (d2 < 1){ d2 = 1; dx = rnd()-0.5; dy = rnd()-0.5; }
        const f = (K*K)/d2, d = Math.sqrt(d2);
        p.vx += dx/d*f; p.vy += dy/d*f; q.vx -= dx/d*f; q.vy -= dy/d*f;
      }
    }
    for (const e of E){
      const p = byId[e.a], q = byId[e.b];
      if (!p || !q || p.deg === 0 || q.deg === 0) continue;
      const dx = p.x-q.x, dy = p.y-q.y;
      const d = Math.max(1, Math.hypot(dx, dy));
      const f = (d*d)/K * 0.5;
      p.vx -= dx/d*f; p.vy -= dy/d*f; q.vx += dx/d*f; q.vy += dy/d*f;
    }
    for (const p of CORE){
      p.vx += (W/2 - p.x) * 0.02; p.vy += (H/2 - p.y) * 0.02;
      const sp = Math.hypot(p.vx, p.vy), lim = K * 0.3 * cool;
      const s = sp > lim ? lim/sp : 1;
      p.x += p.vx*s; p.y += p.vy*s; p.vx *= 0.82; p.vy *= 0.82;
    }
  }

  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  CORE.forEach(n => { x0=Math.min(x0,n.x); y0=Math.min(y0,n.y); x1=Math.max(x1,n.x); y1=Math.max(y1,n.y); });
  const narrow = W < 640;
  const bx = W*0.16, bw = W - 2*bx;          // поле шире: кольцу одиноких нужно место
  const by = H*0.16, bh = H*0.58;
  const sc = Math.min(bw/Math.max(1,x1-x0), bh/Math.max(1,y1-y0));
  const ox = bx + (bw - (x1-x0)*sc)/2, oy = by + (bh - (y1-y0)*sc)/2;
  CORE.forEach(n => { n.x = ox + (n.x-x0)*sc; n.y = oy + (n.y-y0)*sc; });
  let x0c=1e9,y0c=1e9,x1c=-1e9,y1c=-1e9;
  CORE.forEach(n => { x0c=Math.min(x0c,n.x); y0c=Math.min(y0c,n.y); x1c=Math.max(x1c,n.x); y1c=Math.max(y1c,n.y); });

  // Одинокие — кольцом вокруг связной части, а не полкой внизу. Полка
  // была привязана к экрану, а теперь всё живёт в пространстве карты и
  // едет вместе с ней; экранной полке там места нет. Кольцо держится на
  // хеше id, то есть у каждого узла своё постоянное место.
  const rcx = (x0c + x1c)/2, rcy = (y0c + y1c)/2;
  const rad = Math.max(x1c - x0c, y1c - y0c) * 0.78 + Math.min(W,H) * 0.06;
  ALONE.forEach(n => {
    const h = ucHash(n.id);
    const a = (h % 6283) / 1000;
    const rr = rad * (0.92 + ((h >>> 12) % 200) / 1000);
    n.x = rcx + Math.cos(a) * rr;
    n.y = rcy + Math.sin(a) * rr * 0.72;
  });

  pinToMap();
}

// Раскладка считается в пикселях экрана — так проще и так она и была.
// Дальше каждый узел получает точку в пространстве КАРТЫ и живёт уже в
// ней: карту двигают — узлы едут вместе с миром и эхом, сами собой.
// Это не «узел находится в Африке»: место в раскладке, не место человека.
function pinToMap(){
  if (!mapbg) return;
  for (const n of NODES){
    try { n.ll = mapbg.containerPointToLatLng([n.x, n.y]); } catch (e) { n.ll = null; }
  }
}

// ── кадр ──────────────────────────────────────────────────────────
// Язык Паттерна: глубокое полотно, свечение, дыхание нитей, лёгкое
// покачивание узлов «на воде» — фаза у каждого своя, но от хеша id,
// то есть одна и та же при каждом заходе.
// Экранное место узла: спрашиваем у карты, потом добавляем покачивание.
// Покачивание — в пикселях экрана и не зависит от масштаба: это дыхание
// живого, а не размер объекта.
function screenOf(n, t){
  let x = n.x, y = n.y;
  if (mapbg && n.ll){
    try { const p = mapbg.latLngToContainerPoint(n.ll); x = p.x; y = p.y; } catch (e) {}
  }
  const h = ucHash(n.id);
  const A = 2.2;
  return { x: x + A*Math.sin(t*0.55 + (h % 628)/100),
           y: y + A*Math.cos(t*0.47 + ((h >> 8) % 628)/100) };
}
function screenOfEcho(e){
  if (!mapbg) return null;
  try { const p = mapbg.latLngToContainerPoint([e.lat, e.lon]); return { x:p.x, y:p.y }; }
  catch (err) { return null; }
}

let POS = {};

function draw(t){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // Полотно прозрачное: фон рисует карта под канвасом, глубину даёт вуаль.
  // Своего градиента здесь больше нет — он спорил бы с картой за задний план.
  ctx.clearRect(0,0,W,H);

  // Камера одна на всех, поэтому порядок слоёв — только про глубину:
  // мир внизу, Сеть поверх. Приближение двигает их вместе, и это
  // единственное, что здесь важно.
  if (echoOn){
    projectEchoes();
    for (const e of ECHO){
      if (e.ex == null) continue;
      const puls = 0.85 + 0.15*Math.sin(t*1.1 + (e.ex + e.ey)*0.05);
      const r = 4.2*puls;
      const g = ctx.createRadialGradient(e.ex,e.ey,0,e.ex,e.ey,r*4);
      g.addColorStop(0,'rgba(255,180,60,0.35)');
      g.addColorStop(1,'rgba(255,180,60,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(e.ex,e.ey,r*4,0,Math.PI*2); ctx.fill();

      ctx.save();
      ctx.translate(e.ex, e.ey); ctx.rotate(Math.PI/4);
      ctx.fillStyle = (openEcho === e.id) ? '#fff2d8' : 'rgba(255,180,60,0.92)';
      ctx.fillRect(-r/1.4, -r/1.4, r*1.42, r*1.42);
      ctx.restore();
    }
  }

  POS = {};
  for (const n of NODES) POS[n.id] = screenOf(n, t);

  const breathe = 0.72 + 0.28*Math.sin(t*0.8);

  ctx.lineCap = 'round';
  for (const e of E){
    const p = POS[e.a], q = POS[e.b];
    if (!p || !q) continue;
    const human = e.by === 'human';
    // над картой нити держим чуть плотнее, чем на пустом фоне: иначе
    // тонкая зелёная линия тонет в сером городе под ней
    ctx.strokeStyle = human ? 'rgba(79,214,255,'+(0.14*breathe).toFixed(3)+')'
                            : 'rgba(0,255,136,'+(0.11*breathe).toFixed(3)+')';
    ctx.lineWidth = human ? 5 : 3.5;
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();

    ctx.strokeStyle = human ? 'rgba(120,225,255,'+(0.50+0.18*breathe).toFixed(3)+')'
                            : 'rgba(0,255,136,'+(0.30+0.14*breathe).toFixed(3)+')';
    ctx.lineWidth = human ? 1.2 : 0.8;
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();
  }
  ctx.lineCap = 'butt';

  for (const n of NODES){
    const p = POS[n.id];
    const alone = n.deg === 0;
    const base = alone ? 2.4 : 3.2 + Math.min(4.6, n.deg*0.52);
    const puls = 0.86 + 0.14*Math.sin(t*1.5 + (ucHash(n.id) % 628)/100);
    const r = base*puls;
    const col = alone ? '150,170,160' : '0,255,136';

    const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*5.2);
    g.addColorStop(0,   'rgba('+col+','+(alone?0.20:0.42)+')');
    g.addColorStop(0.35,'rgba('+col+','+(alone?0.08:0.16)+')');
    g.addColorStop(1,   'rgba('+col+',0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x,p.y,r*5.2,0,Math.PI*2); ctx.fill();

    ctx.fillStyle = alone ? 'rgba(165,185,175,0.85)' : 'rgba(0,255,136,0.95)';
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fill();

    if (n.deg >= 5){
      ctx.fillStyle = 'rgba(235,255,245,'+(0.55+0.25*breathe).toFixed(3)+')';
      ctx.beginPath(); ctx.arc(p.x,p.y,r*0.42,0,Math.PI*2); ctx.fill();
    }
    if (n.id === openId){
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(p.x,p.y,r*2.6,0,Math.PI*2); ctx.stroke();
    }
  }
}

// ── карта как фон ─────────────────────────────────────────────────
// Событий не принимает вообще: ни тяги, ни колеса, ни клавиш. Граф
// сверху двигается сам по себе — если бы карта ездила вместе с ним,
// пришлось бы отвечать на вопрос «где на карте этот узел», а ответа
// нет: в том и смысл, что Сеть больше не привязана к месту.
// Плотность вуали. Значение по умолчанию подобрано на стенде с заглушкой
// тайлов — настоящую карту я отсюда не вижу, её тайлы до песочницы не
// доезжают. Поэтому ручка в адресе: ?veil=0 — карта во всю силу,
// ?veil=1 — почти чёрный фон. Подберёте на живом экране — скажете число,
// я впишу его в файл и ручку уберу.
(function(){
  try {
    const v = parseFloat(new URLSearchParams(location.search).get('veil'));
    if (Number.isFinite(v) && v >= 0 && v <= 1)
      document.getElementById('veil').style.setProperty('--v', v);
  } catch (e) {}
})();

let mapbg = null;
function initMapBg(){
  if (mapbg || typeof L === 'undefined') return;
  try {
    mapbg = L.map('mapbg', {
      zoomControl:false, attributionControl:false,
      minZoom:1, maxZoom:9,
      // Держим только по широте: за полюсами ничего нет, а по долготе
      // мир замкнут и должен заполнять кадр целиком. Жёсткие границы по
      // долготе давали чёрные поля слева и справа, когда мир уже кончился,
      // а экран ещё нет (видно на снимке Вити 17.09).
      maxBounds: L.latLngBounds([[-85, -Infinity],[85, Infinity]]),
      maxBoundsViscosity: 0.6,
      worldCopyJump: true
    });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                { maxZoom:9 }).addTo(mapbg);
    // Карта — камера, поэтому она же и рассказывает, куда всё уехало.
    mapbg.on('move zoom', repositionPopup);
    mapbg.on('click', onMapClick);
    fitWorld();
  } catch (e) { mapbg = null; }   // карта не поднялась — Сеть рисуется на пустом фоне
}
function fitWorld(){
  if (!mapbg) return;
  try {
    mapbg.invalidateSize(false);
    // Обитаемая часть мира, без полярных пустошей: они заняли бы треть
    // кадра и ничего не сообщают. Границы одни и те же на любом экране,
    // масштаб под них подбирает сам Leaflet.
    mapbg.fitBounds(L.latLngBounds([[-54,-168],[72,178]]), { animate:false, padding:[0,0] });
  } catch (e) {}
}

// ── размеры ───────────────────────────────────────────────────────
function resize(){
  const box = document.getElementById('net').getBoundingClientRect();
  W = box.width; H = box.height;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  closePopup();
  fitWorld();      // сначала камера встаёт на мир…
  layout();        // …и только потом раскладка прикалывается к нему
  projectEchoes();
}
function resetView(){ closePopup(); fitWorld(); }

// ── карточка узла ─────────────────────────────────────────────────
let openId = null, openEcho = null;
function closePopup(){
  openId = null; openEcho = null;
  const p = document.querySelector('.popup');
  if (p) p.remove();
}
function openPopup(n){
  closePopup();
  openId = n.id;
  const net = document.getElementById('net');
  const pop = document.createElement('div');
  pop.className = 'popup';
  const d = (n.created_at || '').split('-').reverse().join('.');
  pop.innerHTML =
    '<button class="popup-close" aria-label="закрыть">&times;</button>' +
    '<div class="popup-content">' +
      '<div class="popup-tag">// УЗЕЛ СЕТИ</div>' +
      '<div class="popup-text"></div>' +
      '<div class="popup-time">' + (n.deg ? n.deg + ' нитей' : 'ещё ни с чем не сплёлся') +
        (d ? ' · ' + d : '') + '</div>' +
    '</div>';
  pop.querySelector('.popup-text').textContent = n.noise || '—';
  pop.querySelector('.popup-close').onclick = closePopup;
  net.appendChild(pop);

  if (W >= 640){
    const sp = toScreen(n);
    const pw = pop.offsetWidth, ph = pop.offsetHeight;
    let px = sp.x - pw/2, py = sp.y - ph - 18;
    px = Math.max(8, Math.min(W - pw - 8, px));
    if (py < 8) py = Math.min(H - ph - 8, sp.y + 20);
    pop.style.left = px + 'px'; pop.style.top = py + 'px';
  }
}
// Все слои теперь в одних координатах — тех, что даёт карта. Поэтому и
// попадание считается одинаково для узла и для ромба, без пересчётов.
function toScreen(n){
  if (mapbg && n.ll){
    try { const p = mapbg.latLngToContainerPoint(n.ll); return { x:p.x, y:p.y }; } catch (e) {}
  }
  return { x:n.x, y:n.y };
}
function pickAt(sx, sy){
  let best = null, bestD = Infinity;
  for (const n of NODES){
    const p = toScreen(n);
    const d = Math.hypot(p.x - sx, p.y - sy);
    if (d < bestD){ bestD = d; best = n; }
  }
  return (best && bestD < 22) ? best : null;
}
function pickEcho(sx, sy){
  if (!echoOn) return null;
  let best = null, bestD = Infinity;
  for (const e of ECHO){
    if (e.ex == null) continue;
    const d = Math.hypot(e.ex - sx, e.ey - sy);
    if (d < bestD){ bestD = d; best = e; }
  }
  return (best && bestD < 18) ? best : null;
}

function openEchoPopup(e){
  closePopup();
  openEcho = e.id;
  const pop = document.createElement('div');
  pop.className = 'popup echo';
  const d = (e.created_at || '').slice(0,10).split('-').reverse().join('.');
  pop.innerHTML =
    '<button class="popup-close" aria-label="закрыть">&times;</button>' +
    '<div class="popup-content">' +
      '<div class="popup-tag">// ЭХО МИРА</div>' +
      '<div class="popup-text"></div>' +
      '<div class="popup-time"><span class="echo-place"></span>' + (d ? ' · ' + d : '') + '</div>' +
      '<div class="popup-time" style="margin-top:0.5rem"><a target="_blank" rel="noopener"></a></div>' +
    '</div>';
  pop.querySelector('.popup-text').textContent = e.text || '—';
  pop.querySelector('.echo-place').textContent = e.place || 'место не указано';
  const a = pop.querySelector('a');
  if (e.source_url){ a.href = e.source_url; a.textContent = e.source_name || 'источник'; }
  else { a.parentNode.remove(); }
  pop.querySelector('.popup-close').onclick = closePopup;
  document.getElementById('net').appendChild(pop);

  if (W >= 640){
    const pw = pop.offsetWidth, ph = pop.offsetHeight;
    let px = e.ex - pw/2, py = e.ey - ph - 16;
    px = Math.max(8, Math.min(W - pw - 8, px));
    if (py < 8) py = Math.min(H - ph - 8, e.ey + 18);
    pop.style.left = px + 'px'; pop.style.top = py + 'px';
  }
}

// ── тап ───────────────────────────────────────────────────────────
// Тяга, приближение и щипок — работа карты, своего кода для них больше
// нет: две камеры на одном экране не сходились ни при каком масштабе.
// Остаётся только тап: карта говорит, куда попали, мы ищем, что там.
function onMapClick(ev){
  const pt = ev.containerPoint;
  const n = pickAt(pt.x, pt.y);          // Сеть выше мира и по тапу тоже
  if (n) { openPopup(n); return; }
  const ec = pickEcho(pt.x, pt.y);
  if (ec) openEchoPopup(ec); else closePopup();
}

// Карточка едет вместе со своим узлом или ромбом: карта двигается, и
// оставлять карточку висеть на прежнем месте было бы враньём.
function repositionPopup(){
  if (W < 640) return;
  const pop = document.querySelector('.popup');
  if (!pop) return;
  let sp = null;
  if (openId && byId[openId]) sp = toScreen(byId[openId]);
  else if (openEcho){
    const e = ECHO.find(x => x.id === openEcho);
    if (e) sp = screenOfEcho(e);
  }
  if (!sp) return;
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let px = sp.x - pw/2, py = sp.y - ph - 18;
  px = Math.max(8, Math.min(W - pw - 8, px));
  if (py < 8) py = Math.min(H - ph - 8, sp.y + 20);
  pop.style.left = px + 'px'; pop.style.top = py + 'px';
}

document.getElementById('netReset').onclick = resetView;
document.getElementById('echoToggle').onclick = () => setEcho(!echoOn);
window.addEventListener('resize', resize);

// ── запуск ────────────────────────────────────────────────────────
initMapBg();                                                          // мир под Сетью
build(SNAPSHOT.nodes.map(n => Object.assign({}, n)), SNAPSHOT.links);  // мгновенная картинка
resize();
let t0 = 0;
function loop(now){ if (!t0) t0 = now; draw((now-t0)/1000); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
load();   // и следом — живые данные
</script>
