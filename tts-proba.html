<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UnityCode — проба голосов эссенции</title>
<style>
  :root { --accent: #00ff88; --bg: #020806; --panel: #04100e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 20px 16px 60px;
    background: var(--bg); color: rgba(230,255,240,0.9);
    font-family: 'Courier New', ui-monospace, monospace;
    line-height: 1.5;
  }
  h1 { font-size: 15px; font-weight: normal; letter-spacing: 2px; color: rgba(0,255,136,0.75); margin: 0 0 4px; }
  .sub { font-size: 12px; color: rgba(230,255,240,0.45); margin: 0 0 20px; }
  label { display: block; font-size: 11px; color: rgba(230,255,240,0.55); margin: 0 0 4px; letter-spacing: 0.5px; }
  .phrase {
    width: 100%; background: var(--panel); color: rgba(230,255,240,0.9);
    border: 1px solid rgba(0,255,136,0.25); font-family: inherit; font-size: 14px;
    padding: 10px; margin-bottom: 6px; border-radius: 8px;
  }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; }
  .presets button {
    background: transparent; border: 1px solid rgba(0,255,136,0.2);
    color: rgba(230,255,240,0.55); font-family: inherit; font-size: 11px;
    padding: 4px 10px; border-radius: 20px; cursor: pointer;
  }
  .presets button:active { background: rgba(0,255,136,0.1); }
  .voice {
    border: 1px solid rgba(0,255,136,0.18); background: var(--panel);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 12px;
  }
  .voice-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .voice-name { font-size: 15px; color: rgba(0,255,136,0.85); letter-spacing: 1px; }
  .voice-desc { font-size: 11px; color: rgba(230,255,240,0.4); }
  .roles { display: flex; flex-wrap: wrap; gap: 8px; }
  .roles button {
    flex: 1 1 auto; min-width: 90px;
    background: rgba(0,255,136,0.06); border: 1px solid rgba(0,255,136,0.3);
    color: rgba(0,255,136,0.9); font-family: inherit; font-size: 13px;
    padding: 10px 8px; border-radius: 8px; cursor: pointer;
    transition: background 0.15s;
  }
  .roles button:active { background: rgba(0,255,136,0.22); }
  .roles button.loading { opacity: 0.5; }
  .roles button.err { border-color: #f66; color: #f88; }
  .hint { font-size: 11px; color: rgba(230,255,240,0.35); margin-top: 24px; text-align: center; }
  .diag { font-size: 11px; color: #f88; margin-top: 8px; word-break: break-word; }
</style>
</head>
<body>

<h1>// ПРОБА ГОЛОСОВ ЭССЕНЦИИ</h1>
<p class="sub">Одна фраза — разными голосами. Слушай на этом же устройстве, выбирай голос Сети.</p>

<label>Фраза эссенции (можно менять)</label>
<input class="phrase" id="phrase" value="тишина важнее слов">
<div class="presets" id="presets"></div>

<div id="voices"></div>

<p class="hint">Роль — это манера того же диктора (нейтрально / радостно / строго / зло). Не у каждого голоса есть все роли — показаны только реальные.</p>
<div class="diag" id="diag"></div>

<script>
  // ⚠️ ВСТАВЬ СЮДА URL временного воркера-пробы (tts-proba-worker):
  const TTS_PROBA_URL = 'https://ЗАМЕНИ-НА-СВОЙ-воркер.workers.dev';

  // Голоса и их реальные роли (совпадает с белым списком в воркере).
  // Роль '' = нейтральный дефолт голоса.
  const VOICES = [
    { id: 'alena',  desc: 'ж · тёплый',    roles: [['', 'нейтр.'], ['good', 'радостн.']] },
    { id: 'jane',   desc: 'ж · мягкий',    roles: [['', 'нейтр.'], ['good', 'радостн.'], ['evil', 'строгий']] },
    { id: 'omazh',  desc: 'ж · ниже',      roles: [['', 'нейтр.'], ['evil', 'строгий']] },
    { id: 'ermil',  desc: 'м · светлый',   roles: [['', 'нейтр.'], ['good', 'радостн.']] },
    { id: 'zahar',  desc: 'м · глубокий',  roles: [['', 'нейтр.'], ['good', 'радостн.']] },
    { id: 'filipp', desc: 'м · мягкий',    roles: [['', 'нейтр.']] },
  ];

  const PRESETS = [
    'тишина важнее слов',
    'гарантия уходит — бдительность остаётся',
    'тоска по порядку прячется в разрушении',
    'здоровье не терпит очередей',
    'сеть плетётся из того, что не сказано',
  ];

  let currentAudio = null;

  function play(voice, role, btn) {
    const text = document.getElementById('phrase').value.trim() || 'тишина важнее слов';
    document.getElementById('diag').textContent = '';
    if (currentAudio) { try { currentAudio.pause(); } catch(e){} }
    btn.classList.add('loading'); btn.classList.remove('err');

    const u = TTS_PROBA_URL + '?text=' + encodeURIComponent(text) +
              '&voice=' + encodeURIComponent(voice) +
              '&role=' + encodeURIComponent(role);

    fetch(u)
      .then(r => {
        const ct = r.headers.get('Content-Type') || '';
        if (!ct.includes('audio')) {
          return r.json().then(j => { throw new Error(j.detail || j.error || 'нет аудио'); });
        }
        return r.blob();
      })
      .then(blob => {
        const url = URL.createObjectURL(blob);
        currentAudio = new Audio(url);
        currentAudio.play();
        btn.classList.remove('loading');
      })
      .catch(err => {
        btn.classList.remove('loading'); btn.classList.add('err');
        document.getElementById('diag').textContent = voice + '/' + (role||'нейтр') + ': ' + err.message;
      });
  }

  // рендер пресетов
  const pc = document.getElementById('presets');
  PRESETS.forEach(p => {
    const b = document.createElement('button');
    b.textContent = p.length > 24 ? p.slice(0, 24) + '…' : p;
    b.onclick = () => { document.getElementById('phrase').value = p; };
    pc.appendChild(b);
  });

  // рендер голосов
  const vc = document.getElementById('voices');
  VOICES.forEach(v => {
    const card = document.createElement('div');
    card.className = 'voice';
    const head = document.createElement('div');
    head.className = 'voice-head';
    head.innerHTML = '<span class="voice-name">' + v.id + '</span><span class="voice-desc">' + v.desc + '</span>';
    card.appendChild(head);
    const roles = document.createElement('div');
    roles.className = 'roles';
    v.roles.forEach(([rid, rlabel]) => {
      const b = document.createElement('button');
      b.textContent = '▶ ' + rlabel;
      b.onclick = () => play(v.id, rid, b);
      roles.appendChild(b);
    });
    card.appendChild(roles);
    vc.appendChild(card);
  });
</script>
</body>
</html>
