<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бог, бесконечность и ты · UnityCode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..700&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap" rel="stylesheet">
<style>
  :root{
    --maxw:720px;
    --gold:#b8862f; --gold-soft:#c99a45;
    --accent:#2e4756; --accent2:#6b4e3d;
  }
  /* LIGHT (default, book mode) */
  html[data-theme="light"]{
    --bg:#f4efe6; --bg2:#ece5d7; --fg:#2a2620; --fg-dim:#6a6255;
    --card:#ebe4d5; --card-line:#d8cdb8; --rule:#d8cdb8; --head:#2e4756; --head2:#6b4e3d;
    --quote:#473d30;
  }
  /* DARK (atmosphere) */
  html[data-theme="dark"]{
    --bg:#0c121b; --bg2:#111a26; --fg:#f3eee2; --fg-dim:#b8b0a0;
    --card:#13202e; --card-line:rgba(184,134,47,.28); --rule:rgba(184,134,47,.22); --head:#f3eee2; --head2:#e0b566;
    --quote:#e6ddcc; --gold:#d8a64a; --gold-soft:#e8c887;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg); color:var(--fg);
    font-family:"Newsreader",Georgia,serif; font-size:var(--fs,20px); line-height:1.78; font-weight:300;
    letter-spacing:.001em; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    transition:background .4s ease,color .4s ease;
  }
  #net{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:none}
  html[data-theme="dark"] #net{display:block}
  .veil{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .4s}
  html[data-theme="dark"] .veil{opacity:1;background:radial-gradient(1000px 700px at 75% -10%, rgba(184,134,47,.08), transparent 60%)}

  /* progress bar */
  #progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-soft));z-index:50;transition:width .15s ease}

  /* top bar */
  .topbar{position:fixed;top:0;left:0;right:0;height:54px;z-index:40;display:flex;align-items:center;gap:14px;
    padding:0 18px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--rule)}
  .topbar .menu-btn{font-size:22px;background:none;border:none;color:var(--fg);cursor:pointer;line-height:1;padding:6px}
  .topbar .bk-title{font-family:"Fraunces",serif;font-weight:600;font-size:16px;color:var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .spacer{flex:1}
  .topbar .ctrl{background:none;border:1px solid var(--rule);color:var(--fg);border-radius:4px;cursor:pointer;
    font-family:"Newsreader",serif;font-size:14px;padding:5px 10px;transition:border-color .2s}
  .topbar .ctrl:hover{border-color:var(--gold)}

  /* sidebar TOC */
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:82vw;z-index:60;background:var(--bg2);
    border-right:1px solid var(--rule);transform:translateX(-105%);transition:transform .34s cubic-bezier(.2,.7,.2,1);
    overflow-y:auto;padding:24px 0}
  .sidebar.open{transform:none}
  .sidebar h3{font-family:"Fraunces",serif;font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--head2);padding:0 24px 14px}
  .toc-item{display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;
    font-family:"Newsreader",serif;color:var(--fg);font-size:16px;line-height:1.4;padding:9px 24px;transition:background .2s,color .2s;border-left:3px solid transparent}
  .toc-item:hover{background:color-mix(in srgb,var(--gold) 12%,transparent)}
  .toc-item.part{font-family:"Fraunces",serif;font-weight:600;color:var(--head);font-size:15px;margin-top:14px;letter-spacing:.02em}
  .toc-item.chap{padding-left:36px}
  .toc-item.active{border-left-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 8%,transparent)}
  .overlay{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s}
  .overlay.show{opacity:1;pointer-events:auto}

  /* reading area */
  main{position:relative;z-index:3;max-width:var(--maxw);margin:0 auto;padding:96px 26px 40px}
  .pane{display:none;animation:fade .5s ease}
  .pane.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  h1.part{font-family:"Fraunces",serif;font-weight:600;font-size:clamp(34px,7vw,52px);line-height:1.05;
    color:var(--head);text-align:center;margin:8vh 0 2vh;letter-spacing:-.015em}
  .part-blurb{text-align:center;font-style:italic;color:var(--fg-dim);max-width:520px;margin:0 auto 4vh;font-size:19px}
  h2.chap{font-family:"Fraunces",serif;font-weight:600;font-size:clamp(28px,5vw,40px);line-height:1.08;
    color:var(--head);letter-spacing:-.015em;margin:0 0 6px}
  h3{font-family:"Fraunces",serif;font-weight:600;font-size:clamp(21px,3.4vw,27px);color:var(--head);margin:34px 0 6px;line-height:1.15}
  h4{font-family:"Fraunces",serif;font-weight:600;font-size:19px;color:var(--head2);margin:24px 0 4px}
  p{margin:18px 0}
  strong{font-weight:600;color:var(--fg)}
  em{font-style:italic;color:var(--head2)}
  .epi{font-family:"Fraunces",serif;font-style:italic;color:var(--quote);border-left:2px solid var(--gold);
    padding-left:20px;margin:26px 0;font-size:21px}
  .epi cite{display:block;font-style:normal;font-size:14px;color:var(--fg-dim);margin-top:8px}
  ul.b{list-style:none;margin:18px 0;padding:0}
  ul.b li{position:relative;padding-left:26px;margin:12px 0}
  ul.b li::before{content:"";position:absolute;left:4px;top:13px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
  ol.n{margin:18px 0;padding-left:30px}
  ol.n li{margin:12px 0}

  /* callout */
  .callout{background:var(--card);border:1px solid var(--card-line);border-left:4px solid var(--accent2);
    border-radius:3px;padding:22px 24px;margin:28px 0}
  .callout .ctitle{font-family:"Fraunces",serif;font-weight:600;color:var(--head2);font-size:18px;margin-bottom:8px}
  .callout p{margin:8px 0}

  /* data table */
  .tbl-wrap{overflow-x:auto;margin:26px 0}
  table.data{border-collapse:collapse;width:100%;font-size:16px}
  table.data th{background:var(--accent);color:#fff;font-family:"Fraunces",serif;font-weight:600;text-align:left;padding:10px 12px}
  table.data td{border:1px solid var(--card-line);padding:9px 12px;vertical-align:top}
  html[data-theme="dark"] table.data td{border-color:rgba(255,255,255,.12)}

  /* chapter nav */
  .chap-nav{display:flex;justify-content:space-between;gap:14px;margin:6vh 0 2vh;padding-top:28px;border-top:1px solid var(--rule)}
  .chap-nav button{flex:1;background:none;border:1px solid var(--rule);border-radius:5px;cursor:pointer;
    font-family:"Newsreader",serif;color:var(--fg);padding:14px 16px;text-align:left;transition:border-color .25s,transform .25s}
  .chap-nav button:hover:not(:disabled){border-color:var(--gold);transform:translateY(-2px)}
  .chap-nav button:disabled{opacity:.3;cursor:default}
  .chap-nav .lbl{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-dim);margin-bottom:3px}
  .chap-nav .nm{font-family:"Fraunces",serif;font-weight:600;color:var(--head);font-size:15px}
  .chap-nav .next{text-align:right}

  .toplink{display:block;text-align:center;margin:3vh 0 0;color:var(--fg-dim);font-size:14px;cursor:pointer;background:none;border:none;width:100%;font-family:"Newsreader",serif}
  .toplink:hover{color:var(--gold)}

  @media (max-width:560px){
    body{font-size:18px}
    .topbar .bk-title{font-size:14px}
    main{padding:78px 20px 30px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* bookmarks */
  .bm-host{position:relative}
  .bm-flag{position:absolute;left:-30px;top:2px;width:24px;height:24px;border:none;background:none;cursor:pointer;
    opacity:0;transition:opacity .2s,transform .2s;color:var(--fg-dim);font-size:16px;line-height:1}
  .bm-host:hover .bm-flag{opacity:.55}
  .bm-flag:hover{opacity:1!important;transform:scale(1.18)}
  .bm-flag.on{opacity:1;color:var(--gold)}
  .bm-host.marked{box-shadow:inset 3px 0 0 var(--gold);padding-left:14px;margin-left:-14px;border-radius:2px}
  @media (max-width:760px){ .bm-flag{left:-4px;top:-22px} .bm-host.marked{padding-left:10px;margin-left:-10px} }

  .tabs{display:flex;gap:6px;padding:0 24px 12px}
  .tab{flex:1;background:none;border:1px solid var(--rule);color:var(--fg-dim);border-radius:5px;cursor:pointer;
    font-family:"Newsreader",serif;font-size:14px;padding:7px 0;transition:all .2s}
  .tab.active{color:var(--gold);border-color:var(--gold)}
  .bm-empty{padding:8px 24px;color:var(--fg-dim);font-style:italic;font-size:15px}
  .bm-item{display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;color:var(--fg);
    font-family:"Newsreader",serif;font-size:15px;line-height:1.4;padding:10px 24px;border-left:3px solid transparent;transition:background .2s}
  .bm-item:hover{background:color-mix(in srgb,var(--gold) 12%,transparent);border-left-color:var(--gold)}
  .bm-item .bm-ch{display:block;font-size:12px;color:var(--gold-soft);margin-bottom:2px}
  .bm-item .bm-x{float:right;color:var(--fg-dim);font-size:13px}
</style>
</head>
<body>
<canvas id="net"></canvas>
<div class="veil"></div>
<div id="progress"></div>

<div class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Оглавление">☰</button>
  <span class="bk-title">Бог, бесконечность и ты</span>
  <span class="spacer"></span>
  <button class="ctrl" id="fontBtn" title="Размер шрифта">A+</button>
  <button class="ctrl" id="themeBtn" title="Тема">◐</button>
</div>

<div class="overlay" id="overlay"></div>
<nav class="sidebar" id="sidebar">
  <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;font-size:0.7rem;opacity:0.7">
    <a href="materials.html" style="color:inherit;text-decoration:none">← Материя</a>
    <a href="petlya.html" style="color:inherit;text-decoration:none">Спираль</a>
    <a href="set.html" style="color:inherit;text-decoration:none">Сеть</a>
  </div>
  <h3>Навигация</h3>
  <div class="tabs">
    <button class="tab active" id="tabToc">Содержание</button>
    <button class="tab" id="tabBm">Закладки</button>
  </div>
  <div id="toc"></div>
  <div id="bmList" style="display:none"></div>
</nav>

<main id="main"></main>


<script src="./js/book-loader.js"></script>
<script>
(async ()=>{
const BOOK = await loadBook();

// bookmarks storage (объявляем рано, до restore)
let BM=[];
try{ BM=JSON.parse(localStorage.getItem('uc_bm')||'[]'); }catch(e){ BM=[]; }
let netStarted=false;
const mouseN={x:-9999,y:-9999};

// part blurbs (по заголовку)
const BLURBS = {
  "Увертюра. Приглашение":"Весь замысел в миниатюре: один детский вопрос — и путь, который приводит к тебе.",
  "Часть I. Теория":"Три тысячи лет вопроса «кто создал Бога» — и куда он привёл.",
  "Часть II. Приглашение к участию":"От большой картины — к тебе и твоему месту в ней.",
  "Приложение. Первоисточник":"Зерно, из которого выросла вся книга."
};

// ---- helpers ----
function runsToHTML(runs){
  return runs.map(r=>{
    let t=escapeHTML(r.t);
    if(r.b) t='<strong>'+t+'</strong>';
    if(r.i) t='<em>'+t+'</em>';
    return t;
  }).join('');
}
function escapeHTML(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function isEpigraph(it){ // первоисточник-эпиграф во front: строка, начинающаяся с — это cite
  return false;
}

// render one item to HTML
function itemHTML(it, ctx){
  if(it.kind==='callout'){
    let head=it.paras[0];
    let bodyParas=it.paras.slice(1);
    // если заголовок врезки выглядит как обычное предложение (длинный) — всё равно делаем title из первого
    let h='<div class="ctitle">'+escapeHTML(head.text)+'</div>';
    let body=bodyParas.map(p=>'<p>'+runsToHTML(p.runs)+'</p>').join('');
    if(bodyParas.length===0){ h='' ; body='<p>'+runsToHTML(head.runs)+'</p>'; }
    return '<div class="callout">'+h+body+'</div>';
  }
  if(it.kind==='table'){
    let rows=it.rows;
    let thead='<tr>'+rows[0].map(c=>'<th>'+escapeHTML(c)+'</th>').join('')+'</tr>';
    let tbody=rows.slice(1).map(r=>'<tr>'+r.map(c=>'<td>'+escapeHTML(c)+'</td>').join('')+'</tr>').join('');
    return '<div class="tbl-wrap"><table class="data">'+thead+tbody+'</table></div>';
  }
  // paragraph kinds
  const st=it.style;
  if(st==='Heading 3') return '<h3>'+escapeHTML(it.text)+'</h3>';
  if(st==='Heading 4') return '<h4>'+escapeHTML(it.text)+'</h4>';
  if(st==='List Paragraph'){
    return '<li>'+runsToHTML(it.runs)+'</li>';  // обёртку в ul/ol сделаем при сборке
  }
  // эпиграф: строки, где следующий — это "— ..."
  return '<p>'+runsToHTML(it.runs)+'</p>';
}

// сборка тела секции с группировкой списков
function renderItems(items, paneIdx){
  let html=''; let listBuf=[]; let idx=0;
  const flush=()=>{ if(listBuf.length){ html+='<ul class="b">'+listBuf.join('')+'</ul>'; listBuf=[]; } };
  for(const it of items){
    if(it.kind==='p' && it.style==='List Paragraph'){
      listBuf.push('<li>'+runsToHTML(it.runs)+'</li>');
    } else {
      flush();
      // обычные абзацы делаем «закладываемыми»; заголовки/врезки/таблицы — нет
      if(it.kind==='p' && (it.style==='Normal' || !it.style)){
        const bid=paneIdx+':'+idx;
        html+='<div class="bm-host" data-bm="'+bid+'">'+
              '<button class="bm-flag" data-bm="'+bid+'" title="Закладка">⚑</button>'+
              '<p>'+runsToHTML(it.runs)+'</p></div>';
      } else {
        html+=itemHTML(it);
      }
    }
    idx++;
  }
  flush();
  return html;
}

// ---- build panes & TOC ----
const main=document.getElementById('main');
const toc=document.getElementById('toc');
const navList=[]; // {title, level, pane}

// front matter pane (титул + предисловие соберём в pane 0 как часть Увертюры? — отдельная "обложка")
let frontHTML='';
{
  const f=BOOK.front;
  // f: ω, TITLE, subtitle, "Сборник...", эпиграф-строка, "— ..."
  const texts=f.filter(x=>x.kind==='p').map(x=>x.text);
  frontHTML+='<div style="text-align:center">';
  frontHTML+='<div style="font-family:Fraunces;font-size:64px;color:var(--gold);margin:6vh 0 10px">ω</div>';
  if(texts[1]) frontHTML+='<h1 class="part" style="margin:0">'+escapeHTML(texts[1])+'</h1>';
  if(texts[2]) frontHTML+='<div class="part-blurb" style="margin-top:14px">'+escapeHTML(texts[2])+'</div>';
  if(texts[3]) frontHTML+='<div style="color:var(--fg-dim);font-size:15px;letter-spacing:.06em">'+escapeHTML(texts[3])+'</div>';
  frontHTML+='</div>';
  // эпиграф
  const epi=f.find(x=>x.kind==='p' && x.text && !x.text.startsWith('—') && x.text.length>40 && x===f[4]);
  if(texts[4]) frontHTML+='<div class="epi" style="margin-top:5vh">'+escapeHTML(texts[4])+(texts[5]?'<cite>'+escapeHTML(texts[5].replace(/^—\s*/,''))+'</cite>':'')+'</div>';
}

// pane 0 = обложка
const paneInner=[];
paneInner.push(frontHTML);
navList.push({title:'Титул', level:0, pane:0});

BOOK.sections.forEach((sec)=>{
  const pidx=paneInner.length;
  let inner='';
  if(sec.level===1){
    inner+='<h1 class="part">'+escapeHTML(sec.title)+'</h1>';
    const bl=BLURBS[sec.title]; if(bl) inner+='<div class="part-blurb">'+escapeHTML(bl)+'</div>';
    inner+=renderItems(sec.items, pidx);
  }else{
    inner+='<h2 class="chap">'+escapeHTML(sec.title)+'</h2>';
    inner+=renderItems(sec.items, pidx);
  }
  paneInner.push(inner);
  navList.push({title:sec.title, level:sec.level, pane:pidx});
});

// chapter nav buttons
function navButtons(i){ return ""; }

// собираем финальные панели: содержимое + навигация, обёрнутые в .pane
main.innerHTML=paneInner.map((inner,i)=>
  '<div class="pane" data-i="'+i+'">'+inner+navButtons(i)+'</div>'
).join('');

// build TOC
toc.innerHTML=navList.map((n,i)=>{
  if(n.level===0) return '<button class="toc-item chap" data-pane="'+i+'">Обложка</button>';
  const cls=n.level===1?'toc-item part':'toc-item chap';
  return '<button class="'+cls+'" data-pane="'+i+'">'+escapeHTML(n.title)+'</button>';
}).join('');

// ---- navigation ----
let current=0;
const paneEls=()=>Array.from(document.querySelectorAll('.pane'));
function go(i){
  if(i<0||i>=navList.length) return;
  paneEls().forEach(el=>el.classList.remove('active'));
  const el=document.querySelector('.pane[data-i="'+i+'"]');
  el.classList.add('active');
  current=i;
  document.querySelectorAll('.toc-item').forEach(b=>b.classList.toggle('active', +b.dataset.pane===i));
  scrollTop();
  closeSidebar();
  try{localStorage.setItem('uc_pane', i);}catch(e){}
  updateProgress();
}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'});}
window.go=go;
window.scrollTop=scrollTop;
window.getCurrent=()=>current;

document.querySelectorAll('.toc-item').forEach(b=>{
  b.addEventListener('click',()=>go(+b.dataset.pane));
});

// ---- sidebar toggle ----
const sidebar=document.getElementById('sidebar'), overlay=document.getElementById('overlay');
function openSidebar(){sidebar.classList.add('open');overlay.classList.add('show');}
function closeSidebar(){sidebar.classList.remove('open');overlay.classList.remove('show');}
window.openSidebar=openSidebar;
window.closeSidebar=closeSidebar;
document.getElementById('menuBtn').addEventListener('click',openSidebar);
overlay.addEventListener('click',closeSidebar);

// ---- progress (within current pane scroll + chapter position) ----
function updateProgress(){
  const docH=document.documentElement.scrollHeight-window.innerHeight;
  const scrolled=docH>0?window.scrollY/docH:0;
  const chapFrac=navList.length>1?current/(navList.length-1):0;
  const within=scrolled/(navList.length-1||1);
  const pct=Math.min(100,Math.max(0,(chapFrac+within)*100));
  document.getElementById('progress').style.width=pct+'%';
}
window.addEventListener('scroll',updateProgress,{passive:true});

// ---- theme ----
const htmlEl=document.documentElement;
function setTheme(t){htmlEl.setAttribute('data-theme',t);try{localStorage.setItem('uc_theme',t);}catch(e){} if(t==='dark') startNet(); }
document.getElementById('themeBtn').addEventListener('click',()=>{
  setTheme(htmlEl.getAttribute('data-theme')==='dark'?'light':'dark');
});

// ---- font size ----
const SIZES=[18,20,22,24]; let sz=1;
document.getElementById('fontBtn').addEventListener('click',()=>{
  sz=(sz+1)%SIZES.length;
  document.body.style.setProperty('--fs',SIZES[sz]+'px');
  try{localStorage.setItem('uc_fs',sz);}catch(e){}
});

// ---- restore state ----
(function restore(){
  let t='dark'; try{t=localStorage.getItem('uc_theme')||'dark';}catch(e){}
  setTheme(t);
  try{const s=localStorage.getItem('uc_fs'); if(s!==null){sz=+s;document.body.style.setProperty('--fs',SIZES[sz]+'px');}}catch(e){}
  let p=0; try{p=+(localStorage.getItem('uc_pane')||0);}catch(e){}
  go(p>=0&&p<navList.length?p:0);
  applyBmMarks(); renderBmList();
})();

// keyboard arrows
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') go(current+1);
  if(e.key==='ArrowLeft') go(current-1);
});

// ---- bookmarks ----
function saveBM(){ try{localStorage.setItem('uc_bm',JSON.stringify(BM));}catch(e){} }
function bmFind(id){ return BM.findIndex(b=>b.id===id); }
function chapTitleOfPane(p){ const n=navList.find(x=>x.pane===p); return n?n.title:''; }

function applyBmMarks(){
  document.querySelectorAll('.bm-host').forEach(host=>{
    const id=host.dataset.bm;
    const on=bmFind(id)>=0;
    host.classList.toggle('marked',on);
    const f=host.querySelector('.bm-flag'); if(f) f.classList.toggle('on',on);
  });
}
function toggleBm(id){
  const host=document.querySelector('.bm-host[data-bm="'+CSS.escape(id)+'"]');
  const i=bmFind(id);
  if(i>=0){ BM.splice(i,1); }
  else{
    const pane=+id.split(':')[0];
    const txt=host?host.querySelector('p').textContent.slice(0,80):'';
    BM.push({id, pane, text:txt, chap:chapTitleOfPane(pane)});
  }
  saveBM(); applyBmMarks(); renderBmList();
}
function renderBmList(){
  const box=document.getElementById('bmList');
  if(!BM.length){ box.innerHTML='<div class="bm-empty">Пока нет закладок. Наведи на абзац и нажми ⚑.</div>'; return; }
  box.innerHTML=BM.map(b=>
    '<button class="bm-item" data-go="'+b.id+'">'+
      '<span class="bm-x" data-del="'+b.id+'">✕</span>'+
      '<span class="bm-ch">'+escapeHTML(b.chap)+'</span>'+
      escapeHTML(b.text)+'…</button>'
  ).join('');
  box.querySelectorAll('.bm-item').forEach(el=>{
    el.addEventListener('click',ev=>{
      if(ev.target.dataset.del){ const i=bmFind(ev.target.dataset.del); if(i>=0){BM.splice(i,1);saveBM();applyBmMarks();renderBmList();} return; }
      gotoBookmark(el.dataset.go);
    });
  });
}
function gotoBookmark(id){
  const pane=+id.split(':')[0];
  go(pane);
  setTimeout(()=>{
    const host=document.querySelector('.bm-host[data-bm="'+CSS.escape(id)+'"]');
    if(host){ host.scrollIntoView({behavior:'smooth',block:'center'});
      const oc=host.style.background;
      host.style.background='color-mix(in srgb,var(--gold) 22%,transparent)';
      setTimeout(()=>host.style.background=oc,1100);
    }
  },120);
}
// делегированный клик по флажкам
document.getElementById('main').addEventListener('click',ev=>{
  const f=ev.target.closest('.bm-flag');
  if(f){ ev.preventDefault(); toggleBm(f.dataset.bm); }
});
// вкладки сайдбара
const tabToc=document.getElementById('tabToc'), tabBm=document.getElementById('tabBm');
const tocBox=document.getElementById('toc'), bmBox=document.getElementById('bmList');
tabToc.addEventListener('click',()=>{tabToc.classList.add('active');tabBm.classList.remove('active');tocBox.style.display='';bmBox.style.display='none';});
tabBm.addEventListener('click',()=>{tabBm.classList.add('active');tabToc.classList.remove('active');bmBox.style.display='';tocBox.style.display='none';renderBmList();});

// ---- background network (dark only), like landing ----
addEventListener('mousemove',e=>{const dpr=Math.min(devicePixelRatio||1,2);mouseN.x=e.clientX*dpr;mouseN.y=e.clientY*dpr;});
addEventListener('mouseleave',()=>{mouseN.x=-9999;mouseN.y=-9999;});
function startNet(){
  if(netStarted) return; netStarted=true;
  const canvas=document.getElementById('net'); const ctx=canvas.getContext('2d');
  let W,H,DPR,nodes=[]; const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function resize(){
    DPR=Math.min(devicePixelRatio||1,2);
    W=canvas.width=innerWidth*DPR; H=canvas.height=innerHeight*DPR;
    canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px';
    const n=Math.round(innerWidth*innerHeight/26000); nodes=[];
    for(let i=0;i<n;i++) nodes.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.10*DPR,vy:(Math.random()-.5)*.10*DPR,r:(Math.random()*1.3+.5)*DPR});
  }
  resize(); addEventListener('resize',resize);
  const LINK=135*DPR, MOUSE=170*DPR;
  function frame(){
    if(htmlEl.getAttribute('data-theme')!=='dark'){ctx.clearRect(0,0,W,H);requestAnimationFrame(frame);return;}
    ctx.clearRect(0,0,W,H);
    for(const nd of nodes){
      nd.x+=nd.vx;nd.y+=nd.vy;
      if(nd.x<0||nd.x>W)nd.vx*=-1;if(nd.y<0||nd.y>H)nd.vy*=-1;
      const dx=mouseN.x-nd.x,dy=mouseN.y-nd.y,dm=Math.hypot(dx,dy);
      if(dm<MOUSE){nd.x+=dx/dm*.3*DPR;nd.y+=dy/dm*.3*DPR;}
    }
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i],b=nodes[j],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<LINK){
        const near=Math.min(Math.hypot(mouseN.x-a.x,mouseN.y-a.y),Math.hypot(mouseN.x-b.x,mouseN.y-b.y));
        const lit=near<MOUSE, base=1-d/LINK;
        ctx.strokeStyle=lit?'rgba(216,166,74,'+(base*.4).toFixed(3)+')':'rgba(170,185,200,'+(base*.13).toFixed(3)+')';
        ctx.lineWidth=(lit?1:.6)*DPR;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      }
    }
    for(const nd of nodes){
      const near=Math.hypot(mouseN.x-nd.x,mouseN.y-nd.y)<MOUSE;
      ctx.beginPath();ctx.fillStyle=near?'rgba(232,200,135,.9)':'rgba(205,198,182,.5)';
      ctx.arc(nd.x,nd.y,near?nd.r*1.6:nd.r,0,Math.PI*2);ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  if(!reduce) frame();
}

})();
</script>

<div id="nav-pad" style="position:fixed;right:24px;bottom:24px;z-index:9999;background:rgba(20,20,20,.15);border:1px solid rgba(255,255,255,.3);padding:6px;border-radius:12px;display:grid;grid-template-columns:36px 36px 36px;grid-template-rows:36px 36px 36px;gap:4px;touch-action:none;">
<button data-act="up" style="grid-column:2;grid-row:1">↑</button>
<button data-act="prev" style="grid-column:1;grid-row:2">←</button>
<button data-act="toc" style="grid-column:2;grid-row:2">☰</button>
<button data-act="next" style="grid-column:3;grid-row:2">→</button>
<button data-act="down" style="grid-column:2;grid-row:3">↓</button>
</div>
<script>
(function(){
const pad=document.getElementById('nav-pad');
const pos=JSON.parse(localStorage.getItem('unitycode-navpad')||'null');
if(pos){pad.style.left=pos.left;pad.style.top=pos.top;pad.style.right='auto';pad.style.bottom='auto';}

let hold=false,sx=0,sy=0,startX=0,startY=0,timer;
pad.addEventListener('pointerdown',e=>{
 timer=setTimeout(()=>{hold=true;sx=e.clientX;sy=e.clientY;startX=pad.offsetLeft;startY=pad.offsetTop;},400);
});
pad.addEventListener('pointermove',e=>{
 if(!hold) return;
 const x=Math.max(0,Math.min(window.innerWidth-pad.offsetWidth,startX+(e.clientX-sx)));
 const y=Math.max(0,Math.min(window.innerHeight-pad.offsetHeight,startY+(e.clientY-sy)));
 pad.style.left=x+'px'; pad.style.top=y+'px';
 pad.style.right='auto'; pad.style.bottom='auto';
});
pad.addEventListener('pointerup',()=>{
 clearTimeout(timer);
 if(hold){
   localStorage.setItem('unitycode-navpad',JSON.stringify({left:pad.style.left,top:pad.style.top}));
   hold=false;
 }
});
pad.addEventListener('click',e=>{
 const a=e.target.dataset.act;
 if(!a) return;
 const step=Math.round(window.innerHeight*0.82);
 const cur=window.getCurrent?window.getCurrent():0;
 // верх/вниз — прокрутка внутри выбранной главы
 if(a==='up') window.scrollBy({top:-step,behavior:'smooth'});
 if(a==='down') window.scrollBy({top:step,behavior:'smooth'});
 // влево/вправо — переход по главам
 if(a==='prev' && window.go) window.go(cur-1);
 if(a==='next' && window.go) window.go(cur+1);
 // центр — боковое меню (тоггл)
 if(a==='toc'){
   const sb=document.getElementById('sidebar');
   if(sb && sb.classList.contains('open')){ if(window.closeSidebar) window.closeSidebar(); }
   else if(window.openSidebar){ window.openSidebar(); }
 }
});
})();
</script>
