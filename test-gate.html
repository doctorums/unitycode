<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест привратника</title>
<style>
  body { background:#000; color:#0f8; font-family:monospace; padding:1.5rem; line-height:1.6; }
  textarea { width:100%; box-sizing:border-box; background:#0a0a0a; color:#fff; border:1px solid #333; font-family:monospace; padding:0.6rem; min-height:60px; }
  button { background:transparent; color:#0f8; border:1px solid #0f8; padding:0.8rem 1.5rem; font-family:monospace; font-size:1rem; margin:0.8rem 0; width:100%; }
  pre { white-space:pre-wrap; word-break:break-word; background:#0a0a0a; border:1px solid #333; padding:1rem; font-size:0.85rem; }
  .label { color:#888; font-size:0.75rem; margin:1rem 0 0.3rem; }
</style>
<div id="ts-box" style="position:fixed;bottom:8px;right:8px;"></div>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTs&render=explicit" async defer></script>
</head>
<body>
<h3>// ТЕСТ ПРИВРАТНИКА</h3>
<p style="color:#888;font-size:0.8rem">Шлёт шум в write-worker как кнопка «Вплести» и показывает сырой ответ, включая поле gate — что реально сделал привратник. ⚠️ Каждый «accept» реально пишет узел в базу — потом удали тестовые из Supabase.</p>

<textarea id="noise" placeholder="введи шум для теста...">фыыфаа</textarea>
<button onclick="runTest()">[ ОТПРАВИТЬ КАК ВПЛЕТЕНИЕ ]</button>

<div class="label">HTTP-СТАТУС:</div>
<pre id="status">—</pre>
<div class="label">СЫРОЙ ОТВЕТ (смотри поле gate):</div>
<pre id="raw">—</pre>

<script>
const WRITE_WORKER_URL = 'https://unitycode-write.sv2txxznjm.workers.dev/';
const TURNSTILE_SITEKEY = '0x4AAAAAADipuIhRBHuABO1Z';

let _tsId=null,_tsResolve=null;
window.onTs=function(){
  try{ _tsId=turnstile.render('#ts-box',{sitekey:TURNSTILE_SITEKEY,appearance:'interaction-only',execution:'execute',
    callback:t=>{if(_tsResolve){_tsResolve(t);_tsResolve=null;}},
    'error-callback':()=>{if(_tsResolve){_tsResolve('');_tsResolve=null;}}});}catch(e){}
};
function getTs(){return new Promise(r=>{ if(!_tsId){r('');return;} _tsResolve=r; try{turnstile.execute(_tsId);}catch(e){r('');} setTimeout(()=>{if(_tsResolve){_tsResolve('');_tsResolve=null;}},8000); });}

async function runTest(){
  const st=document.getElementById('status'), raw=document.getElementById('raw');
  st.textContent='...запрос...'; raw.textContent='';
  const noise=document.getElementById('noise').value;
  try{
    const ts=await getTs();
    const res=await fetch(WRITE_WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'node',token:'test-gate-token',turnstile:ts,raw_noise:noise,ai_interpretation:'тест привратника'})});
    st.textContent=res.status+' '+res.statusText;
    raw.textContent=await res.text();
  }catch(e){ st.textContent='СЕТЕВАЯ ОШИБКА'; raw.textContent=e.message; }
}
</script>
</body>
</html>
