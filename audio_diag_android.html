<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Диагностика звука v2 — без носителя</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background:#06060c; color:#a8a8c8; font-family:monospace;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:20px; gap:16px;
  }
  h1 { font-size:14px; color:#5555aa; text-align:center; }
  button {
    padding:20px; background:#1a1a40; border:2px solid #5555aa;
    border-radius:12px; color:#aaaaff; font-size:16px; width:100%; max-width:320px;
  }
  #log {
    width:100%; max-width:320px; background:#000; color:#0f8;
    font-size:15px; padding:10px; border-radius:8px; white-space:pre-wrap;
    line-height:2; min-height:300px; overflow-y:auto;
  }
</style>
</head>
<body>
<h1 style="font-size:16px; line-height:1.6;">v2 — БЕЗ тихого носителя.<br>Нажми, подожди 3 сек,<br>слушай.</h1>
<button id="btn" style="font-size:22px; padding:30px;">▶ НАЖАТЬ ЗДЕСЬ</button>
<div id="log">...</div>

<script>
const logEl = document.getElementById('log');
function log(msg){ logEl.textContent += msg + '\n'; logEl.scrollTop = logEl.scrollHeight; }

document.getElementById('btn').addEventListener('click', function(){
  logEl.textContent = '';
  // ВАЖНО: здесь нет startCarrier() / тихого <audio> вообще — только чистый Web Audio
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();
    const master = ctx.createGain();
    master.gain.value = 0.6;
    master.connect(ctx.destination);
    ctx.resume();
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = 440;
    osc.connect(master);
    osc.start();
    osc.stop(ctx.currentTime + 3);
    log('🔊 Без носителя — играет 3 сек. Слышишь?');
  } catch(e) {
    log('❌ ОШИБКА: ' + e.message);
  }
});
</script>
</body>
</html>
