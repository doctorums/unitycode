<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UnityCode — голос эссенции</title>
<style>
  :root { --accent: #00ff88; --bg: #020806; --panel: #04100e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 20px 16px 60px; background: var(--bg);
    color: rgba(230,255,240,0.9); font-family: 'Courier New', monospace; line-height: 1.5; }
  h1 { font-size: 15px; font-weight: normal; letter-spacing: 2px; color: rgba(0,255,136,0.75); margin: 0 0 4px; }
  .sub { font-size: 12px; color: rgba(230,255,240,0.45); margin: 0 0 20px; }
  input { width: 100%; background: var(--panel); color: rgba(230,255,240,0.9);
    border: 1px solid rgba(0,255,136,0.25); font-family: inherit; font-size: 14px;
    padding: 10px; margin-bottom: 12px; border-radius: 8px; }
  .row { display: flex; align-items: center; gap: 10px; border: 1px solid rgba(0,255,136,0.15);
    background: var(--panel); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .row button { background: rgba(0,255,136,0.08); border: 1px solid rgba(0,255,136,0.3);
    color: rgba(0,255,136,0.9); font-family: inherit; font-size: 16px; width: 42px; height: 42px;
    border-radius: 8px; cursor: pointer; flex-shrink: 0; }
  .row button:active { background: rgba(0,255,136,0.22); }
  .row .txt { flex: 1; font-size: 13px; }
  .row .meta { font-size: 10px; color: rgba(230,255,240,0.4); margin-top: 3px; }
  .diag { font-size: 11px; color: #f88; margin-top: 10px; word-break: break-word; }
</style>
</head>
<body>
<h1>// ГОЛОС ЭССЕНЦИИ</h1>
<p class="sub">Тон мысли → голос Сети. ermil (тёплый) · jane (холод/строгий) · нейтр. чередуются.</p>

<input id="custom" placeholder="своя эссенция (Enter — озвучить)">
<div id="list"></div>
<div class="diag" id="diag"></div>

<script>
  // ⚠️ ВСТАВЬ URL воркера unitycode-voice:
  const VOICE_URL = 'https://unitycode-voice.sv2txxznjm.workers.dev/';

  const SAMPLES = [
    'свежее сено пахнет надеждой',
    'радость встречи отозвалась в сети',
    'мысли тонут в тумане',
    'стоим на развилке без ответа',
    'молчание тоже звучит',
    'тонкая паутина держится крепкими нитями',
    'путь друг к другу через открытое сердце',
    'тоска по порядку прячется в разрушении',
    'answers sleep in the deep mind',
  ];

  let cur = null;
  function speak(text, metaEl) {
    document.getElementById('diag').textContent = '';
    if (cur) { try { cur.pause(); } catch(e){} }
    fetch(VOICE_URL + '?text=' + encodeURIComponent(text))
      .then(r => {
        const tone = r.headers.get('X-UC-Tone'), voice = r.headers.get('X-UC-Voice');
        if (metaEl && tone) metaEl.textContent = tone + ' · ' + voice;
        const ct = r.headers.get('Content-Type') || '';
        if (!ct.includes('audio')) return r.json().then(j => { throw new Error(j.detail || j.error); });
        return r.blob();
      })
      .then(b => { cur = new Audio(URL.createObjectURL(b)); cur.play(); })
      .catch(e => { document.getElementById('diag').textContent = String(e.message || e); });
  }

  const list = document.getElementById('list');
  SAMPLES.forEach(s => {
    const row = document.createElement('div'); row.className = 'row';
    const btn = document.createElement('button'); btn.textContent = '▶';
    const wrap = document.createElement('div'); wrap.className = 'txt';
    const t = document.createElement('div'); t.textContent = s;
    const m = document.createElement('div'); m.className = 'meta'; m.textContent = 'тон — по нажатию';
    wrap.appendChild(t); wrap.appendChild(m);
    btn.onclick = () => speak(s, m);
    row.appendChild(btn); row.appendChild(wrap); list.appendChild(row);
  });

  document.getElementById('custom').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.value.trim()) speak(e.target.value.trim(), null);
  });
</script>
</body>
</html>
