<script>
// ═══════════════════════════════════════════════════════
// ВЫХОД на Спирали — слово среди звёзд.
// Тот же принцип, что на лендинге: если есть «войти», должен
// быть и выход; видит его только вернувшийся.
// Здесь свой сценарий под эту страницу:
//   — место каждый раз случайное, но никогда поверх текста:
//     диалог растёт по ходу разговора, поэтому занятые места
//     пересчитываются перед каждым всплытием;
//   — вырастает из точки, размером с кнопки страницы;
//   — повисев, улетает вдаль, покачиваясь и разворачиваясь —
//     тем же движением, что строки вступления (recedeAway);
//   — уступает шуму: пока в поле есть текст или идёт отправка,
//     не показывается, а если человек начал писать — уходит сам.
// Ничего не стирается: диалог переживает уход (sessionStorage).
// Отладка: ?vyhod=now.
// ═══════════════════════════════════════════════════════
(function(){
  var force = false;
  try { force = new URLSearchParams(location.search).get('vyhod') === 'now'; } catch(e){}
  var hasTrace = false;
  try {
    hasTrace = !!localStorage.getItem('uc_token')
            || (parseInt(localStorage.getItem('uc_visits')||'0',10)||0) > 0;
  } catch(e){}
  if (!hasTrace && !force) return;

  var BASE_COLOR = 'rgba(170,215,255,0.5)';
  var leaving = false, visible = false, flying = false;

  var outer = document.createElement('div');
  outer.id = 'vyhod';
  // padding/margin — невидимый запас под палец: сама пилюля ~19 px высотой,
  // с запасом область касания выходит за 44 px, как просит iOS
  outer.style.cssText = 'position:fixed;left:0;top:0;z-index:40;opacity:0;pointer-events:none;cursor:pointer;padding:14px;margin:-14px;';
  var inner = document.createElement('span');
  // размер и типографика — как у кнопок страницы (.weave-btn), цвет свой
  inner.style.cssText = 'display:inline-block;padding:0.2rem 0.75rem;border-radius:999px;'
    + 'border:1px solid rgba(170,215,255,0.15);color:'+BASE_COLOR+';'
    + 'font-family:"Share Tech Mono",monospace;font-size:0.6rem;letter-spacing:0.15em;'
    + 'text-transform:uppercase;background:transparent;white-space:nowrap;'
    + 'transform-origin:50% 50%;will-change:transform,opacity;';
  // текст живёт отдельным слоем: рамка стоит, а он шевелится внутри неё
  var wig = document.createElement('style');
  wig.textContent = '@keyframes uc-vyhod-wiggle{'
    + '0%{transform:translate(0,0) rotate(0deg);}'
    + '17%{transform:translate(2.4px,-0.6px) rotate(0.5deg);}'
    + '34%{transform:translate(-1.6px,0.7px) rotate(-0.45deg);}'
    + '51%{transform:translate(2px,0.5px) rotate(0.25deg);}'
    + '68%{transform:translate(-2.3px,-0.4px) rotate(-0.6deg);}'
    + '85%{transform:translate(1.1px,0.6px) rotate(0.3deg);}'
    + '100%{transform:translate(0,0) rotate(0deg);}}';
  document.head.appendChild(wig);
  var label = document.createElement('span');
  label.style.cssText = 'display:inline-block;will-change:transform;'
    + 'animation:uc-vyhod-wiggle 6.5s ease-in-out infinite;';
  label.textContent = UC_I18N.t('index.exit');
  inner.appendChild(label);
  outer.appendChild(inner);
  document.body.appendChild(outer);

  // размер меряем один раз в полную величину — по нему ищем свободное место
  var box = inner.getBoundingClientRect();
  var BW = Math.ceil(box.width) || 70, BH = Math.ceil(box.height) || 20;
  inner.style.transform = 'scale(0.02)';

  // занятые места: шапка, поле ввода и всё, что сейчас написано на экране
  function occupied(){
    var out = [];
    document.querySelectorAll('header, .input-area, .sys-msg, .message, .weave-btn, #ts-box, .toast')
      .forEach(function(el){
        if (el === outer || outer.contains(el)) return;
        var r = el.getBoundingClientRect();
        if (r.width > 0 && r.height > 0 && r.bottom > 0 && r.top < viewport().h) out.push(r);
      });
    return out;
  }

  // Размер экрана — у body, а не у window.innerWidth/innerHeight: на iOS они
  // отдают значение до схлопывания адресной строки. Ровно та же причина
  // разобрана выше в комментарии к канвасу звёзд.
  function viewport(){ return { w: document.body.clientWidth, h: document.body.clientHeight }; }

  // вырезы экрана (чёлка, домашняя полоса)
  function insets(){
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;'
      + 'padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);'
      + 'padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);';
    document.body.appendChild(d);
    var cs = getComputedStyle(d);
    var o = { t:parseFloat(cs.paddingTop)||0, b:parseFloat(cs.paddingBottom)||0,
              l:parseFloat(cs.paddingLeft)||0, r:parseFloat(cs.paddingRight)||0 };
    if (d.parentNode) d.parentNode.removeChild(d);
    return o;
  }

  // хаотично — но мимо текста; если свободного места нет, переждём
  function findSpot(pad){
    var rects = occupied(), m = 18, vp = viewport(), ins = insets();
    var minX = ins.l + m, minY = ins.t + m;
    var maxX = Math.max(minX, vp.w - ins.r - BW - m);
    var maxY = Math.max(minY, vp.h - ins.b - BH - m);
    for (var i = 0; i < 60; i++){
      var x = minX + Math.random()*(maxX - minX);
      var y = minY + Math.random()*(maxY - minY);
      var free = true;
      for (var j = 0; j < rects.length; j++){
        var r = rects[j];
        if (x < r.right + pad && x + BW > r.left - pad &&
            y < r.bottom + pad && y + BH > r.top  - pad){ free = false; break; }
      }
      if (free) return {x:x, y:y};
    }
    return null;
  }

  // пока человек пишет или ждёт отклик — выхода нет, шум важнее
  function busy(){
    try {
      var ta = document.getElementById('userInput');
      if (ta && ta.value.trim()) return true;
      // поле в фокусе — на телефоне поднята клавиатура и экран уже другой
      if (ta && document.activeElement === ta) return true;
    } catch(e){}
    try { if (isLoading) return true; } catch(e){}
    return false;
  }

  // место выбиралось под ту картину, что была на экране. Диалог прокрутили,
  // пришёл отклик, повернули телефон — под словом мог оказаться текст.
  function overlapsNow(){
    var a = inner.getBoundingClientRect();
    if (!a.width) return false;
    var rects = occupied();
    for (var i = 0; i < rects.length; i++){
      var r = rects[i];
      if (a.left < r.right && a.right > r.left && a.top < r.bottom && a.bottom > r.top) return true;
    }
    return false;
  }

  function surface(){
    if (leaving) return;
    if (busy()) { setTimeout(surface, 4000); return; }
    // сперва с просторным запасом; если диалог заполнил экран — соглашаемся
    // на щель между сообщениями, но поверх текста не встаём никогда
    var spot = findSpot(18) || findSpot(5);
    if (!spot) { setTimeout(surface, 5000); return; } // места нет вовсе — ждём
    outer.style.left = spot.x.toFixed(1) + 'px';
    outer.style.top  = spot.y.toFixed(1) + 'px';
    // вырастает из точки — медленно, с замедлением к концу
    inner.style.transition = 'none';
    inner.style.transform = 'scale(0.02)';
    inner.style.opacity = '0';
    outer.style.opacity = '1';
    requestAnimationFrame(function(){
      inner.style.transition = 'transform 2.4s cubic-bezier(0.16,0.84,0.3,1), opacity 1.6s ease';
      inner.style.transform = 'scale(1)';
      inner.style.opacity = '1';
    });
    visible = true; flying = false;
    setTimeout(function(){ outer.style.pointerEvents = 'all'; }, 2400);
    setTimeout(function(){ if (visible && !flying) flyAway(); }, 2400 + 12000 + Math.random()*6000);
  }

  // Куда уходить. Просто «вверх» на забитом текстом телефоне означает
  // «сквозь текст», поэтому щупаем стороны: в каждую отмеряем, докуда
  // можно уйти, не задев занятое, и выбираем самую свободную. Небольшая
  // прибавка вверх сохраняет прежний характер, когда сверху есть простор.
  function freeWay(){
    var a = inner.getBoundingClientRect();
    var cx = a.left + a.width/2, cy = a.top + a.height/2;
    var rects = occupied(), vp = viewport(), ins = insets();
    var ways = [], N = 16, MAXD = 190;
    // ведём не точку, а саму рамку слова — иначе оно задевает текст краями.
    // Слово по пути сжимается, поэтому меряем ужатой на треть коробкой.
    var hw = a.width*0.34, hh = a.height*0.34;
    for (var k = 0; k < N; k++){
      var ang = (k / N) * Math.PI * 2;
      var ux = Math.cos(ang), uy = Math.sin(ang), d = 0;
      for (var s = 8; s <= MAXD; s += 8){
        var px = cx + ux*s, py = cy + uy*s;
        var l = px-hw, rr = px+hw, t = py-hh, bo = py+hh;
        if (l < ins.l || rr > vp.w - ins.r || t < ins.t || bo > vp.h - ins.b){ d = s; break; }
        var blocked = false;
        for (var j = 0; j < rects.length; j++){
          var r = rects[j];
          if (l < r.right && rr > r.left && t < r.bottom && bo > r.top){ blocked = true; break; }
        }
        if (blocked) break;
        d = s;
      }
      ways.push({ ux:ux, uy:uy, d:d, score: d + (uy < 0 ? 15 : 0) });
    }
    ways.sort(function(p, q2){ return q2.score - p.score; });
    // из трёх самых свободных — случайная, чтобы улёт не стал предсказуемым
    var pick = ways[Math.floor(Math.random() * Math.min(3, ways.length))];
    // дальше найденного простора не толкаем: если щель узкая, слово просто
    // растворится в ней, не полезет сквозь текст
    return { ux: pick.ux, uy: pick.uy, dist: Math.max(30, Math.min(150, pick.d)) };
  }

  // улетает вдаль, покачиваясь и разворачиваясь — движение строк вступления
  function flyAway(){
    if (leaving || flying) return;
    flying = true;
    outer.style.pointerEvents = 'none';
    var DURR = 2600, s0 = null, dir = Math.random() < 0.5 ? -1 : 1;
    var way = freeWay();
    var fadeAt = way.dist < 70 ? 0.12 : 0.6;
    inner.style.transition = 'none';
    function step(ts){
      if (leaving) return;
      if (!s0) s0 = ts;
      var q = Math.min((ts - s0)/DURR, 1);
      var ease = 1 - Math.pow(1 - q, 2);
      var scale = Math.max(0.001, 1 - 0.88*ease);        // уходит в точку
      var tx = way.ux * way.dist * ease;                  // уплывает туда, где просторно
      var ty = way.uy * way.dist * ease;
      var sway  = Math.sin(q*Math.PI*4) * 9 * (1-q);      // качание затухает
      var spin  = dir * 26 * ease;                        // и разворачивается
      // в тесноте гаснет раньше — успевает уйти, пока не дошёл до текста
      var op    = q < fadeAt ? 1 : Math.max(0, 1 - (q-fadeAt)/(1-fadeAt));
      inner.style.transform = 'translate('+tx.toFixed(1)+'px,'+ty.toFixed(1)+'px) scale('+scale.toFixed(3)+') rotate('+(sway+spin).toFixed(2)+'deg)';
      inner.style.opacity = op.toFixed(3);
      if (q < 1) requestAnimationFrame(step);
      else {
        visible = false;
        outer.style.opacity = '0';
        setTimeout(surface, 9000 + Math.random()*8000); // вне поля зрения ~9–17 с
      }
    }
    requestAnimationFrame(step);
  }

  // если человек начал писать или текст наехал на слово — оно тихо уходит
  setInterval(function(){
    if (visible && !flying && !leaving && (busy() || overlapsNow())) flyAway();
  }, 800);

  // первое появление ждёт, пока договорит вступление: слово выходит через
  // пару секунд после того, как улетела последняя строка (в этот момент
  // #introMsg убирают из DOM). Если вступления нет — обычная задержка.
  (function firstSurface(){
    if (force) { setTimeout(surface, 700); return; }
    if (!document.getElementById('introMsg')) {
      setTimeout(surface, 4000 + Math.random()*3000);
      return;
    }
    var iv = setInterval(function(){
      if (leaving) { clearInterval(iv); return; }
      if (!document.getElementById('introMsg')) {
        clearInterval(iv);
        setTimeout(surface, 2000 + Math.random()*900);
      }
    }, 300);
  })();

  // ── уход: ничего не стирается, диалог переживёт возвращение
  function leave(e){
    if (e) e.preventDefault();
    if (leaving) return;
    leaving = true;
    try { if (window.UCAudio && UCAudio.fx) UCAudio.fx('page'); } catch(_e){}
    var veil = document.createElement('div');
    veil.style.cssText = 'position:fixed;inset:0;z-index:9000;background:#02060c;opacity:0;transition:opacity 5s ease;';
    document.body.appendChild(veil);
    requestAnimationFrame(function(){ veil.style.opacity = '1'; });
    ['header','.chat-container','.input-area'].forEach(function(sel){
      var el2 = document.querySelector(sel);
      if (el2){ el2.style.transition = 'opacity 4s ease'; el2.style.opacity = '0'; }
    });
    inner.style.transition = 'opacity 3s ease, transform 3s ease';
    inner.style.opacity = '0';
    setTimeout(function(){ if (window.UCDoor) UCDoor.open(); }, 5200);
  }
  outer.addEventListener('click', leave);
  outer.addEventListener('touchend', leave);
})();
</script>
</body>
</html>
