<!-- Open Graph — превью ссылки в мессенджерах и соцсетях. Без этих тегов

     для проекта, который расходится от человека к человеку, это главная
     поверхность первого контакта.
     Теги статичные и только по-русски: парсер мессенджера забирает разметку

     GitHub Pages некому. Пять языков этим не покрываются — это отдельная
     задача про отдельные URL.
     og:image — абсолютным адресом: относительный путь парсеры не разрешают,
     превью осталось бы без картинки. -->

<style>
body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none; animation: fadeIn 3s ease forwards; }
/* Блокирует только pinch-zoom (масштабирование), не трогает обычный скролл/тач.
   Применяется только на Android через JS-детекцию ниже — iOS не затрагивается. */
body.android-no-zoom { touch-action: pan-x pan-y; }
#sky { position:fixed; inset:0; z-index:0; display:block; pointer-events:none; touch-action:none; }
@keyframes fadeIn {
0% { opacity: 0; filter: brightness(3) saturate(0); }
20% { opacity: 0.4; filter: brightness(4) saturate(0); }
40% { opacity: 0.6; filter: brightness(2) saturate(0.2); }
70% { opacity: 0.85; filter: brightness(1.3) saturate(0.6); }
100% { opacity: 1; filter: none; }
}
header { flex-shrink: 0; position: relative; }
/* ═══════════════════════════════
ЧАТ
═══════════════════════════════ */
.chat-container {
flex: 1; overflow-y: auto; padding: 2rem;
position: relative; z-index: 5;
-webkit-overflow-scrolling: touch;
}
.sys-msg { border: none; padding: 1.5rem; margin-bottom: 2rem; background: none; transform-origin: left center; }
.sys-tag { font-size: 0.55rem; color: var(--accent); letter-spacing: 0.2em; margin-bottom: 0.8rem; }
.sys-text { font-size: 0.8rem; line-height: 1.8; color: rgba(255,255,255,0.5); }
/* Стабильный композитный слой для строк вступления: без него Safari при
   старте transform оставляет «призрак» исходной отрисовки (строка будто
   раздваивается — оригинал стоит, копия улетает). */
.sys-line { -webkit-backface-visibility: hidden; backface-visibility: hidden; }
/* tap-to-dismiss: вступление можно убрать тапом (в дополнение к уходу при
   отправке шума). */
#introMsg { cursor: pointer; }
/* Вступление на ВСЕХ экранах (десктоп, планшеты, смартфоны — портрет и
   ландшафт) выезжает к центру по золотому сечению (центр блока ~38.2%
   высоты) с горизонтальным въездом. Интро — статичный текст, который
   убирается тапом или уходит при отправке шума, поэтому центрирование не
   конфликтует с клавиатурой (она в этот момент не открыта). */
.intro-wrap {
  display: block;
  position: fixed;
  top: 38.2%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 60; width: min(90vw, 32rem); max-width: 90vw;
  animation: intro-drive-center 1.1s cubic-bezier(0.16,0.84,0.3,1) both;
}
.intro-wrap #introMsg { margin: 0; box-sizing: border-box; width: 100%; }
@keyframes intro-drive-center {
  from { opacity: 0; transform: translate(-50%, -50%) translateX(-14vw); }
  to   { opacity: 1; transform: translate(-50%, -50%) translateX(0); }
}
.message { margin-bottom: 1.6rem; animation: msg-in 0.5s ease forwards; display: flex; }
@keyframes msg-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.message.user { justify-content: flex-end; }
.message.ai { justify-content: center; }
.message-body {
font-size: 0.9rem; line-height: 1.7;
max-width: 78%;
/* ФИКС 16.07: у .memory .message-body ниже это свойство уже стояло,
   а у обычных живых сообщений — нет. Без него длинное слово без пробелов
   (составное, заимствование, дефис) не переносится, а вылезает за
   границу контейнера — «не помещается на экране» на узких телефонах. */
overflow-wrap: break-word; word-break: break-word;
}
.message.user .message-body { color: var(--accent); text-align: right; opacity: 0.7; font-size: 0.8rem; max-width: 60%; }
.message.ai .message-body { color: rgba(235,240,255,0.95); font-size: 1.4rem; text-align: center; max-width: 85%; line-height: 1.5; }
.stream-cursor {
display: inline-block; width: 6px; height: 12px;
background: var(--accent2); vertical-align: middle;
animation: blink 0.7s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.weave-btn {
display: inline-block; margin-top: 0.4rem; margin-left: 1.4rem;
padding: 0.2rem 0.5rem;
border: 1px solid rgba(255,51,102,0.3);
color: rgba(255,51,102,0.7);
font-family: 'Share Tech Mono', monospace;
font-size: 0.6rem; letter-spacing: 0.15em;
cursor: pointer; background: transparent;
transition: border-color 0.2s, color 0.2s, background 0.2s;
text-transform: uppercase;
animation: btn-sway 4s ease-in-out infinite;
transform-origin: left center;
width: auto; max-width: fit-content;
}
@keyframes btn-sway {
0%,100% { transform: translateX(0) rotate(0deg); }
30% { transform: translateX(6px) rotate(0.6deg); }
70% { transform: translateX(-4px) rotate(-0.4deg); }
}
/* Переход Спираль → Сеть: после исхода вплетения — просто текст со
   стрелкой, без рамки/фона. Стрелка — чистый CSS-треугольник рамками
   (не clip-path, не символ), рендерится одинаково везде. Покачивание
   вправо на всём элементе усиливает направленный жест. */
.weave-advance {
border: none;
background: none;
position: relative;
padding: 0.2rem 1.1rem 0.2rem 0;
animation: advance-nudge 1.3s ease-in-out infinite;
}
.weave-advance::after {
content: '';
position: absolute;
right: 0.15rem; top: 50%;
width: 0; height: 0;
transform: translateY(-50%);
border-top: 4px solid transparent;
border-bottom: 4px solid transparent;
border-left: 6px solid currentColor;
}
@keyframes advance-nudge {
0%,100% { transform: translateX(0); }
50% { transform: translateX(7px); }
}
.weave-btn:hover:not(:disabled) { border-color: var(--accent2); color: var(--accent2); background: rgba(255,51,102,0.05); }
.weave-btn:disabled { opacity: 0.5; cursor: default; }

/* Всплывающее окошко (тост) при слабом соединении: не встраивается в поток
   сообщения (не рвёт вёрстку в строку), а висит отдельно снизу по центру,
   соразмерно экрану. Убирается автоматически, когда шум подтверждён. */
.uc-toast {
position: fixed;
left: 50%; bottom: 1.4rem;
transform: translateX(-50%);
max-width: min(90vw, 30rem);
box-sizing: border-box;
padding: 0.7rem 1rem;
background: rgba(10,14,20,0.94);
border: 1px solid rgba(120,200,255,0.25);
border-radius: 8px;
-webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
box-shadow: 0 6px 24px rgba(0,0,0,0.45);
z-index: 200;
font-family: 'Share Tech Mono', monospace;
font-size: 0.62rem; line-height: 1.6; letter-spacing: 0.04em;
color: rgba(255,255,255,0.72); text-align: left;
animation: uc-toast-in 0.35s ease;
}
@keyframes uc-toast-in {
from { opacity: 0; transform: translateX(-50%) translateY(12px); }
to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.uc-toast a {
display: inline-block; margin-top: 0.4rem;
color: rgba(120,200,255,0.9); text-decoration: underline;
}

/* ═══════════════════════════════
ВВОД
═══════════════════════════════ */
.input-area {
padding: 1rem 2rem 1.5rem;
background: rgba(0,0,0,0.95);
position: relative; z-index: 50; flex-shrink: 0;
}
.input-area::before {
content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
background: var(--border);
animation: line-flicker 8.3s steps(1, end) infinite;
}
@keyframes line-flicker {
0% { opacity: 0.7; } 4% { opacity: 0.7; } 5% { opacity: 0.05; } 7% { opacity: 0.05; }
8% { opacity: 0.9; } 19% { opacity: 0.9; } 20% { opacity: 0.1; } 21% { opacity: 0.8; }
33% { opacity: 0.8; } 34% { opacity: 0; } 38% { opacity: 0; } 39% { opacity: 0.6; }
40% { opacity: 0.95; } 41% { opacity: 0.3; } 42% { opacity: 0.85; } 55% { opacity: 0.85; }
56% { opacity: 0.05; } 61% { opacity: 0.05; } 62% { opacity: 0.7; } 73% { opacity: 0.7; }
74% { opacity: 1; } 75% { opacity: 0.15; } 76% { opacity: 0.9; } 88% { opacity: 0.9; }
89% { opacity: 0; } 93% { opacity: 0; } 94% { opacity: 0.6; } 100% { opacity: 0.7; }
}
.input-row { display: flex; gap: 1rem; align-items: flex-end; }
.input-wrapper { flex: 1; min-width: 0; }
.input-label { font-size: 0.55rem; color: var(--dim); letter-spacing: 0.15em; margin-bottom: 0.4rem; display: block; position: relative; height: 1.2em; white-space: nowrap; }
.marquee-wrap { overflow: hidden; width: 100%; height: 100%; }
.input-label .marquee-text { display: inline-block; animation: marquee-label 18s linear infinite; padding-right: 6rem; text-shadow: 0 1px 3px rgba(0,0,0,0.7); }
@keyframes marquee-label { 0% { transform: translateX(var(--text-start, 65vw)); } 100% { transform: translateX(-100%); } }
/* ФИКС 16.07: была position:fixed с координатами от viewport — на iOS при
   открытой клавиатуре Safari НЕ сжимает layout (interactive-widget он не
   поддерживает, это Chrome-фича), а скроллит страницу, и fixed-элементы
   визуально уезжают в середину экрана. Теперь звезда absolute внутри
   .input-label (он position:relative) — прибита к самой строке и едет
   вместе с ней при любом поведении клавиатуры/скролла. */
.star-pulse { position: absolute; opacity: 0; font-size: 0.75rem; color: rgba(200,220,255,0.9); z-index: 200; pointer-events: none; }
@keyframes marquee-star-fx { 0% { transform: translateX(0); } 100% { transform: translateX(-200vw); } }
@keyframes star-blink { 0%,100% { opacity: 0.4; } 3% { opacity: 1; } 17% { opacity: 1; } }
textarea {
width: 100%; box-sizing: border-box;
background: rgba(255,255,255,0.03);
border: 1px solid var(--border);
color: var(--white);
font-family: 'Share Tech Mono', monospace;
font-size: 0.8rem; padding: 1.1rem 1rem 0.6rem;
outline: none; resize: none;
min-height: 60px; max-height: 140px;
line-height: 1.6; transition: border-color 0.2s;
}
textarea:focus { border-color: rgba(0,255,136,0.4); }
textarea::placeholder { color: var(--dim); text-align: center; }
textarea:placeholder-shown { animation: ph-shimmer 4.5s ease-in-out infinite; }
@keyframes ph-shimmer { 0%,100% { opacity: 0.75; } 50% { opacity: 1; } }
textarea:focus { animation: none; }
.send-btn {
padding: 0.8rem 1.5rem; height: 60px; flex-shrink: 0;
border: 1px solid var(--accent); color: var(--accent);
border-radius: 10px;
font-family: 'Share Tech Mono', monospace;
font-size: 0.7rem; letter-spacing: 0.15em;
cursor: pointer; background: transparent;
transition: background 0.2s, color 0.2s;
text-transform: uppercase; white-space: nowrap;
}
.send-btn:hover:not(:disabled) { background: var(--accent); color: var(--black); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.char-count { font-size: 0.55rem; color: var(--dim); text-align: right; margin-top: 0.3rem; }

/* ═══════════════════════════════
МОБИЛКА
═══════════════════════════════ */
/* Кнопка-иконка для мобиле (скрыта на десктопе) */
.send-btn-icon {
display: none;
width: 44px; height: 44px; flex-shrink: 0;
border: 1px solid var(--accent); color: var(--accent);
border-radius: 10px;
background: transparent; cursor: pointer;
font-size: 1.1rem; align-items: center; justify-content: center;
transition: background 0.2s, color 0.2s;
-webkit-tap-highlight-color: transparent;
}
.send-btn-icon:active { background: var(--accent); color: var(--black); }
.send-btn-icon:disabled { opacity: 0.4; }

@media (max-width: 600px) {

/* Чат */
.chat-container { padding: 0.8rem 0.9rem; }
.sys-msg { padding: 1rem; margin-bottom: 1.2rem; }
.sys-text { font-size: 0.72rem; line-height: 1.6; }
.message.ai .message-body { font-size: 1.2rem; } .message.user .message-body { font-size: 0.78rem; }

/* Зона ввода — прижата ко дну, учитывает safe-area (iPhone notch) */
.input-area {
padding: 0.7rem 0.9rem;
padding-bottom: calc(0.7rem + env(safe-area-inset-bottom, 0px));
}

/* Textarea — минимум 16px чтобы iOS не зумил при фокусе */
textarea {
font-size: 16px;
min-height: 44px;
max-height: 110px;
padding: 0.6rem 0.8rem;
}

/* Скрываем текстовую кнопку, показываем иконку */
.send-btn { display: none; }
.send-btn-icon { display: flex; }

/* Строка ввода: textarea занимает всё, иконка справа */
.input-row { gap: 0.6rem; align-items: flex-end; }

.input-label { font-size: 0.5rem; }
.char-count { font-size: 0.5rem; }
}

/* Очень маленькие экраны */
@media (max-width: 380px) {
.chat-container { padding: 0.6rem; }
.input-area { padding: 0.5rem 0.6rem; padding-bottom: calc(0.5rem + env(safe-area-inset-bottom, 0px)); }
.message.ai .message-body { font-size: 1.1rem; } .message.user .message-body { font-size: 0.74rem; }
}
/* ВОСПОМИНАНИЯ — восстановленный диалог, живой, приглушённый */
.memory { opacity: 0.7; padding-top: 3rem; will-change: transform, opacity, filter; }
.memory .message-body { color: rgba(210,225,245,0.85); font-size: 1.6rem; text-align: center; max-width: 75%; line-height: 1.5; word-break: break-word; background: none !important; border: none !important; padding: 0 !important; box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
.memory.user .message-body { color: rgba(0,255,136,0.82); font-size: 2.2rem; font-family: 'Kalam', cursive; letter-spacing: 0.01em; line-height: 1.35; white-space: normal; word-break: break-word; max-width: 60%; }

/* шум-воспоминание: медленный диагональный маятник справа-сверху → вниз-влево */
.memory.user { position: relative; z-index: 5; }
@keyframes memh-diag1 { 0%,100% { transform: translate(0vw, 0px); opacity:0.75; } 50% { transform: translate(-22vw, 55px); opacity:0.75; } }
.memh-rl { animation: memh-diag1 80s ease-in-out infinite; }
@keyframes memh-diag2 { 0%,100% { transform: translate(0vw, 0px); opacity:0.75; } 50% { transform: translate(-18vw, 70px); opacity:0.75; } }
.memh-lr { animation: memh-diag2 90s ease-in-out infinite; }
@keyframes memh-diag3 { 0%,100% { transform: translate(0vw, 0px); opacity:0.75; } 50% { transform: translate(-28vw, 45px); opacity:0.75; } }
.memh-arc { animation: memh-diag3 70s ease-in-out infinite; }
@keyframes memh-diag4 { 0%,100% { transform: translate(0vw, 0px) rotate(0deg); opacity:0.75; } 50% { transform: translate(-20vw, 80px) rotate(-1deg); opacity:0.75; } }
.memh-tiltslide { animation: memh-diag4 85s ease-in-out infinite; }

@keyframes mem-breathe { 0%,100% { transform: scale(1) translateY(0); opacity:0.5; } 50% { transform: scale(1.04) translateY(-12px); opacity:0.75; } }
.mem-breathe { animation: mem-breathe 7s ease-in-out infinite; }

@keyframes mem-drift { 0%,100% { transform: translateX(0) translateY(0); } 33% { transform: translateX(30px) translateY(-15px); } 66% { transform: translateX(-25px) translateY(10px); } }
.mem-drift { animation: mem-drift 13s ease-in-out infinite; }

@keyframes mem-tilt { 0%,100% { transform: rotate(0deg) skewX(0deg) translateX(0); } 50% { transform: rotate(-2deg) skewX(3deg) translateX(20px); } }
.mem-tilt { animation: mem-tilt 9s ease-in-out infinite; }

@keyframes mem-wave { 0%,100% { transform: translateY(0) scaleX(1); } 25% { transform: translateY(-20px) scaleX(1.03); } 75% { transform: translateY(15px) scaleX(0.98); } }
.mem-wave { animation: mem-wave 11s ease-in-out infinite; }

@keyframes mem-blur { 0%,100% { filter: blur(0px); opacity:0.6; } 50% { filter: blur(1.6px); opacity:0.4; } }
.mem-blur { animation: mem-blur 8s ease-in-out infinite; }

@keyframes mem-sway { 0%,100% { transform: translateX(0) rotate(0deg) translateY(0); } 50% { transform: translateX(25px) rotate(1.5deg) translateY(-10px); } }
.mem-sway { animation: mem-sway 10s ease-in-out infinite; }

/* варианты УХОДА воспоминаний при новом вводе */
.memory.leaving { animation: none !important; pointer-events: none; }
@keyframes memout-dissolve { to { opacity: 0; filter: blur(8px); } }
.memory.leaving.out-dissolve { animation: memout-dissolve 1.1s ease forwards !important; }
@keyframes memout-up { to { opacity: 0; transform: translateY(-40px) scale(0.96); } }
.memory.leaving.out-up { animation: memout-up 1s ease forwards !important; }
@keyframes memout-shrink { to { opacity: 0; transform: scale(0.7) translateY(-10px); } }
.memory.leaving.out-shrink { animation: memout-shrink 1s ease forwards !important; }
@keyframes memout-side { to { opacity: 0; transform: translateX(60px) rotate(3deg); } }
.memory.leaving.out-side { animation: memout-side 1s ease forwards !important; }
@keyframes memout-fade { to { opacity: 0; } }
.memory.leaving.out-fade { animation: memout-fade 1.3s ease forwards !important; }
</style>
</head>

const WRITE_WORKER_URL = 'https://unitycode-write.sv2txxznjm.workers.dev/';
// ⚠️ ВСТАВЬ URL voice-воркера (unitycode-voice) после деплоя:

// Озвучка эссенции — голос Сети в момент, когда она расслышала шум.
// Работает «на лету»: voice-воркер синтезирует по тексту эссенции.

let _ucVoiceBusy = false;
// ФИКС 16.07: звук почти всегда молчал, хотя Яндекс синтез исправно
// платно отрабатывал (деньги списывались — TTS реально генерировался).
// Причина — `new Audio(blob).play()` подчиняется политике автоплея
// браузера: к моменту вызова прошли ДВА последовательных сетевых ответа
// (write-воркер → distill → voice-воркер → синтез) после клика, и на
// Safari (iPad) «жест» к этому времени уже почти наверняка протух —
// .play() тихо отклонялся, наш catch тихо гасил ошибку.
//
// Решение — играть через УЖЕ разблокированный Web Audio ctx из audio.js

// жестом (обычный тап по странице раньше — audio.js слушает click/touchend
// на document), не требует нового жеста на каждый последующий звук.
// Формат — ArrayBuffer, не Blob: ctx.decodeAudioData() ждёт именно его.
function ucSpeakEssence(text) {
  try {
    const t = String(text || '').trim();
    // ФИКС 27.08: четыре ранних выхода молчали вообще — ни в консоль, ни в
    // uc_voice_last. Голос пропадал, а Журнал показывал прошлый успех, и
    // разбор начинался с гадания «дошло ли до fetch вообще». Тот же урок,
    // что с essence (25.07) и с not_audio (14.08): у отказа должно быть имя.
    if (!t) { ucVoiceFail('пустая эссенция — озвучивать нечего'); return; }
    if (_ucVoiceBusy) { ucVoiceFail('занято: предыдущий голос ещё звучит'); return; }
    if (!VOICE_WORKER_URL || VOICE_WORKER_URL.indexOf('ЗАМЕНИ') !== -1) { ucVoiceFail('voice-воркер не настроен'); return; }
    if (!window.UCAudio || !window.UCAudio.speak) { ucVoiceFail('audio.js не загрузился'); return; }
    _ucVoiceBusy = true;
    // ФИКС 14.08: раньше bare fetch без ретраев — на LTE+VPN синтез уже
    // оплачен (Яндекс списывает при синтезе, не при доставке), а сама
    // передача аудио обрывалась отдельно и без права на пересдачу. Теперь
    // воркер кэширует готовое аудио по тексту (Cache API, детерминированный
    // голос/тон), так что повтор в течение суток не бьёт по Яндексу второй
    // раз — можно ретраить получение честно, тем же UCData.fetchRetry,
    // что и весь остальной проект на плохом канале.
    UCData.fetchRetry(VOICE_WORKER_URL + '?text=' + encodeURIComponent(t.slice(0, 200)))
      .then(r => {
        const ct = r.headers.get('Content-Type') || '';
        if (!ct.includes('audio')) {
          // Голос отваливался НЕМО: воркер при сбое SpeechKit отвечает JSON
          // с кодом 200, а здесь всё не-аудио просто выбрасывалось. Тот же
          // класс, что у пропавшей essence (фикс 25.07) — сбой без причины
          // стоит потом нескольких раундов гадания. Теперь причина остаётся.
          _ucVoiceBusy = false;
          r.text().then(body => ucVoiceFail('not_audio: ' + ct + ' | ' + body.slice(0, 200)))
                  .catch(() => ucVoiceFail('not_audio: ' + ct));
          return null;
        }
        return r.arrayBuffer();
      })
      .then(buf => {
        if (!buf) return;
        window.UCAudio.speak(buf).then(played => {
          if (played) ucVoiceOk();
          else {
            const why = (window.UCAudio.speakFail && window.UCAudio.speakFail()) || 'причина не названа';
            ucVoiceFail('не прозвучало: ' + why);
          }
        }).finally(() => { _ucVoiceBusy = false; });
      })
      .catch(e => { _ucVoiceBusy = false; ucVoiceFail('fetch: ' + String(e).slice(0, 150)); });
  } catch (e) { _ucVoiceBusy = false; ucVoiceFail('throw: ' + String(e).slice(0, 150)); }
}

// на устройстве, а не данные о человеке.
function ucVoiceFail(reason) {

const TURNSTILE_SITEKEY = '0x4AAAAAADipuIhRBHuABO1Z';

// Turnstile: одноразовый токен по требованию (interaction-only — обычно невидим)
let _tsId = null, _tsResolve = null;

// Показ/скрытие контейнера капчи. Прячем через visibility (не display:none —
// иначе Turnstile может не отработать). Виден только в момент проверки.
function setTsVisible(on){
  const box = document.getElementById('ts-box');
  if (box) box.style.visibility = on ? 'visible' : 'hidden';
}

window.onloadTurnstileCallback = function(){
  try {
    _tsId = turnstile.render('#ts-box', {
      sitekey: TURNSTILE_SITEKEY, appearance: 'interaction-only', execution: 'execute',
      callback: t => { setTsVisible(false); if(_tsResolve){ _tsResolve(t); _tsResolve = null; } },
      'error-callback': () => { setTsVisible(false); if(_tsResolve){ _tsResolve(''); _tsResolve = null; } },
    });
  } catch(e){}
  setTsVisible(false); // спрятан по умолчанию, пока проверка не нужна
};
// ФИКС 27.08: виджет Turnstile на странице ОДИН, и ячейка _tsResolve под
// его колбэк — тоже одна. Два одновременных запроса токена (кнопка «Вплести»
// и фоновая ucTrySyncQueue) затирали _tsResolve друг другу: тот, кого
// затёрли, терял свой колбэк и висел все 12 секунд страховки — отсюда
// «вплетает очень долго» на ровном месте. Ставим запросы в очередь: каждый
// дожидается своей execute и получает СВОЙ токен. Отдать один токен обоим
// нельзя — сервер гасит его при первой же проверке, второй получил бы отказ.
let _tsChain = Promise.resolve('');
function getTurnstileToken(){
  const next = _tsChain.then(getTurnstileTokenOnce, getTurnstileTokenOnce);
  _tsChain = next.catch(() => '');   // сбой одного не рвёт очередь следующим
  return next;
}

function getTurnstileTokenOnce(){
  return new Promise(resolve => {
    if (!window.turnstile || _tsId === null) { resolve(''); return; }
    let done = false;
    const finish = (val) => { if(done) return; done = true; setTsVisible(false); _tsResolve = null; resolve(val); };
    _tsResolve = (val) => finish(val);
    setTsVisible(true); // показываем на время проверки — вдруг нужен челлендж
    try { turnstile.reset(_tsId); } catch(e){}
    try { turnstile.execute(_tsId); } catch(e){ finish(''); }
    // Страховка: на нестабильном канале callback может не прийти — не вешаем UI
    setTimeout(() => { if(!done){ finish(''); } }, 12000);
  });
}

// ── ПРОГРЕВ ТОКЕНА ─────────────────────────────────────────────
// Раньше Turnstile запускался в момент нажатия «Вплести», и на медленном
// канале человек стоял у кнопки до 12 секунд, а потом мог получить отказ.
// Между откликом ИИ и нажатием есть естественная пауза: человек читает
// ответ. Токен берём в ней — к нажатию он уже в кармане, ожидание исчезает.
//
// Токен Turnstile ОДНОРАЗОВЫЙ: сервер гасит его при проверке. Поэтому
// взятый из кэша сразу оттуда убирается, а следом греется новый.
// Живёт он около пяти минут — держим запас и считаем протухшим раньше.
let _tsCached = '', _tsCachedAt = 0, _tsWarming = false;
const TS_TTL = 240000;   // 4 минуты при пяти реальных

function tsFresh(){
  return (_tsCached && (Date.now() - _tsCachedAt) < TS_TTL) ? _tsCached : '';
}

function prewarmTurnstile(){
  if (_tsWarming || tsFresh()) return;
  if (!window.turnstile || _tsId === null) return;
  _tsWarming = true;
  getTurnstileToken().then(t => {
    _tsWarming = false;
    if (t) { _tsCached = t; _tsCachedAt = Date.now(); }
  }).catch(() => { _tsWarming = false; });
}

// Забрать токен для отправки: сначала прогретый (и сразу его освободить),
// иначе — обычным путём, как было.
async function takeTurnstileToken(){
  const ready = tsFresh();
  if (ready) {
    _tsCached = ''; _tsCachedAt = 0;
    // ФИКС 27.08: здесь стоял немедленный прогрев следующего токена. На
    // обычном канале он невидим, но в приватном окне у Turnstile нет
    // репутации браузера (ни кук, ни истории), и КАЖДОЕ обращение
    // разворачивается в настоящий вопрос «человек ли ты». Выходило два
    // подряд на одно вплетение: один за дело, второй — впрок за токен,
    // который может вообще не понадобиться. Прогрев не потерян: он
    // остался там, где ему место — в finalizeAiMessage, в момент, когда
    // появилась новая кнопка «Вплести» и человек читает отклик.
    return ready;
  }
  return await getTurnstileToken();
}

function handleKey(e) {

function escHtml(s) {
if (!s) return '';
return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/\n/g,'<br>');
}

function addMessage(role, text, streaming = false) {
const div = document.createElement('div');
div.className = `message ${role}`;
const mbId = `mb-${Date.now()}-${Math.random().toString(36).slice(2,6)}`;
div.innerHTML = `
<div class="message-body" id="${mbId}">${escHtml(text)}${streaming ? '<span class="stream-cursor"></span>' : ''}</div>`;
chat().appendChild(div);
scrollBottom();
return { div, mbId };
}

function finalizeAiMessage(div, mbId, fullText, userNoise = '') {
const body = document.getElementById(mbId);
if (body) body.innerHTML = escHtml(fullText);
const weaveBtn = document.createElement('button');
weaveBtn.className = 'weave-btn';
weaveBtn.textContent = UC_I18N.t('petlya.weave');
weaveBtn.dataset.text = fullText.slice(0, 300);
weaveBtn.dataset.noise = userNoise.slice(0, 500);
weaveBtn.dataset.msgIndex = messages.length - 1; // отклик уже в messages (последний)
weaveBtn.dataset.idem = ensureIdem(messages.length - 1);
weaveBtn.onclick = function() { weaveIntoNet(this); };
div.appendChild(weaveBtn);
// кнопка появилась — человек читает отклик, а мы в этой паузе берём токен
prewarmTurnstile();
}

async function typeText(mbId, fullText, speed = 8) {
const body = document.getElementById(mbId);
if (!body) return;
for (let i = 0; i <= fullText.length; i++) {
await new Promise(r => setTimeout(r, speed));
body.innerHTML = escHtml(fullText.slice(0, i)) + '<span class="stream-cursor"></span>';
if (i % 20 === 0) scrollBottom();
}
}

// Восстановление диалога сессии — как «воспоминание» с живым эффектом

  if (!Array.isArray(saved) || !saved.length) return false;
  document.body.style.animation = 'none';
  document.body.style.opacity = '1';
  document.body.style.filter = 'none';
  messages = saved.slice();

  // Рисуем диалог сразу из sessionStorage, без сетевого ожидания — показ не зависит
  // от доступности Supabase (важно без VPN). «Уже вплетён?» определяем по локальному
  // флагу uc_woven_idx_ / m.woven, которые ставятся при клике «Вплести».

  var aiFx   = ['mem-breathe','mem-drift','mem-tilt','mem-wave','mem-blur','mem-sway'];
  var userFx = ['memh-rl','memh-lr','memh-arc','memh-tiltslide'];
  var prevUser = '';
  try { prevUser = sessionStorage.getItem('uc_petlya_userfx') || ''; } catch(e){}
  var userPool = userFx.filter(function(v){ return v !== prevUser; });
  var chosenUserFx = userPool[Math.floor(Math.random()*userPool.length)];
  try { sessionStorage.setItem('uc_petlya_userfx', chosenUserFx); } catch(e){}

  var lastAiFx = '';
  let lastUser = '';
  for (const m of saved) {
    const { div, mbId } = addMessage(m.role === 'user' ? 'user' : 'ai', m.content);
    if (m.role === 'user') {
      div.classList.add('memory', chosenUserFx);
      div.style.animationDelay = '0s';
      lastUser = m.content;
    } else {
      var pool = aiFx.filter(function(v){ return v !== lastAiFx; });
      var fx = pool[Math.floor(Math.random()*pool.length)];
      lastAiFx = fx;
      div.classList.add('memory', fx);
      div.style.animationDuration = (6 + Math.random()*5).toFixed(1) + 's';
      div.style.animationDelay = (Math.random()*4).toFixed(2) + 's';
      // перенос текста отклика — по три слова на строку если больше трёх слов
      const mb = div.querySelector('.message-body');
      if (mb) {
        const words = m.content.trim().split(/\s+/);
        if (words.length > 3) {
          const lines = [];
          for (let i = 0; i < words.length; i += 3) lines.push(words.slice(i, i+3).map(escHtml).join(' '));
          mb.innerHTML = lines.join('<br>');
        }
      }
      // кнопка — только если шум ещё не вплетён в Supabase
      const msgIdx = messages.indexOf(m);
      const alreadyWoven = m.woven ||
        (function(){ try { return localStorage.getItem('uc_woven_idx_' + msgIdx) === '1'; } catch(e){ return false; } })();
      if (!alreadyWoven) {
        const weaveBtn = document.createElement('button');
        weaveBtn.className = 'weave-btn';
        weaveBtn.textContent = UC_I18N.t('petlya.weave');
        weaveBtn.dataset.text = m.content.slice(0, 300);
        // fallback: если lastUser потерян (iOS выгрузил вкладку) — берём из localStorage
        const noiseForBtn = lastUser || (function(){ try {
          // ищем шум пользователя перед этим ai-сообщением по индексу
          const userIdx = msgIdx - 1;
          return localStorage.getItem('uc_noise_' + userIdx) || '';
        } catch(e){ return ''; } })();
        weaveBtn.dataset.noise = noiseForBtn.slice(0, 500);
        weaveBtn.dataset.msgIndex = msgIdx;
        weaveBtn.dataset.idem = ensureIdem(msgIdx);
        weaveBtn.onclick = function() { weaveIntoNet(this); };
        weaveBtn.style.animationDelay = (0.8 + Math.random()*1.5).toFixed(2) + 's';
        weaveBtn.style.display = 'inline-block';
        weaveBtn.style.width = 'auto';
        weaveBtn.style.alignSelf = 'flex-start';
        div.appendChild(weaveBtn);
        prewarmTurnstile();   // восстановленный диалог: кнопка снова живая
      }
    }
  }
  scrollBottom();
  return true;
}

// Добавляет сообщение в историю с триммингом
function pushMessage(role, content) {
messages.push({ role, content });
if (messages.length > MESSAGES_MAX) {
messages = messages.slice(-MESSAGES_MAX);
}
try { sessionStorage.setItem('uc_petlya_dialog', JSON.stringify(messages)); } catch(e){}
}

let introHidden = false;
function hideIntro() {
  if (introHidden) return;
  introHidden = true;
  const intro = document.getElementById('introMsg');
  if (!intro) return;
  intro.style.transition = 'opacity 0.8s ease, transform 0.8s ease, margin 0.8s ease, max-height 0.8s ease';
  intro.style.overflow = 'hidden';
  intro.style.opacity = '0';
  intro.style.transform = 'translateY(-10px)';
  intro.style.maxHeight = '0';
  intro.style.marginBottom = '0';
  intro.style.padding = '0';

// воспоминания уходят при новом вводе — случайным способом, не повторяя прошлый
let memoriesDismissed = false;
function dismissMemories() {
  if (memoriesDismissed) return;
  const mems = Array.from(document.querySelectorAll('.memory'));
  if (!mems.length) return;          // воспоминаний нет — это обычный активный диалог, не трогаем
  memoriesDismissed = true;
  // старый диалог прожит — стираем из памяти, дальше пишется только новый
  messages = [];
  try { sessionStorage.removeItem('uc_petlya_dialog'); } catch(e){}
  var outs = ['out-dissolve','out-up','out-shrink','out-side','out-fade'];
  var prev = '';
  try { prev = sessionStorage.getItem('uc_petlya_memout') || ''; } catch(e){}
  var pool = outs.filter(function(o){ return o !== prev; });
  var out = pool[Math.floor(Math.random()*pool.length)];
  try { sessionStorage.setItem('uc_petlya_memout', out); } catch(e){}
  mems.forEach(function(el, i){
    el.style.position = 'absolute';    // выбить из потока — новый шум не смещается
    el.style.animationDelay = (i * 0.08).toFixed(2) + 's';
    el.classList.add('leaving', out);
    setTimeout(function(){ if (el.parentNode) el.remove(); }, 1500 + i*80);
  });
}

async function sendMessage() {
const textarea = document.getElementById('userInput');
const text = textarea.value.trim();
if (!text || isLoading) return;

isLoading = true;
document.getElementById('sendBtn').disabled = true;
document.getElementById('sendBtnIcon').disabled = true;

addMessage('user', text);
hideIntro();
dismissMemories();
pushMessage('user', text);
// Сохраняем шум в localStorage — выживет при выгрузке вкладки iOS
try {
  const noiseIdx = messages.length - 1;
  localStorage.setItem('uc_noise_' + noiseIdx, text.slice(0, 500));
} catch(e) {}
textarea.value = '';
updateCount();

await callWorker();

isLoading = false;
document.getElementById('sendBtn').disabled = false;
document.getElementById('sendBtnIcon').disabled = false;
textarea.focus();
}

async function callWorker() {
const { div, mbId } = addMessage('ai', '', true);
const body = document.getElementById(mbId);
let fullText = '';

// ОТЛАДОЧНАЯ ЗАГЛУШКА — без обращения к Yandex
if (USE_STUB) {
  workerOk = true;
  updateInlineStatus();
  const stub = pickDemo();
  const lastUserMsg = messages.filter(m => m.role === 'user').slice(-1)[0]?.content || '';
  pushMessage('assistant', stub);   // сохраняем сразу, до печати
  await typeText(mbId, stub, 12);
  finalizeAiMessage(div, mbId, stub, lastUserMsg);
  return;
}

try {
const response = await fetch(WORKER_URL, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ raw_noise: buildContextPayload(), lang: (window.UC_I18N ? UC_I18N.lang : 'ru') }),
signal: AbortSignal.timeout(WORKER_TIMEOUT)
});

if (!response.ok) throw new Error(`HTTP ${response.status}`);

const data = await response.json();
if (data.error) throw new Error(data.error);

// шум отклонён фильтром — короткая табличка, без вплетения и без истории
if (data.rejected === true) {
  workerOk = true;
  updateInlineStatus();
  if (body) body.innerHTML = `<span style="opacity:0.6">${UC_I18N.t('petlya.notYourNoise')}</span>`;
  return;
}

fullText = data.interpretation || UC_I18N.t('petlya.signalUnrecognized');
workerOk = true;
updateInlineStatus();

// ФИКС 14.08: подстраховка от чужого отклика. Разбор живого случая
// (LTE + VPN) — узел получил дословно ответ на СОВСЕМ другой, более
// ранний шум. Генератор (unitycode-petlya) ничего не кэширует и
// каждый раз зовёт модель заново с temperature 0.7 — совпасть слово
// в слово при разных запросах она сама по себе не должна. Похоже на
// кэш где-то на сетевом пути (шлюз модели или прокси VPN), не в
// нашем коде — но объективность важнее версии причины: если новый
// отклик побайтово совпал с прошлым, это подозрительно почти всегда,
// и один принудительный повтор запроса стоит меньше, чем чужой отклик
// у чужого шума. Повтор только один — не зацикливаемся, если модель
// действительно вернула то же самое дважды честно.
const lastAiMsg = messages.filter(m => m.role === 'assistant').slice(-1)[0]?.content || '';
if (fullText && lastAiMsg && fullText === lastAiMsg) {
  try {
    const retryRes = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ raw_noise: buildContextPayload(), lang: (window.UC_I18N ? UC_I18N.lang : 'ru') }),
      signal: AbortSignal.timeout(WORKER_TIMEOUT)
    });
    if (retryRes.ok) {
      const retryData = await retryRes.json();
      if (retryData && !retryData.error && retryData.rejected !== true
          && typeof retryData.interpretation === 'string' && retryData.interpretation.trim()) {
        fullText = retryData.interpretation;
      }
    }
  } catch(e) { /* повтор не удался — показываем то, что пришло, задвоенный отклик лучше пустоты */ }
}

const lastUserMsg = messages.filter(m => m.role === 'user').slice(-1)[0]?.content || '';
pushMessage('assistant', fullText);   // сохраняем ответ сразу, до анимации печати — переживёт уход со страницы
await typeText(mbId, fullText, 7);
finalizeAiMessage(div, mbId, fullText, lastUserMsg);
} catch (err) {
console.error('Worker error:', err);
workerOk = false;
updateInlineStatus();

// Демо-режим
if (body) body.innerHTML = `<span style="color:var(--accent2)">⚠ Worker: ${escHtml(err.message)}</span><br><br>`;

const demoText = pickDemo();
pushMessage('assistant', demoText);   // сохраняем сразу, до печати

for (let i = 0; i <= demoText.length; i++) {
await new Promise(r => setTimeout(r, 9));
if (body) body.innerHTML =
`<span style="color:var(--accent2);font-size:0.65rem">${UC_I18N.t('petlya.demoUnavailable')}</span><br><br>` +
escHtml(demoText.slice(0, i)) + '<span class="stream-cursor"></span>';
if (i % 20 === 0) scrollBottom();
}
if (body) body.innerHTML =
`<span style="color:rgba(255,100,100,0.4);font-size:0.6rem">${UC_I18N.t('petlya.demoBadge')}</span><br><br>` + escHtml(demoText);

finalizeAiMessage(div, mbId, demoText);
}
}

// Формируем контекст для Worker — последние N сообщений
function buildContextPayload() {
const recent = messages.slice(-CONTEXT_WINDOW);
if (recent.length <= 1) {
return recent[0]?.content || '';
}
return recent.map(m => {
const tag = m.role === 'user' ? UC_I18N.t('petlya.roleUser') : UC_I18N.t('petlya.roleNode');
return `${tag} ${m.content}`;
}).join('\n\n');
}

// Токен на основе кодовой фразы
async function phraseToToken(phrase) {
  try {
    const enc = new TextEncoder().encode(phrase.trim().toLowerCase());
    const hash = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch(e) {
    // Fallback если crypto.subtle недоступен
    let h = 0;
    for (const c of phrase.trim().toLowerCase()) h = (Math.imul(31, h) + c.charCodeAt(0)) | 0;
    return Math.abs(h).toString(16).padStart(8, '0') + phrase.length.toString(16) + Date.now().toString(16).slice(-8);
  }
}

async function getUserToken() {
  try {
    let token = localStorage.getItem('uc_token');
    if (token) return token;

    return new Promise(resolve => {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.92);display:flex;align-items:center;justify-content:center;';
      overlay.innerHTML = `
        <div style="width:90%;max-width:420px;border:1px solid rgba(0,255,136,0.3);background:#050a05;padding:2rem;">
          <div style="font-family:monospace;font-size:0.6rem;color:#00ff88;letter-spacing:0.2em;margin-bottom:1rem;">${UC_I18N.t('petlya.keyTitle')}</div>
          <p style="font-family:monospace;font-size:0.8rem;line-height:1.7;color:rgba(255,255,255,0.7);margin-bottom:1.4rem;">${UC_I18N.t('petlya.keyDesc')}</p>
          <input id="uc-phrase-input" type="text" placeholder="${UC_I18N.t('petlya.phrasePlaceholder')}" style="width:100%;background:rgba(255,255,255,0.03);border:1px solid rgba(0,255,136,0.2);color:#fff;font-family:monospace;font-size:16px;padding:0.6rem 0.8rem;outline:none;margin-bottom:1rem;">
          <div style="display:flex;gap:0.8rem;">
            <button id="uc-phrase-ok" style="flex:1;padding:0.6rem;border:1px solid #00ff88;color:#00ff88;font-family:monospace;font-size:0.7rem;letter-spacing:0.1em;background:transparent;cursor:pointer;">${UC_I18N.t('petlya.keyRemember')}</button>
            <button id="uc-phrase-skip" style="flex:1;padding:0.6rem;border:1px solid rgba(255,255,255,0.1);color:#555;font-family:monospace;font-size:0.7rem;letter-spacing:0.1em;background:transparent;cursor:pointer;">${UC_I18N.t('petlya.keySkip')}</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      document.getElementById('uc-phrase-input').focus();

      async function confirm() {
        const phrase = document.getElementById('uc-phrase-input').value.trim();
        document.body.removeChild(overlay);
        let token;
        if (phrase) {
          // фраза введена — закрепляем личность навсегда (этот браузер
          // больше не увидит окно, токен детерминирован фразой)
          token = await phraseToToken(phrase);
          localStorage.setItem('uc_token', token);
        } else {
          // пропуск — гостевой одноразовый токен ТОЛЬКО для этого
          // вплетения. В localStorage НЕ сохраняем — окно появится
          // снова при следующем вплетении, и можно снова выбрать:
          // ввести фразу (стать собой навсегда) или пропустить (остаться гостем ещё раз).
          token = (crypto.randomUUID?.()) || (Math.random().toString(36).slice(2) + Date.now().toString(36));
        }
        resolve(token);
      }

      document.getElementById('uc-phrase-ok').onclick = confirm;
      document.getElementById('uc-phrase-skip').onclick = confirm;
      document.getElementById('uc-phrase-input').onkeydown = e => { if (e.key === 'Enter') confirm(); };
    });
  } catch(e) {
    // Полный fallback — генерируем рандомный токен
    console.warn('getUserToken error:', e);
    let token = localStorage.getItem('uc_token');
    if (!token) {
      token = (crypto.randomUUID?.()) || (Math.random().toString(36).slice(2) + Date.now().toString(36));
      localStorage.setItem('uc_token', token);
    }
    return token;
  }
}

// ── МЕСТО: СПРАШИВАЕМ ЗАРАНЕЕ, НО НИКОГДА НЕ ЖДЁМ ──────────────
// История в двух ошибках, чтобы не повторить ни одну.
//
// Было: getCoords ждал позицию до 10 секунд прямо в момент вплетения.
// Вместе с ожиданием Turnstile это давало больше двадцати секунд у
// кнопки — половина того «квеста», ради которого всё и затевалось.
//
// Стало 07.08: запрос убрали совсем, положившись на откат в воркере. И
// узлы поехали — воркер ставил их туда, где человек был в ПРОШЛЫЙ раз,
// за километры от настоящего места, причём с точностью до метра.
//
// Теперь третий вариант, без обеих бед: позицию просим один раз при
// открытии страницы, в фоне, и никогда её не ждём. К моменту вплетения
// она обычно уже есть. Не пришла или не разрешили — место проставит
// воркер по IP: грубо, до города, зато про сегодня.
let _ucPos = null;
(function askPositionOnce(){
  try {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      pos => { _ucPos = { lat: pos.coords.latitude, lng: pos.coords.longitude }; },
      () => {},   // отказ, таймаут, выключенные службы — молча, откат справится
      // maximumAge: свежий кэш системы подходит — это те же пять минут,
      // а не новая возня с GPS. timeout щедрый: мы всё равно не ждём.
      { timeout: 20000, maximumAge: 300000, enableHighAccuracy: false }
    );
  } catch (e) {}
})();

// Берём то, что успело прийти. Ожидания на пути вплетения нет никогда.
function getCoords() {
  return Promise.resolve(_ucPos || { lat: null, lng: null });
}

function genIdem(){ try { return crypto.randomUUID(); } catch(e){ return Date.now().toString(36) + Math.random().toString(36).slice(2); } }
function ensureIdem(idx){
  if (isNaN(idx) || !messages[idx]) return genIdem();
  if (!messages[idx].idem){ messages[idx].idem = genIdem(); try { sessionStorage.setItem('uc_petlya_dialog', JSON.stringify(messages)); } catch(e){} }
  return messages[idx].idem;
}

// ═══════════════════════════════════════════════════════
// ПРОВЕРКА "А НЕ ДОЛЕТЕЛО ЛИ УЖЕ" (для плохой/блокируемой сети)
// ─────────────────────────────────────────────────────────
// В нестабильной сети запись в Supabase иногда УСПЕВАЕТ пройти, а ответ
// воркера — нет (обрыв/блокировка после отправки). Клиент в этом случае
// показывает ошибку, хотя шум уже вплетён — это и есть баг "красная кнопка
// навсегда, хотя в «Сети» шум уже виден".
// Чиним не трогая воркер: читаем Supabase напрямую (тот же публичный ключ
// на чтение, что использует страница «Сеть») и смотрим — не появился ли
// уже узел с этим текстом и токеном за последние минуты.
// ВАЖНО: предполагает колонку client_id (UNIQUE, точечный матч — надёжнее,
// чем текст+время: не путает два разных шума с одинаковым текстом) и,
// как запасной вариант, raw_noise/user_token в таблице nodes, с разрешённым
// им чтением (RLS "read nodes" = true).
async function checkAlreadyWoven(clientId, rawNoise, token) {
  try {
    // Основной путь: точное совпадение по client_id — тот же способ,
    // которым log.html уже проверяет очередь. Никакой путаницы между
    // двумя разными шумами с одинаковым текстом.
    if (clientId) {
      const urlById = SUPABASE_URL + '/rest/v1/nodes'
        + '?select=id'
        + '&client_id=eq.' + encodeURIComponent(clientId)
        + '&limit=1';
      const rById = await UCData.fetchRetry(urlById, { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY } });
      if (rById.ok) {
        const rowsById = await rById.json();
        if (Array.isArray(rowsById) && rowsById[0]) return rowsById[0].id;
      }
    }
    // Запасной путь (client_id почему-то не пришёл) — старое поведение.
    if (!rawNoise || !token) return null;
    const since = new Date(Date.now() - 15 * 60000).toISOString();
    const url = SUPABASE_URL + '/rest/v1/nodes'
      + '?select=id'
      + '&user_token=eq.' + encodeURIComponent(token)
      + '&raw_noise=eq.' + encodeURIComponent(rawNoise)
      + '&created_at=gte.' + encodeURIComponent(since)
      + '&order=created_at.desc&limit=1';
    const r = await UCData.fetchRetry(url, { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY } });
    if (!r.ok) return null;
    const rows = await r.json();
    return (Array.isArray(rows) && rows[0]) ? rows[0].id : null;
  } catch(e) { return null; }
}

// Данные (не UI): фиксируем "вплетено" в messages/localStorage и снимаем с очереди.
// Общая часть для успешного ответа воркера И для найденной напрямую записи.
function persistWoven(msgIndex, clientId) {
  const idx = parseInt(msgIndex);
  if (!isNaN(idx) && messages[idx]) {
    messages[idx].woven = true;
    try { sessionStorage.setItem('uc_petlya_dialog', JSON.stringify(messages)); } catch(e){}
  }
  try { localStorage.setItem('uc_woven_idx_' + msgIndex, '1'); } catch(e){}
  try { localStorage.removeItem('uc_noise_' + msgIndex); } catch(e){}
  ucQueueRemove(clientId);
  // Шум подтверждён — строка «ещё не вплетено» больше не правда. Снимаем её
  // здесь, а не в styleWovenButton: та выходит рано, если кнопка уже стала
  // «Дальше», и тогда пометка осталась бы висеть после успешной досылки.
  ucClearPendingNote(clientId);
}

// ── ФИКС 03.09: «ДАЛЬШЕ» БОЛЬШЕ НЕ ВЫДАЁТ ОТКАЗ ЗА УСПЕХ ──────────
// transformToAdvance через пять секунд стирала тост, пояснение и ссылку —
// и ставила ту же надпись «Дальше», что и после удачного вплетения. Экран
// становился неотличим от успешного. Именно так 02.09 потерялся шум: 403 от
// воркера (Turnstile без RATE_KV, см. разбор там же), интерфейс не возразил
// ни словом, и о потере узнали только по пустой базе шесть дней спустя.
//
// Кнопка остаётся навигацией — «Сеть» посмотреть полезно в любом исходе.
// Но если шум ВСЁ ЕЩЁ в очереди, рядом остаётся тихая строка правды. Она не
// пугает и ничего не требует: досылка идёт фоном сама (ucTrySyncQueue), и
// строка исчезнет, как только шум долетит.
function ucClearPendingNote(clientId) {
  if (!clientId) return;
  document.querySelectorAll(`[data-pending="${clientId}"]`).forEach(el => {
    if (el.parentNode) el.parentNode.removeChild(el);
  });
}

function ucMarkPendingIfQueued(btn) {
  const clientId = btn && btn.dataset ? btn.dataset.idem : '';
  if (!clientId) return;
  if (!ucQueueRead().some(x => x.client_id === clientId)) return; // долетело — молчим
  const parent = btn.parentNode;
  if (!parent || parent.querySelector(`[data-pending="${clientId}"]`)) return;
  const note = document.createElement('div');
  note.dataset.pending = clientId;
  // .message.ai — это flex-строка, и заметка без этого встаёт КОЛОНКОЙ справа
  // от кнопки, в остаток ширины (~216px на телефоне). Пускаем её на свою
  // строку: flex-wrap ставим точечно на этом сообщении, а не в общий CSS —
  // остальные сообщения не трогаем.
  parent.style.flexWrap = 'wrap';
  note.style.cssText = 'flex:0 0 100%;font-size:0.6rem;line-height:1.6;color:rgba(255,180,60,0.6);margin-top:0.4rem;font-family:\'Share Tech Mono\',monospace;letter-spacing:0.05em;';
  note.textContent = '// ' + UC_I18N.t('petlya.stillQueued');
  parent.appendChild(note);
}

// UI: красим конкретную кнопку в "вплетено" и убираем всё, что рядом с ней
// накопилось (пояснения об ожидании, ссылку "проверить в Сети").
function styleWovenButton(btn) {
  if (!btn) return;
  if (btn.dataset.advanceDone === '1') return; // уже показываем «Дальше» — не перекрываем
  btn.textContent = UC_I18N.t('petlya.weaved');
  btn.style.color = 'var(--accent)';
  btn.style.borderColor = 'rgba(0,255,136,0.3)';
  btn.disabled = true;
  btn.dataset.weaveInProgress = '0';
  const clientId = btn.dataset.idem;
  ucHideQueueToast(clientId);
  const parent = btn.parentNode;
  if (!parent) return;
  const autoNote = parent.querySelector(`[data-auto-note="${clientId}"]`);
  if (autoNote && autoNote.parentNode) autoNote.parentNode.removeChild(autoNote);
  const netLink = parent.querySelector(`[data-net-link="${clientId}"]`);
  if (netLink && netLink.parentNode) netLink.parentNode.removeChild(netLink);
}

// Спустя 5 сек после ЛЮБОГО исхода (успех / отказ привратника / привратник
// недоступен / ответ потерялся) — кнопка вплетения уже не несёт полезного
// действия: итог известен, а нужный при потере ответа повтор идёт в фоне
// (ucTrySyncQueue) сам по себе, независимо от кнопки. Дальше человеку
// логичнее увидеть Сеть, чем смотреть на неподвижную надпись.
function transformToAdvance(btn) {
  if (!btn || !btn.parentNode || btn.dataset.advanceDone === '1') return;
  btn.dataset.advanceDone = '1';
  btn.textContent = UC_I18N.t('petlya.advance');
  // Класс убирает рамку/фон и добавляет треугольник справа (CSS-псевдоэлемент,
  // не символ) — просто текст со стрелкой, без формы кнопки.
  btn.classList.add('weave-advance');
  btn.disabled = false;
  btn.style.color = 'rgba(120,200,255,0.9)';
  btn.onclick = function() { window.location.href = 'set.html'; };
  ucHideQueueToast(btn.dataset.idem);
  const parent = btn.parentNode;
  const autoNote = parent.querySelector(`[data-auto-note="${btn.dataset.idem}"]`);
  if (autoNote && autoNote.parentNode) autoNote.parentNode.removeChild(autoNote);
  const netLink = parent.querySelector(`[data-net-link="${btn.dataset.idem}"]`);
  if (netLink && netLink.parentNode) netLink.parentNode.removeChild(netLink);
  // Всё лишнее убрано — но если шум ещё не долетел, об этом должно остаться
  // сказано. См. ucMarkPendingIfQueued (фикс 03.09).
  ucMarkPendingIfQueued(btn);
}

// Всплывающее окошко при слабом соединении. Живёт на document.body
// (position:fixed), поэтому НЕ встраивается в флекс-поток сообщения и не
// рвёт вёрстку. Помечено data-auto-note = clientId, чтобы его можно было
// найти и убрать, когда шум подтверждён.
function ucShowQueueToast(clientId, message, linkLabel) {
  if (!clientId) return;
  let toast = document.querySelector(`.uc-toast[data-auto-note="${clientId}"]`);
  if (!toast) {
    toast = document.createElement('div');
    toast.className = 'uc-toast';
    toast.dataset.autoNote = clientId;
    const msg = document.createElement('div');
    msg.dataset.toastMsg = '1';
    toast.appendChild(msg);
    document.body.appendChild(toast);
  }
  const msgEl = toast.querySelector('[data-toast-msg]');
  if (msgEl) msgEl.textContent = '// ' + message;
  if (linkLabel && !toast.querySelector('a')) {
    const a = document.createElement('a');
    a.href = 'set.html';
    a.dataset.netLink = clientId;
    a.textContent = linkLabel;
    toast.appendChild(a);
  }
}
function ucHideQueueToast(clientId) {
  if (!clientId) return;
  const toast = document.querySelector(`.uc-toast[data-auto-note="${clientId}"]`);
  if (toast && toast.parentNode) toast.parentNode.removeChild(toast);
}

// Подсказка сразу, а не только текстом "сохранено локально": явная ссылка
// на «Сеть» — если шум там уже виден, не нужно ждать автоматической проверки.
function addNetworkCheckLink(btn, clientId) {
  if (!btn || !btn.parentNode || !clientId) return;
  if (btn.parentNode.querySelector(`[data-net-link="${clientId}"]`)) return;
  const link = document.createElement('a');
  link.href = 'set.html';
  link.dataset.netLink = clientId;
  link.textContent = UC_I18N.t('petlya.netCheck');
  link.style.cssText = 'display:inline-block;margin-top:0.5rem;font-size:0.6rem;letter-spacing:0.05em;color:rgba(120,200,255,0.8);text-decoration:underline;font-family:\'Share Tech Mono\',monospace;';
  btn.parentNode.appendChild(link);
}

async function weaveIntoNet(btn) {
// Защита от двойного тапа: если уже идёт отправка с этой кнопки — игнорим
if (btn.dataset.weaveInProgress === '1') return;
btn.dataset.weaveInProgress = '1';

btn.textContent = UC_I18N.t('petlya.weaving');
btn.disabled = true;

// Если шум пользователя утерян — вплетение бессмысленно, блокируем
const rawNoise = btn.dataset.noise || '';
if (!rawNoise) {
  btn.textContent = '[ шум утерян ]';
  btn.style.color = 'var(--accent2)';
  btn.disabled = false;
  btn.dataset.weaveInProgress = '0';
  return;
}
// Объявляем здесь (а не через const внутри try), чтобы catch-блок при сбое
// тоже мог использовать userToken для прямой проверки в Supabase.
let userToken = '';

// ФИКС 27.08: ucInFlight — общий на кнопку и фоновую очередь. Раньше его
// знала только ucTrySyncQueue, а про отправку с кнопки не знал никто:
// шум ложился в очередь ДО сетевого запроса (так и задумано — иначе он
// потеряется при обрыве), и любой триггер очереди в этот момент — таймер
// 45с, событие 'online' или возврат на вкладку — слал ВТОРОЙ запрос с тем
// же client_id. База от дубля защищена идемпотентностью, а вот Привратник
// и Дистиллятор отрабатывали полностью заново: лишние вызовы LLM и лишний
// токен Turnstile на пустом месте. Очередь уже умеет пропускать «в полёте»
// (см. её проверку ucInFlight.has) — теперь кнопка ей об этом сообщает.
// Семантика очереди не меняется: при сбое шум остаётся в ней и доедет
// фоном, как и раньше.
const _idem = btn.dataset.idem || '';
if (_idem) ucInFlight.add(_idem);
try {
const { lat, lng } = await getCoords();
userToken = await getUserToken();

const payload = {
raw_noise: rawNoise,
ai_interpretation: btn.dataset.text,
user_token: userToken
};
if (lat !== null) payload.lat = lat;
if (lng !== null) payload.lng = lng;
// Зона автора — только копим на будущее (связь шума с местным временем
// человека), сейчас никак не используется. IANA-имя надёжнее смещения
// в минутах: верно учитывает переход на летнее/зимнее время.
try { payload.tz = Intl.DateTimeFormat().resolvedOptions().timeZone || undefined; } catch(e) { /* не критично */ }
// Язык интерфейса в момент вплетения — на нём Привратник сформулирует
// причину отказа. Едет и в очередь: запись может уйти через сутки, когда
// человек уже переключил язык, а отказ должен звучать на языке вплетения.
payload.lang = (window.UC_I18N && UC_I18N.lang) || 'ru';

// Запоминаем попытку вплетения локально ДО сети — переживёт обрыв связи
// и закрытие вкладки. client_id — ключ идемпотентности, повтор безопасен.
ucQueueUpsert({
  client_id: btn.dataset.idem,
  msg_index: btn.dataset.msgIndex,
  raw_noise: payload.raw_noise,
  ai_interpretation: payload.ai_interpretation,
  user_token: userToken,
  lat: payload.lat,
  lng: payload.lng,
  tz: payload.tz,
  lang: payload.lang,
  echo_id: ucEchoId || undefined,
});

const ts = await takeTurnstileToken();
const res = await fetch(WRITE_WORKER_URL, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
action: 'node',
token: userToken,
turnstile: ts,
client_id: btn.dataset.idem || undefined,
raw_noise: payload.raw_noise,
ai_interpretation: payload.ai_interpretation,
lat: payload.lat,
lng: payload.lng,
tz: payload.tz,
lang: payload.lang,
echo_id: ucEchoId || undefined,
}),
});

if (!res.ok) throw new Error('HTTP ' + res.status);
const data = await res.json();

// Вердикт привратника: Сеть не приняла сигнал. Это не сбой —
// показываем причину тихо, голосом Сети. Кнопка гаснет навсегда.
if (data && data.ok === false && data.error === 'gate') {
btn.textContent = UC_I18N.t('petlya.weaveRejected');
btn.style.color = 'var(--accent2)';
btn.style.borderColor = 'rgba(255,51,102,0.3)';
const note = document.createElement('div');
note.style.cssText = 'font-size:0.6rem;line-height:1.6;color:rgba(255,51,102,0.55);margin-top:0.5rem;font-family:\'Share Tech Mono\',monospace;letter-spacing:0.05em;';
note.textContent = '// ' + (data.reason || UC_I18N.t('petlya.signalIndistinct'));
if (btn.parentNode) btn.parentNode.appendChild(note);
ucQueueRemove(btn.dataset.idem);
setTimeout(() => transformToAdvance(btn), 5000);
return;
}

// Привратник недоступен (не смог ответить) — НЕ вплетено, но можно повторить.
if (data && data.ok === false && data.error === 'gate_unavailable') {
btn.textContent = UC_I18N.t('petlya.retryR');
btn.style.color = 'var(--accent2)';
btn.disabled = false;
btn.dataset.weaveInProgress = '0';
const note = document.createElement('div');
note.style.cssText = 'font-size:0.6rem;line-height:1.6;color:rgba(255,51,102,0.45);margin-top:0.5rem;font-family:\'Share Tech Mono\',monospace;letter-spacing:0.05em;';
note.textContent = '// ' + (data.reason || UC_I18N.t('petlya.netDidntHear'));
if (btn.parentNode) btn.parentNode.appendChild(note);
setTimeout(() => transformToAdvance(btn), 5000);
return;
}

if (!data || data.ok !== true) throw new Error('write_failed');

// Голос Сети: эссенция этого шума звучит прямо сейчас — Сеть расслышала
// тебя и произнесла суть вслух. Текст пришёл в ответе воркера (distill
// уже отработал к этому моменту). Не критично — при любой ошибке молчит.
if (data.essence) ucSpeakEssence(data.essence);

persistWoven(btn.dataset.msgIndex, btn.dataset.idem);
styleWovenButton(btn);
// Успех — кнопка остаётся disabled навсегда, но через 5 сек тоже
// становится переходом в «Сеть» (единое поведение для любого исхода)
setTimeout(() => transformToAdvance(btn), 5000);
} catch(e) {
console.warn('Supabase error', e);
const _queuedMsg = UC_I18N.t('petlya.queuedLost');
btn.textContent = `[ ⏳ ${UC_I18N.t('petlya.waitWord')}... ]`;
btn.style.color = 'var(--accent2)';
// Пояснение показываем отдельным всплывающим окошком (не встраиваем в
// сообщение — иначе длинный текст рвёт вёрстку в одну строку). Шум НЕ
// потерян: он в локальной очереди и довплетётся сам через ucTrySyncQueue.
ucShowQueueToast(
  btn.dataset.idem,
  _queuedMsg,
  UC_I18N.t('petlya.netCheck')
);

// ОБРАТНЫЙ ОТСЧЁТ 5 секунд — чисто визуальный, дальше повтор (если нужен)
// идёт в фоне сам по себе. По истечении кнопка не предлагает нажимать
// ещё раз — она превращается в переход в «Сеть» (единое поведение с
// остальными исходами: там ждать уже нечего).
let countdown = 5;
const tick = setInterval(() => {
countdown--;
if (countdown > 0) {
btn.textContent = `[ ⏳ ${UC_I18N.t('petlya.waitWord')} ${countdown}... ]`;
} else {
clearInterval(tick);
transformToAdvance(btn);
}
}, 1000);

// Фоновая самопроверка: вдруг запись всё-таки дошла, а потерялся только
// ответ. Если найдём — красим кнопку в успех сами, не дожидаясь тапа,
// и всё равно через 5 сек она превратится в переход в «Сеть».
const _tokenForCheck = userToken || (function(){ try { return localStorage.getItem('uc_token') || ''; } catch(_e){ return ''; } })();
if (_tokenForCheck) {
  (async () => {
    await new Promise(r => setTimeout(r, 3000));
    const foundId = await checkAlreadyWoven(btn.dataset.idem, rawNoise, _tokenForCheck);
    if (foundId) {
      clearInterval(tick);
      persistWoven(btn.dataset.msgIndex, btn.dataset.idem);
      styleWovenButton(btn);
      setTimeout(() => transformToAdvance(btn), 5000);
    }
  })();
}
} finally {
// Отпускаем метку в ЛЮБОМ исходе. При сбое шум остаётся в очереди — и с
// этого момента фон снова вправе за него взяться, как и задумано.
if (_idem) ucInFlight.delete(_idem);
}
}

// ═══════════════════════════════════════════════════════
// ОЧЕРЕДЬ ВПЛЕТЕНИЙ (офлайн-устойчивость)
// Аддитивный слой: не меняет UI и не трогает существующую логику рендера.
// Каждая попытка вплетения сохраняется локально ДО сетевого запроса
// (см. ucQueueUpsert в weaveIntoNet). Если канал слабый/обрывается —
// шум не теряется: фон довплетает его сам, когда связь появится.
// client_id = ключ идемпотентности — повторная отправка безопасна
// (Supabase игнорирует дубликат по уже существующему контракту).
// ═══════════════════════════════════════════════════════
const UC_QUEUE_KEY = 'uc_weave_queue';
const ucInFlight = new Set();

function ucQueueRead() {
  try { return JSON.parse(localStorage.getItem(UC_QUEUE_KEY) || '[]'); } catch(e) { return []; }
}
function ucQueueWrite(items) {
  try { localStorage.setItem(UC_QUEUE_KEY, JSON.stringify(items)); } catch(e) {}
}
function ucQueueUpsert(item) {
  const items = ucQueueRead();
  const i = items.findIndex(x => x.client_id === item.client_id);
  if (i >= 0) items[i] = Object.assign({}, items[i], item);
  else items.push(item);
  ucQueueWrite(items);
}
function ucQueueRemove(clientId) {
  if (!clientId) return;
  ucQueueWrite(ucQueueRead().filter(x => x.client_id !== clientId));
}

async function ucTrySyncQueue() {
  const items = ucQueueRead();
  if (!items.length) return;
  for (const item of items) {
    if (!item.client_id || ucInFlight.has(item.client_id)) continue;
    ucInFlight.add(item.client_id);
    try {
      // Сначала смотрим — может, эта попытка уже долетела раньше (ответ
      // потерялся в плохой сети, а запись состоялась). Тогда не шлём дубль.
      const already = await checkAlreadyWoven(item.client_id, item.raw_noise, item.user_token);
      if (already) {
        persistWoven(item.msg_index, item.client_id);
        const preBtn = document.querySelector(`[data-idem="${item.client_id}"]`);
        if (preBtn) styleWovenButton(preBtn);
        continue;
      }
      const ts = await takeTurnstileToken();
      const res = await fetch(WRITE_WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'node',
          token: item.user_token,
          turnstile: ts,
          client_id: item.client_id,
          raw_noise: item.raw_noise,
          ai_interpretation: item.ai_interpretation,
          lat: item.lat,
          lng: item.lng,
          tz: item.tz,
          lang: item.lang,
          echo_id: item.echo_id,
        }),
      });
      if (res.ok) {
        const data = await res.json();
        // успех — снимаем с очереди И помечаем "вплетено" в данных,
        // чтобы при релоаде кнопка не появилась снова (рендер не трогаем,
        // только то, что уже читает существующая restoreDialog).
        if (data && data.ok === true) {
          persistWoven(item.msg_index, item.client_id);
          // Аддитивно: если кнопка ещё на экране (та же вкладка, без
          // перезагрузки) — красим её сразу в "вплетено" тем же стилем,
          // что и ручной успех, не дожидаясь ручного рефреша.
          try {
            const liveBtn = document.querySelector(`[data-idem="${item.client_id}"]`);
            if (liveBtn) styleWovenButton(liveBtn);
          } catch(e){}
        } else if (data && data.error === 'gate') {
          // окончательный отказ привратника — повторять нет смысла
          ucQueueRemove(item.client_id);
          try {
            const liveBtn = document.querySelector(`[data-idem="${item.client_id}"]`);
            if (liveBtn) {
              liveBtn.textContent = UC_I18N.t('petlya.weaveRejected');
              liveBtn.style.color = 'var(--accent2)';
              liveBtn.style.borderColor = 'rgba(255,51,102,0.3)';
              liveBtn.disabled = true;
              const autoNote = liveBtn.parentNode ? liveBtn.parentNode.querySelector(`[data-auto-note="${item.client_id}"]`) : null;
              if (autoNote) autoNote.textContent = '// ' + (data.reason || UC_I18N.t('petlya.signalIndistinct'));
            }
          } catch(e){}
        }
        // gate_unavailable / прочее — транзитно, оставляем в очереди
      }
    } catch(e) {
      // сеть всё ещё недоступна — оставляем в очереди до следующей попытки
    } finally {
      ucInFlight.delete(item.client_id);
    }
  }
}

// Триггеры фоновой синхронизации — независимы от UI, не блокируют его
window.addEventListener('online', ucTrySyncQueue);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') ucTrySyncQueue(); });
setTimeout(ucTrySyncQueue, 4000);    // попытка сразу после загрузки страницы
setInterval(ucTrySyncQueue, 45000);  // подстраховка: на слабом LTE событие 'online' часто не срабатывает

// ═══════════════════════════════════════════════════════
// АНИМАЦИЯ СИСТЕМНОГО СООБЩЕНИЯ
// ═══════════════════════════════════════════════════════
(async function(){
var el = document.querySelector('.sys-msg');
try { var _mt=document.querySelector('.marquee-text'); if(_mt && window.UC_I18N) _mt.innerHTML=UC_I18N.t('petlya.marquee'); } catch(e){}
function getSendBtn() {
  const btnText = document.getElementById('sendBtn');
  const btnIcon = document.getElementById('sendBtnIcon');
  return (btnIcon && btnIcon.offsetParent !== null) ? btnIcon
       : (btnText && btnText.offsetParent !== null) ? btnText : null;
}
// ТЕКСТ: старт от правого края кнопки — ставим сразу, без задержки
function positionText() {
  const wrap = document.querySelector('.marquee-wrap');
  const btn = getSendBtn();
  if (!wrap || !btn) return;
  const textStart = btn.getBoundingClientRect().right - wrap.getBoundingClientRect().left;
  document.documentElement.style.setProperty('--text-start', textStart + 'px');
}
// ЗВЕЗДА: старт у правого края кнопки Отправить.
// ФИКС 16.07: координаты теперь ЛОКАЛЬНЫЕ — относительно .input-label
// (родитель звезды, position:relative), а не вьюпорта. Разница рект-ов
// считается в один и тот же момент, поэтому скролл страницы (включая
// iOS-клавиатуру, которая скроллит, а не ресайзит) на результат не влияет.
function launchStar() {
  const star = document.querySelector('.star-pulse');
  const label = star ? star.parentElement : null;   // .input-label
  const btn = getSendBtn();
  if (!star || !label || !btn) return;
  const btnRect = btn.getBoundingClientRect();
  const labelRect = label.getBoundingClientRect();
  star.style.animation = 'none';                  // сброс перед перезапуском
  star.style.left = (btnRect.right - labelRect.left) + 'px'; // локально: правый край кнопки в системе label
  star.style.top = '-3px';                        // чуть выше строки — константа, не расчёт от viewport
  void star.offsetWidth;                          // reflow, чтобы анимация перезапустилась
  star.style.animation = 'marquee-star-fx 20s linear infinite, star-blink 3s ease-in-out infinite';
}
positionText();
setTimeout(launchStar, 5000);
// при смене ориентации/размера пересчитываем позиции старта
let starResizeT;
function recalc() { positionText(); launchStar(); }
window.addEventListener('resize', () => { clearTimeout(starResizeT); starResizeT = setTimeout(recalc, 250); });
window.addEventListener('orientationchange', () => setTimeout(recalc, 400));
// при возврате на Спираль — восстановить прошлый диалог сессии
var restored = false;
try { restored = await restoreDialog(); } catch(e){}
if (restored) { if (el) el.remove(); return; }
if(!el) return;
// показываем вступление только один раз за сессию (при возврате из меню — не показываем)
var seen = false;
try { seen = sessionStorage.getItem('uc_petlya_intro') === '1'; } catch(e){}
if (seen) { el.remove(); return; }
try { sessionStorage.setItem('uc_petlya_intro', '1'); } catch(e){}
// tap-to-dismiss: тап по вступлению убирает его (hideIntro идемпотентна —
// безопасно и во время анимации, и вместе с уходом при отправке шума).
el.style.cursor = 'pointer';
el.addEventListener('click', function(){

  // на iOS/WebKit клавиатура поднимается.
  var inp = document.getElementById('userInput');
  if (inp) inp.focus();
});
var DUR = 3200, start = null;
function curve(p) {
if(p < 0.35) return (p / 0.35) * 1.2;
var t = (p - 0.35) / 0.65;
return 1.2 - 0.2 * (1 - Math.pow(1 - t, 3));
}
var sysText = el.querySelector('.sys-text');
var sysTag = el.querySelector('.sys-tag');
if(sysText) {
var parts = (window.UC_I18N ? UC_I18N.t("petlya.intro") : sysText.innerHTML).split(/<br\s*\/?>/i);
sysText.innerHTML = parts.map(p => '<span class="sys-line" style="display:block">' + p + '</span>').join('');
}
var lines = sysText ? Array.from(sysText.querySelectorAll('.sys-line')) : [];
// ── Продолжение анимации ─────────────────────────────────────────────
// После того как вход «завис», ждём 5с, затем строки по очереди медленно
// и покачиваясь улетают вдаль (интервал старта 1.5с). Последняя (зелёная)
// строка — наоборот: приближается/увеличивается за 0.5с, зависает и резко
// исчезает, после чего весь интро убирается. Тап раньше конца → hideIntro
// (как сейчас): все guard'ы проверяют introHidden и останавливаются.
function scheduleIntroExit() {
  if (!lines.length || introHidden) return;
  var HOLD = 5000, STAGGER = 1500, greenIdx = lines.length - 1;
  setTimeout(function(){
    if (introHidden) return;
    lines.forEach(function(line, i){
      setTimeout(function(){
        if (introHidden || !line.isConnected) return;
        if (i === greenIdx) greenApproach(line);
        else recedeAway(line);
      }, i * STAGGER);
    });
  }, HOLD);
}
function recedeAway(line){
  line.style.transformOrigin = 'center';
  line.style.willChange = 'transform, opacity';
  var DURR = 2600, s0 = null;
  function step(ts){
    if (introHidden || !line.isConnected) return;
    if(!s0) s0 = ts;
    var q = Math.min((ts - s0)/DURR, 1);
    var ease = 1 - Math.pow(1 - q, 2);
    var scale = Math.max(0.001, 1 - 0.85*ease);   // 1 → 0.15 (вдаль)
    var lift = -70*ease;                            // уплывает вверх
    var sway = Math.sin(q*Math.PI*4) * 5 * (1-q);   // покачивание, затухает
    var op = q < 0.65 ? 1 : Math.max(0, 1 - (q-0.65)/0.35);
    line.style.transform = 'translateY('+lift.toFixed(1)+'px) scale('+scale.toFixed(3)+') rotate('+sway.toFixed(2)+'deg)';
    line.style.opacity = op.toFixed(3);
    if(q < 1) requestAnimationFrame(step);
    else line.style.opacity = '0';
  }
  requestAnimationFrame(step);
}
function greenApproach(line){
  // Зум НА МЕСТЕ: не трогаем ни origin, ни выравнивание — строка остаётся
  // ровно там, где встала после роста (origin 'left center'), и просто
  // плавно увеличивается. Никакой перестановки в момент старта зума.
  line.style.willChange = 'transform';
  var GROW = 1400, g0 = null, base = 1.22;
  function grow(ts){
    if (introHidden || !line.isConnected) return;
    if(!g0) g0 = ts;
    var gp = Math.min((ts - g0)/GROW, 1);
    // S-образная easeInOutCubic: мягкий старт, плавный разгон, мягкий приход —
    // без резкого рывка в первые миллисекунды.
    var ease = gp < 0.5 ? 4*gp*gp*gp : 1 - Math.pow(-2*gp + 2, 3) / 2;
    line.style.transform = 'scale(' + (base + 0.5*ease).toFixed(3) + ')';  // 1.22 → 1.72
    if(gp < 1) requestAnimationFrame(grow);
    else setTimeout(function(){                     // зависла, затем улетает — в ту же точку, что и белые
      if (introHidden || !line.isConnected) return;
      // Белые строки уходят с origin 'center' — сходятся к центру блока (все
      // строки одинаковой ширины). Зелёная стоит на scale 1.72 с origin
      // 'left center'. Переключаем на 'center' + компенсирующий сдвиг tx:
      // в первом кадре tx совпадает с зависшим левым якорем (без рывка), к
      // концу затухает к 0 → строка сходится к тому же центру, что и белые.
      line.style.transformOrigin = 'center';
      var gScale = base + 0.5;                        // 1.72
      var w = line.offsetWidth;                       // ширина без учёта scale
      var tx0 = (gScale - 1) * w / 2;                 // компенсация левого якоря
      var FLY = 2200, f0 = null;
      function fly(ts){
        if (introHidden || !line.isConnected) return;
        if(!f0) f0 = ts;
        var q = Math.min((ts - f0)/FLY, 1);
        var ease = 1 - Math.pow(1 - q, 2);            // плавный уход
        var scale = Math.max(0.001, gScale - (gScale - 0.15)*ease); // 1.72 → 0.15 (вдаль)
        var lift = -70*ease;                          // как у белых строк
        var sway = Math.sin(q*Math.PI*4) * 5 * (1-q); // покачивание, затухает
        var tx = tx0 * (1 - ease);                    // затухает → сходится к центру блока
        var op = q < 0.65 ? 1 : Math.max(0, 1 - (q-0.65)/0.35);
        line.style.transform = 'translate('+tx.toFixed(1)+'px,'+lift.toFixed(1)+'px) scale('+scale.toFixed(3)+') rotate('+sway.toFixed(2)+'deg)';
        line.style.opacity = op.toFixed(3);
        if(q < 1) requestAnimationFrame(fly);
        else {
          introHidden = true;
          var m = document.getElementById('introMsg');
          if (m && m.parentNode) m.remove();
          // Пробуем поднять клавиатуру и в авто-финале. На iOS/WebKit без
          // пользовательского жеста фокус клавиатуру не поднимет — это
          // платформенное ограничение; на прочих платформах сработает.
          var inp = document.getElementById('userInput');
          if (inp) inp.focus();
        }
      }
      requestAnimationFrame(fly);
    }, 1500);
  }
  requestAnimationFrame(grow);
}
if(sysTag) sysTag.style.transformOrigin = 'left center';
el.style.opacity = '0'; el.style.transformOrigin = 'left center';
setTimeout(function(){
function frame(ts) {
if(!start) start = ts;
var p = Math.min((ts - start) / DUR, 1);
el.style.opacity = Math.min(1, p / 0.08).toFixed(3);
var globalS = curve(p);
el.style.transform = 'scale(' + globalS.toFixed(4) + ')';
if(sysTag) sysTag.style.transform = 'scale(' + (1/globalS).toFixed(4) + ')';
var returnStart = 0.38, step = 0.12;
lines.forEach(function(line, i) {
var ls = returnStart + i * step;
if(p < 0.35) { line.style.transform = 'none'; }
else if(p < ls) { line.style.transform = 'scale(1.06)'; line.style.transformOrigin = 'left center'; }
else {
var t2 = Math.min((p - ls) / (1 - ls), 1);
line.style.transform = 'scale(' + (1 + 0.06*(1-Math.pow(t2,0.35))).toFixed(4) + ')';
line.style.filter = 'brightness(' + (1 + 0.8*Math.pow(1-t2,3)).toFixed(2) + ')';
line.style.transformOrigin = 'left center';
}
});
if(p < 1) requestAnimationFrame(frame);
else {
el.style.transform = 'none'; el.style.opacity = '1';
if(sysTag) sysTag.style.transform = 'none';
// Сбрасываем все строки кроме последней
lines.forEach(function(l, i) {
if(i < lines.length - 1) { l.style.transform = 'none'; l.style.filter = 'none'; }
});
// Последняя строка — отдельная анимация роста
var lastLine = lines[lines.length - 1];
if(lastLine) {
lastLine.style.transform = 'none';
lastLine.style.filter = 'none';
var growDur = 900, growStart = null;
function growFrame(ts) {
if(!growStart) growStart = ts;
var gp = Math.min((ts - growStart) / growDur, 1);
var ease = 1 - Math.pow(1 - gp, 3);
lastLine.style.transform = 'scale(' + (1 + 0.22 * ease).toFixed(4) + ')';
lastLine.style.transformOrigin = 'left center';
lastLine.style.color = 'rgba(0,255,136,' + (0.5 + 0.5 * ease).toFixed(3) + ')';
if(gp < 1) requestAnimationFrame(growFrame);
else scheduleIntroExit();
}
setTimeout(function(){ requestAnimationFrame(growFrame); }, 300);
}
}
}
requestAnimationFrame(frame);
}, 500);
// Вступление НЕ растворяется само — висит до отправки шума.
// hideIntro() вызывается внутри sendMessage().
})();
// ── ЗВЁЗДНОЕ НЕБО ─────────────────────────────────────────────────────
(function sky(){
  const cv=document.getElementById('sky'), ctx=cv.getContext('2d');
  const SK={ top:"#0a1626", mid:"#070f1c", bottom:"#04080f" };
  const S={ density:1.0, maxCount:420, color:"220,235,255",
    sizeSmall:0.9, sizeBig:1.6, bigChance:0.12,
    twinkle:1.0, drift:0.02, minAlpha:0.15, maxAlpha:0.75 };
  let W,H,stars;

  // ФИКС 16.07: растр канваса брался из window.innerWidth/innerHeight —
  // это НЕ то же самое, что уже корректно посчитанный body (у него
  // `height:100vh; height:100dvh`, который на iOS учитывает схлопывание
  // адресной строки и клавиатуру правильно). innerWidth/innerHeight могут
  // на миг отдать значение ДО того, как Safari закончил анимацию смены
  // хрома — а resize-слушатель ниже был БЕЗ debounce и вызывал init()
  // синхронно, застревая с этим переходным размером: CSS-бокс канваса
  // (position:fixed;inset:0) остаётся на весь экран, а внутренний растр
  // (cv.width/height) — меньше, и там, где растра не хватает, browser
  // либо растягивает его, либо (в части браузеров) оставляет пустым —
  // просвечивает фон СТРАНИЦЫ ниже канваса. Отсюда «дыра с сеткой» на
  // скриншотах — и на iPhone, и на iPad, оба используют один и тот же код.
  //
  // Решение — три части:
  //  1) размер берём у body.clientWidth/clientHeight (тот же бокс, что уже
  //     верно резолвит dvh), а не у window.innerWidth/innerHeight;
  //  2) тот же debounce 250мс, что уже у звезды — не ловим переходные кадры;
  //  3) не пересоздаём звёзды, если размер РЕАЛЬНО не изменился — резайз
  //     на iOS может сработать несколько раз подряд почти с тем же числом.
  function getViewportSize() {
    return { w: document.body.clientWidth, h: document.body.clientHeight };
  }
  function init(){
    const { w, h } = getViewportSize();
    if (w === W && h === H) return; // размер не изменился — не трогаем звёзды зря
    W=cv.width=w; H=cv.height=h;
    const N=Math.min(S.maxCount, Math.round(W*H/3600*S.density));
    stars=Array.from({length:N},()=>({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()<S.bigChance?S.sizeBig:S.sizeSmall,
      a:S.minAlpha+Math.random()*(S.maxAlpha-S.minAlpha),
      sp:0.3+Math.random()*1.2, ph:Math.random()*Math.PI*2,
      vx:(Math.random()-0.5)*S.drift, vy:(Math.random()-0.5)*S.drift
    }));
  }
  let skyResizeT;
  function debouncedInit(){ clearTimeout(skyResizeT); skyResizeT = setTimeout(init, 250); }
  function loop(now){
    const t=now/1000;
    const bg=ctx.createLinearGradient(0,0,W,H);
    bg.addColorStop(0,'#0d1e35'); bg.addColorStop(0.5,SK.mid); bg.addColorStop(1,SK.bottom);
    ctx.globalAlpha=1; ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    for(const s of stars){
      s.x+=s.vx; s.y+=s.vy;
      if(s.x<0)s.x+=W; if(s.x>W)s.x-=W; if(s.y<0)s.y+=H; if(s.y>H)s.y-=H;
      const tw=0.4+0.6*Math.sin(t*s.sp*S.twinkle+s.ph);
      ctx.fillStyle='rgba('+S.color+','+(s.a*tw).toFixed(3)+')';
      ctx.fillRect(s.x,s.y,s.r,s.r);
    }
    requestAnimationFrame(loop);
  }
  addEventListener('resize', debouncedInit);
  // orientationchange — та же задержка 400мс, что уже у звезды: поворот
  // экрана на iOS отдаёт финальные размеры не сразу.
  addEventListener('orientationchange', () => setTimeout(init, 400));
  init(); requestAnimationFrame(loop);
})();
